<title>Publikacja odcinków YouTube</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@500;700;800&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;500&display=swap">
<style>
/* Layout: lista odcinków po lewej, pulpit publikacji po prawej (tytuły · opis · rozdziały · brief miniatury). Na telefonie jedna kolumna. */
:root{
  --bg:#F6F5F1; --surface:#FFFFFF; --ink:#1A1916; --muted:#6E6A61; --line:#E2DFD6;
  --accent:#C9810F; --accent-ink:#FFFFFF; --pick:#1F7A55;
  --display:"Archivo", "Helvetica Neue", system-ui, sans-serif;
  --body:"Source Sans 3", system-ui, -apple-system, "Segoe UI", sans-serif;
  --mono:"JetBrains Mono", ui-monospace, Menlo, monospace;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#12110F; --surface:#1B1A17; --ink:#F2EFE8; --muted:#A39E93; --line:#2E2C27;
  --accent:#F5A623; --accent-ink:#12110F; --pick:#4CC48D; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#12110F; --surface:#1B1A17; --ink:#F2EFE8; --muted:#A39E93; --line:#2E2C27;
  --accent:#F5A623; --accent-ink:#12110F; --pick:#4CC48D; color-scheme:dark }
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:16px/1.55 var(--body);margin:0}
.wrap{max-width:1280px;margin:0 auto;padding-inline:clamp(16px,3vw,32px);padding-block:20px 64px}
header{display:flex;flex-wrap:wrap;align-items:baseline;justify-content:space-between;gap:8px 24px;margin-bottom:20px}
h1{font:800 clamp(24px,3vw,32px)/1.1 var(--display);margin:0;letter-spacing:-.01em}
.sub{color:var(--muted);font-size:14px}
.layout{display:grid;grid-template-columns:280px 1fr;gap:24px;align-items:start}
@media (max-width:820px){.layout{grid-template-columns:1fr}}
.eps{display:flex;flex-direction:column;gap:6px;position:sticky;top:calc(env(safe-area-inset-top,0px) + 12px)}
@media (max-width:820px){.eps{position:static;flex-direction:row;overflow-x:auto;padding-bottom:6px}}
.ep{all:unset;cursor:pointer;display:block;padding:10px 12px;border-radius:10px;border:1px solid transparent;min-width:0}
@media (max-width:820px){.ep{flex:none;width:220px;border-color:var(--line);background:var(--surface)}}
.ep:hover{background:var(--surface)}
.ep[aria-current="true"]{background:var(--surface);border-color:var(--accent)}
.ep b{display:block;font:700 15px/1.3 var(--display)}
.ep span{font:400 12px var(--mono);color:var(--muted)}
.ep:focus-visible,.btn:focus-visible,textarea:focus-visible,input:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
main.pane{display:flex;flex-direction:column;gap:18px;min-width:0}
.panel{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:18px 20px;min-width:0}
.panel h2{font:700 13px var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:0 0 12px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}
.ephead h3{font:800 clamp(20px,2.4vw,26px)/1.2 var(--display);margin:0 0 4px;text-wrap:balance}
.ephead p{margin:0;color:var(--muted);font-size:15px}
.titles{display:flex;flex-direction:column;gap:8px}
.t{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;padding:10px 12px;border:1px solid var(--line);border-radius:10px;min-width:0}
.t.on{border-color:var(--pick);background:color-mix(in srgb,var(--pick) 8%,transparent)}
.t input[type=radio]{accent-color:var(--pick);width:18px;height:18px}
.t .txt{min-width:0}
.t .txt b{font:600 16px/1.35 var(--body);display:block;overflow-wrap:anywhere}
.t .txt span{font-size:13px;color:var(--muted)}
.len{font:500 12px var(--mono);color:var(--muted);white-space:nowrap}
.len.over{color:#C2412D}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{font:600 14px/1 var(--body);border-radius:9px;padding:10px 14px;border:1px solid var(--line);background:var(--surface);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--accent)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn[disabled]{opacity:.5;cursor:wait}
textarea{width:100%;font:15px/1.55 var(--body);padding:12px 14px;border-radius:10px;border:1px solid var(--line);background:var(--bg);color:var(--ink);resize:vertical}
textarea.mono{font:13px/1.6 var(--mono)}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}
.brief{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.brief .card{border:1px solid var(--line);border-radius:10px;padding:12px 14px;min-width:0}
.brief .card b{display:block;font:800 22px/1.15 var(--display);text-transform:uppercase;letter-spacing:-.01em;overflow-wrap:anywhere}
.brief .card span{font-size:13px;color:var(--muted)}
.empty{border:1px dashed var(--line);border-radius:14px;padding:28px;text-align:center;color:var(--muted)}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:10px;font:600 14px var(--body);z-index:9}
@media (prefers-reduced-motion:no-preference){.t,.ep{transition:border-color .15s,background .15s}}
</style>

<div class="wrap">
  <header>
    <h1>Publikacja odcinków YouTube</h1>
    <span class="sub">tytuły · opis · rozdziały · brief miniatury — kanał flowbiz</span>
  </header>
  <div class="layout">
    <nav class="eps" id="eps" aria-label="Odcinki"></nav>
    <main class="pane" id="pane">
      <div class="empty" id="empty"><b>Tu pojawią się odcinki.</b><br>Lista odcinków ładuje się z bazy strony. Jeśli jest pusta, Claude jeszcze jej nie wypełnił.</div>
    </main>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const state = { eps: [], current: null, db: null, sample: null, busy: false };
let saveTimer = null;

function toast(msg){ const t=$("toast"); t.textContent=msg; t.hidden=false; clearTimeout(toast.t); toast.t=setTimeout(()=>t.hidden=true,2400); }
function el(tag, attrs={}, ...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==="class") e.className=v; else if(k.startsWith("on")) e.addEventListener(k.slice(2),v); else if(v!==false&&v!=null) e.setAttribute(k,v===true?"":v); } for(const k of kids) if(k!=null) e.append(k); return e; }
async function copy(text, label){ try{ await navigator.clipboard.writeText(text); toast(label+" skopiowany"); } catch { toast("Zaznacz tekst i skopiuj skrótem"); } }

function fullDescription(ep){
  return [ep.description||"", "", "Rozdziały:", ep.chapters||"", "", ep.footer||""].join("\n").trim();
}

function renderList(){
  const nav=$("eps"); nav.replaceChildren();
  for(const ep of state.eps){
    const b=el("button",{class:"ep",type:"button","aria-current":String(state.current===ep.id),onclick:()=>{state.current=ep.id;render();}},
      el("b",{},ep.label), el("span",{},`${ep.length||""} · ${ep.status||"szkic"}`));
    nav.append(b);
  }
}

function render(){
  renderList();
  const ep = state.eps.find(e=>e.id===state.current);
  const pane=$("pane");
  if(!ep){ pane.replaceChildren($("empty")); $("empty").hidden=false; return; }
  const titles = ep.titles||[];
  const chosen = ep.chosenTitle ?? 0;

  const titleList = el("div",{class:"titles"});
  titles.forEach((t,i)=>{
    const len=t.text.length;
    titleList.append(el("label",{class:"t"+(i===chosen?" on":"")},
      el("input",{type:"radio",name:"title",checked:i===chosen,onchange:()=>{ep.chosenTitle=i;persist(ep,{chosenTitle:i});render();}}),
      el("span",{class:"txt"}, el("b",{},t.text), t.angle?el("span",{},t.angle):null),
      el("span",{class:"len"+(len>70?" over":"")},`${len}/70`)));
  });

  const desc = el("textarea",{id:"desc",rows:"7"}); desc.value=ep.description||"";
  desc.addEventListener("input",()=>{ep.description=desc.value;persist(ep,{description:desc.value});});
  const chap = el("textarea",{id:"chap",class:"mono",rows:"8"}); chap.value=ep.chapters||"";
  chap.addEventListener("input",()=>{ep.chapters=chap.value;persist(ep,{chapters:chap.value});});
  const foot = el("textarea",{id:"foot",rows:"4"}); foot.value=ep.footer||"";
  foot.addEventListener("input",()=>{ep.footer=foot.value;persist(ep,{footer:foot.value});});

  const brief = el("div",{class:"brief"});
  for(const b of (ep.thumbs||[])) brief.append(el("div",{class:"card"}, el("b",{},b.text), el("span",{},b.scene)));

  const genTitles = el("button",{class:"btn",type:"button",disabled:!state.sample||state.busy,onclick:()=>generateTitles(ep)},"Nowe propozycje od Claude");
  const genDesc = el("button",{class:"btn",type:"button",disabled:!state.sample||state.busy,onclick:()=>generateDescription(ep)},"Przepisz opis");

  pane.replaceChildren(
    el("section",{class:"panel ephead"}, el("h3",{},ep.label), el("p",{},ep.summary||"")),
    el("section",{class:"panel"},
      el("h2",{},"Tytuł", el("span",{class:"btns"}, genTitles,
        el("button",{class:"btn primary",type:"button",onclick:()=>copy(titles[chosen]?.text||"","Tytuł")},"Kopiuj wybrany"))),
      titles.length?titleList:el("p",{class:"note"},"Brak propozycji."),
      el("p",{class:"note"},"YouTube pokazuje ok. 70 znaków; w wynikach na telefonie mniej. Liczba i konkret na początku tytułu.")),
    el("section",{class:"panel"},
      el("h2",{},"Opis", el("span",{class:"btns"}, genDesc,
        el("button",{class:"btn primary",type:"button",onclick:()=>copy(fullDescription(ep),"Opis z rozdziałami")},"Kopiuj całość"))),
      desc,
      el("h2",{style:"margin-top:16px"},"Rozdziały"), chap,
      el("p",{class:"note"},"Pierwszy rozdział musi zaczynać się od 0:00; minimum trzy, każdy co najmniej 10 s."),
      el("h2",{style:"margin-top:16px"},"Stopka (linki, kontakt)"), foot),
    el("section",{class:"panel"},
      el("h2",{},"Brief miniatury", el("span",{class:"btns"},
        el("button",{class:"btn",type:"button",onclick:()=>copy((ep.thumbs||[]).map(b=>`${b.text} — ${b.scene}`).join("\n"),"Brief")},"Kopiuj brief"))),
      (ep.thumbs||[]).length?brief:el("p",{class:"note"},"Brak briefu."),
      el("p",{class:"note"},"Miniatury robi agent grafik (flowbiz-automation-unlocked). Hasło 2–4 słowa, twarz, jedna scena."))
  );
}

function persist(ep, patch){
  if(!state.db) return;
  clearTimeout(saveTimer);
  saveTimer=setTimeout(async()=>{ try{ await state.db.doc("episodes/"+ep.id).update(patch); } catch(e){ toast("Nie zapisano zmian. Sprawdź uprawnienia."); } },600);
}

async function generateTitles(ep){
  state.busy=true; render();
  try{
    const out = await state.sample.json(
      `Jesteś copywriterem kanału YouTube "flowbiz" (Mateusz Kozłowski, wdrożenia AI i automatyzacji dla firm produkcyjnych i handlowych z Pomorza).
Zaproponuj 6 tytułów odcinka po polsku. Zasady: maks. 70 znaków, konkret i liczba z odcinka na początku, problem widza zamiast nazwy technologii, bez clickbaitu, bez nazw klientów, bez emoji.
Odcinek: ${ep.label}
O czym: ${ep.summary}
Rozdziały:
${ep.chapters}
Zwróć JSON: [{"text": "...", "angle": "krótko: dlaczego zadziała"}]`, {modelTier:"default"});
    if(Array.isArray(out)&&out.length){ ep.titles=[...out.filter(t=>t&&t.text),...(ep.titles||[])].slice(0,12); ep.chosenTitle=0; persist(ep,{titles:ep.titles,chosenTitle:0}); toast("Dodano propozycje"); }
  } catch(e){ toast(e?.code==="rate_limited"?"Za dużo zapytań. Spróbuj za chwilę.":"Nie udało się wygenerować."); }
  state.busy=false; render();
}

async function generateDescription(ep){
  state.busy=true; render();
  try{
    const { text } = await state.sample(
      `Napisz opis odcinka YouTube po polsku dla kanału flowbiz (Mateusz Kozłowski, wdrożenia AI i automatyzacji, Pomorze).
Zasady: pierwsze dwa zdania mają sens bez rozwijania (problem widza + co zobaczy), potem 2–3 krótkie akapity, bez emoji, bez nazw klientów, bez wymyślonych liczb — tylko te z materiału. Nie dodawaj rozdziałów ani linków.
Odcinek: ${ep.label}
O czym: ${ep.summary}
Rozdziały:
${ep.chapters}
Obecny opis (do poprawy):
${ep.description}`, {modelTier:"default"});
    if(text){ ep.description=text.trim(); persist(ep,{description:ep.description}); toast("Opis przepisany"); }
  } catch(e){ toast(e?.code==="rate_limited"?"Za dużo zapytań. Spróbuj za chwilę.":"Nie udało się przepisać."); }
  state.busy=false; render();
}

render();
(async()=>{
  const c=window.claude; if(!c?.use) return;
  const [db,sample]=await Promise.all([c.use("db"),c.use("sample")]);
  state.db=db; state.sample=sample;
  if(!db){ $("empty").textContent="Baza odcinków jest niedostępna w tym widoku. Otwórz stronę w claude.ai."; return; }
  db.collection("episodes").onSnapshot(s=>{
    state.eps=s.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.order||0)-(b.order||0));
    if(!state.current&&state.eps.length) state.current=state.eps[0].id;
    if(!document.activeElement||document.activeElement.tagName!=="TEXTAREA") render(); else renderList();
  },()=>toast("Utracono połączenie z bazą. Odśwież stronę."));
})();
</script>

<!doctype html>
<html lang="pl"><head><meta charset="utf-8"><title>TAGO chaos → system</title>
<!-- Kompozycja deterministyczna: await window.seek(t) ustawia klatkę dla czasu t (s).
     Warstwy ruchome to sekwencje klatek JPG (klipy Kling + nagranie prototypu z assets/recordings),
     przygotowane przez build-video.sh do katalogu podanego w ?frames=<file-url>. -->
<style>
:root{--green:#0c3b2e;--green2:#082a21;--gold:#c8a55a;--cream:#f5f0e7}
*{box-sizing:border-box;margin:0;padding:0}
html,body{width:1920px;height:1080px;overflow:hidden;background:var(--green2);font-family:"Helvetica Neue",Helvetica,Arial,sans-serif}
.scene{position:absolute;inset:0;opacity:0;overflow:hidden}
.media{position:absolute;inset:0;width:1920px;height:1080px;transform-origin:0 0}
.lower{position:absolute;left:0;right:0;bottom:0;height:300px;background:linear-gradient(to top,rgba(8,42,33,.95) 0%,rgba(8,42,33,.8) 45%,rgba(8,42,33,0) 100%)}
.cap{position:absolute;left:120px;right:120px;bottom:84px;color:var(--cream);font-size:56px;font-weight:700;line-height:1.15;letter-spacing:-.5px}
.cap .num{color:var(--gold)}
.chip{position:absolute;left:120px;top:72px;padding:12px 24px;border-radius:999px;font-size:24px;font-weight:700;letter-spacing:3px;text-transform:uppercase}
.chip.bad{background:rgba(192,57,43,.92);color:#fff}
.chip.good{background:var(--gold);color:var(--green2)}
.rec .bar{position:absolute;left:0;right:0;bottom:0;height:150px;background:rgba(8,42,33,.94);display:flex;align-items:center;gap:30px;padding:0 70px}
.rec .bar .step{color:var(--gold);font-size:24px;font-weight:700;letter-spacing:3px;white-space:nowrap}
.rec .bar .t{color:var(--cream);font-size:44px;font-weight:700;line-height:1.15}
.board{background:var(--green)}
.board .big{position:absolute;left:0;right:0;top:50%;transform:translateY(-50%);text-align:center;color:var(--gold);font-size:76px;font-weight:700;padding:0 160px;line-height:1.2}
.board .small{position:absolute;left:0;right:0;bottom:120px;text-align:center}
</style></head><body>
<div id="stage"></div>
<script>
const Q = new URLSearchParams(location.search);
const FR = Q.get('frames') || 'frames/';
const COUNTS = JSON.parse(Q.get('counts') || '{}');
const S = '../assets/brand/';
const FPS = 30, FADE = 0.5, VO_DELAY = 0.3;
// d = długość sceny; vo = numer kwestii lektora (assets/voice/<n>.mp3). Liczby wyłącznie twarde.
// rec: fragment nagrania prototypu [from, to] w sekundach; po dojściu do `to` stop-klatka do końca sceny.
const scenes = [
  {type:'ai', dir:'ai1', d:6.4, vo:1, chip:'bad', cap:'<span class="num">40</span> dostawców. Jedna skrzynka.'},
  {type:'ai', dir:'ai3', d:8.4, vo:2, chip:'bad', cap:'Jeden wyrób — około <span class="num">10</span> elementów opakowania, każdy od kogoś innego.'},
  {type:'ai', dir:'ai4', d:6.9, vo:3, chip:'bad', cap:'<span class="num">Trzy</span> poziomy opakowania. <span class="num">Dwie</span> ścieżki marki.'},
  {type:'ai', dir:'ai5', d:6.4, vo:4, chip:'bad', cap:'Dostawca zmienia folię. Deklaracja o tym nie wie.'},
  {type:'ai', dir:'ai6', d:7.1, vo:5, chip:'bad', cap:'Co miesiąc: telefony, maile, przypomnienia — ręcznie.'},
  {type:'ai', dir:'ai2', d:6.5, vo:6, chip:'bad', cap:'<span class="num">626</span> komponentów. Cała wiedza w głowie jednej osoby.'},
  {type:'board', d:3.2, vo:7, big:'A przepisów będzie przybywać.'},
  {type:'ai', dir:'ai7', d:8.3, vo:8, chip:'good', cap:'Dokument wpada — system sam go przypisuje.'},
  {type:'rec', from:6.6, to:13.4, d:9.0, vo:9, zoom:[1.0, 1.1, 0, 0], step:'PPWR SMART · 1', t:'Brakuje dokumentu? Wyrób zablokowany. Przypomnienie wychodzi jednym kliknięciem.'},
  {type:'rec', from:13.4, to:22.5, d:9.1, vo:10, zoom:[1.1, 1.18, 1, 0], step:'PPWR SMART · 2', t:'Dostawca widzi tylko swoje opakowania. Uzupełnia i wysyła.'},
  {type:'rec', from:22.5, to:32.5, d:10.0, vo:11, zoom:[1.1, 1.0, 0, 0], step:'PPWR SMART · 3', t:'TAGO akceptuje — wyrób się odblokowuje.'},
  {type:'rec', from:33.0, to:37.8, d:7.9, vo:12, zoom:[1.0, 1.08, 0.5, 0], step:'PPWR SMART · 4', t:'Zmiana u dostawcy = nowa wersja deklaracji. Stara zostaje w historii.'},
  {type:'rec', from:38.0, to:41.9, d:6.6, vo:13, zoom:[1.0, 1.1, 0.5, 0.1], step:'PPWR SMART · 5', t:'Jeden widok: co gotowe, co czeka, kto zalega.'},
  {type:'ai', dir:'ai8', d:5.0, vo:14, chip:'good', cap:'System pilnuje dostawców za Państwa.'},
  {type:'board', d:7.0, vo:15, size:60, logo:true, big:'Ile to dziś kosztuje Państwa zespół —<br>zmierzymy razem w pilotażu na dwóch wyrobach.'},
];

const stage = document.getElementById('stage');
let t0 = 0;
for (const s of scenes) {
  s.start = t0; t0 += s.d - FADE;
  const el = document.createElement('div'); el.className = 'scene ' + s.type;
  if (s.type === 'ai') el.innerHTML = `<img class="media"><div class="lower"></div><div class="chip ${s.chip}">${s.chip === 'bad' ? 'Dziś, bez systemu' : 'Z PPWR Smart'}</div><div class="cap">${s.cap}</div>`;
  else if (s.type === 'rec') el.innerHTML = `<img class="media"><div class="bar"><div class="step">${s.step}</div><div class="t">${s.t}</div></div>`;
  else el.innerHTML = `<div class="big" style="${s.size ? 'font-size:' + s.size + 'px' : ''}">${s.big}</div>` + (s.logo ? `<div class="small"><img src="${S}lockup-inverse.svg" style="height:56px"></div>` : '');
  stage.appendChild(el); s.el = el; s.img = el.querySelector('img.media');
}
const TOTAL = t0 + FADE;
window.TOTAL = TOTAL;
window.TIMELINE = scenes.map(s => ({ start: s.start, d: s.d, vo: s.vo, voAt: s.start + VO_DELAY }));

const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const ease = x => x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;
const lerp = (a, b, p) => a + (b - a) * p;
const pad = n => String(n).padStart(4, '0');
const setFrame = (img, src) => img.getAttribute('src') === src ? Promise.resolve() : new Promise(r => { img.onload = img.onerror = () => r(); img.src = src; });

window.seek = async function (t) {
  const waits = [];
  for (const s of scenes) {
    const lt = t - s.start;
    const first = s === scenes[0];
    let op = lt < 0 || lt > s.d ? 0 : Math.min(first ? 1 : clamp(lt / FADE), clamp((s.d - lt) / FADE));
    s.el.style.opacity = op;
    if (op === 0) continue;
    if (s.type === 'ai') {
      const n = Math.min(Math.floor(lt * FPS) + 1, COUNTS[s.dir] || 1e9);
      waits.push(setFrame(s.img, `${FR}${s.dir}/${pad(n)}.jpg`));
      const cp = ease(clamp((lt - 0.4) / 0.7));
      const cap = s.el.querySelector('.cap'); cap.style.opacity = cp; cap.style.transform = `translateY(${(1 - cp) * 30}px)`;
      s.el.querySelector('.chip').style.opacity = ease(clamp((lt - 0.2) / 0.5));
    } else if (s.type === 'rec') {
      const vt = Math.min(s.from + lt, s.to);
      waits.push(setFrame(s.img, `${FR}rec/${pad(Math.min(Math.floor(vt * FPS) + 1, COUNTS.rec || 1e9))}.jpg`));
      const [z0, z1, ox, oy] = s.zoom, z = lerp(z0, z1, ease(clamp(lt / s.d)));
      // ox/oy = punkt zaczepienia przybliżenia (0 = lewa/górna krawędź, 1 = prawa/dolna)
      s.img.style.transform = `translate(${-(z - 1) * 1920 * ox}px,${-(z - 1) * 1080 * oy}px) scale(${z})`;
      const bp = ease(clamp((lt - 0.2) / 0.6)); const bar = s.el.querySelector('.bar'); bar.style.transform = `translateY(${(1 - bp) * 150}px)`;
    } else {
      const bp = ease(clamp((lt - 0.2) / 0.8)); const big = s.el.querySelector('.big'); big.style.opacity = bp; big.style.transform = `translateY(calc(-50% + ${(1 - bp) * 24}px))`;
    }
  }
  document.body.style.filter = t > TOTAL - 0.8 ? `brightness(${clamp((TOTAL - t) / 0.8)})` : '';
  await Promise.all(waits);
};
</script>
</body></html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 02 — 8 MIESIĘCY · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s02-label{
    position:absolute;left:0;right:0;top:320px;text-align:center;
    font-size:28px;font-weight:600;color:#3A3630;
    letter-spacing:0.36em;text-transform:uppercase;
    opacity:0;
  }
  .s02-main{
    position:absolute;left:0;right:0;top:400px;text-align:center;
    font-size:280px;font-weight:900;color:#F5A623;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;transform:translateX(120px);
    will-change:transform,opacity;
  }
  .strike{
    position:absolute;left:0;right:0;top:0;width:100%;height:100%;
    pointer-events:none;
  }
  .s02-sub{
    position:absolute;left:0;right:0;top:760px;text-align:center;
    font-size:48px;font-weight:600;color:#5A5450;
  }
  .s02-sub .w{display:inline-block;opacity:0;transform:translateY(15px);margin:0 8px;}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="s02-label" id="label"><span class="chroma-plate amber">W LOW-CODE</span></div>
      <div class="s02-main"  id="main">8 MIESIĘCY</div>
      <svg class="strike" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <line id="strike" x1="430" y1="640" x2="1490" y2="430"
              stroke="#C0553A" stroke-width="8" stroke-linecap="round"
              pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" />
      </svg>
      <div class="s02-sub" id="sub">
        <span class="w"><span class="chroma-plate">Retool.</span></span>
        <span class="w"><span class="chroma-plate">Low-code.</span></span>
        <span class="w"><span class="chroma-plate">Sufit.</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  tl.to("#label", { opacity:1, duration:0.30, ease:"power2.out" }, 0.0);

  tl.to("#main", { opacity:1, x:0, duration:0.45, ease:"back.out(1.7)" }, 0.2);

  // 0.7s — words stagger in
  tl.to(".s02-sub .w", {
    opacity:1, y:0, duration:0.35, ease:"power2.out", stagger:0.08
  }, 0.7);

  // 1.5s — diagonal red strike-through
  tl.to("#strike", { strokeDashoffset:0, duration:0.25, ease:"power2.out" }, 1.5);

  // Hold tail
  tl.to({}, { duration: 0.5 }, 2.0);

  flowbizScene.init({
    id: "scene-02",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 02 · 8 MIESIĘCY · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

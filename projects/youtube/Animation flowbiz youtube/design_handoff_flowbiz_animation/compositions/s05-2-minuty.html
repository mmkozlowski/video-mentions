<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 05 — 2 MINUTY · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s05-row{
    position:absolute;left:0;right:0;top:280px;
    display:flex;align-items:center;justify-content:center;gap:60px;
  }
  .s05-arrow{
    font-size:180px;font-weight:700;color:#F5A623;line-height:1;
    opacity:0;transform:translateX(-200px);
    will-change:transform,opacity;
  }
  .s05-num{
    font-size:480px;font-weight:900;color:#F5A623;
    letter-spacing:-0.04em;line-height:1;
    opacity:0;transform:translateX(160px) scale(0.7);
    filter:drop-shadow(0 0 0 rgba(245,166,35,0));
    will-change:transform,opacity,filter;
  }
  .s05-unit{
    position:absolute;left:0;right:0;top:840px;text-align:center;
    font-size:72px;font-weight:700;color:#F5A623;
    letter-spacing:0.18em;
    opacity:0;transform:translateY(30px);
  }
  .s05-pulse{
    position:absolute;left:50%;top:530px;
    width:340px;height:340px;border:6px solid #F5A623;border-radius:50%;
    transform:translate(-50%,-50%) scale(0);
    opacity:0.3;
    pointer-events:none;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="s05-row">
        <div class="s05-arrow" id="arrow">→</div>
        <div class="s05-num"   id="num">2</div>
      </div>
      <div class="s05-pulse" id="pulse"></div>
      <div class="s05-unit"  id="unit">MINUTY</div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  // 0.0s — arrow shoots in from left
  tl.to("#arrow", { opacity:1, x:0, duration:0.3, ease:"power4.out" }, 0.0);

  // 0.25s — "2" springs from right + scale overshoot + glow
  tl.to("#num", {
    opacity:1, x:0, scale:1.05,
    filter:"drop-shadow(0 0 60px rgba(245,166,35,0.5))",
    duration:0.45, ease:"back.out(1.7)"
  }, 0.25);
  tl.to("#num", { scale:1.0, duration:0.15, ease:"power2.out" }, 0.70);

  // 0.75s — unit bounces in below
  tl.to("#unit", { opacity:1, y:0, duration:0.35, ease:"back.out(1.7)" }, 0.75);

  // 1.2s — celebration pulse ring
  tl.fromTo("#pulse",
    { scale:0, opacity:0.35 },
    { scale:3,  opacity:0,    duration:0.6, ease:"power2.out" },
    1.2
  );

  // Hold tail
  tl.to({}, { duration: 0.6 }, 1.9);

  flowbizScene.init({
    id: "scene-05",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 05 · → 2 MINUTY · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

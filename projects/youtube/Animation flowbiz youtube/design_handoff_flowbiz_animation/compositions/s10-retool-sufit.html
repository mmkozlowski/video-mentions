<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 10 — RETOOL. SUFIT. · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s10-shake{ position:absolute;inset:0; }
  .s10-label{
    position:absolute;left:160px;top:180px;
    font-size:24px;font-weight:600;color:#3A3630;
    letter-spacing:0.42em;text-transform:uppercase;
    opacity:0;
  }
  .s10-l1{
    position:absolute;left:160px;top:240px;
    font-size:260px;font-weight:900;color:#FAF8F0;
    letter-spacing:-0.03em;line-height:1;
    opacity:0;transform:translateX(-100px);
  }
  .s10-l2{
    position:absolute;left:160px;top:520px;
    font-size:120px;font-weight:700;color:#5A5450;
    letter-spacing:-0.02em;line-height:1;
    opacity:0;transform:translateX(-80px);
  }
  .s10-l3{
    position:absolute;left:160px;top:680px;
    font-size:260px;font-weight:900;color:#C0553A;
    letter-spacing:-0.03em;line-height:1;
    opacity:0;transform:translateX(-100px);
  }
  .s10-slam{
    position:absolute;left:0;right:0;top:660px;
    height:5px;background:#C0553A;
    opacity:0;
    transform-origin:left center;
    transform:scaleX(0);
    z-index:4;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="s10-shake" id="shake">
      <div class="scene">
        <div class="s10-label" id="label" style="font-size: 40px"><span class="chroma-plate amber">RETOOL</span></div>
        <div class="s10-l1" id="l1">LOW CODE</div>
        <div class="s10-l2" id="l2"><span class="chroma-plate">TRAFIŁ W</span></div>
        <div class="s10-slam" id="slam"></div>
        <div class="s10-l3" id="l3">SUFIT.</div>
      </div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  tl.to("#label", { opacity:1, duration:0.30, ease:"power2.out" }, 0.0);
  tl.to("#l1", { opacity:1, x:0, duration:0.40, ease:"back.out(1.6)" }, 0.15);
  tl.to("#l2", { opacity:1, x:0, duration:0.38, ease:"back.out(1.6)" }, 0.35);
  tl.to("#l3", { opacity:1, x:0, duration:0.45, ease:"back.out(1.6)" }, 0.55);

  // 1.0s — red horizontal line slams down across the top of SUFIT
  tl.to("#slam", { opacity:1, scaleX:1, duration:0.20, ease:"power4.out" }, 1.0);
  // Tiny bounce y ±4px, 2 cycles
  tl.to("#slam", { y:-4, duration:0.075, ease:"power2.out" }, 1.20);
  tl.to("#slam", { y: 0, duration:0.075, ease:"power2.in"  }, 1.275);
  tl.to("#slam", { y: 4, duration:0.075, ease:"power2.out" }, 1.35);
  tl.to("#slam", { y: 0, duration:0.075, ease:"power2.in"  }, 1.425);

  // Micro-shake on impact
  tl.to("#shake", { x:-5, duration:0.05, ease:"none" }, 1.00);
  tl.to("#shake", { x: 5, duration:0.05, ease:"none" }, 1.05);
  tl.to("#shake", { x:-3, duration:0.05, ease:"none" }, 1.10);
  tl.to("#shake", { x: 0, duration:0.05, ease:"none" }, 1.15);

  // Hold tail
  tl.to({}, { duration: 0.7 }, 1.8);

  flowbizScene.init({
    id: "scene-10",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 10 · RETOOL. SUFIT. · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 15 — GIGANTYCZNY PRZESKOK · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s15-l1{
    position:absolute;left:0;right:0;top:400px;text-align:center;
    font-size:188px;font-weight:900;color:#FAF8F0;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;transform:translateX(-250px);
  }
  .s15-l2{
    position:absolute;left:0;right:0;top:600px;text-align:center;
    font-size:188px;font-weight:900;color:#F5A623;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;transform:translateX(250px);
    will-change:transform,opacity,text-shadow;
  }
  .s15-sub{
    position:absolute;left:0;right:0;top:840px;text-align:center;
    font-size:38px;font-weight:500;color:#3A3630;
    opacity:0;transform:translateY(16px);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <!-- no grid -->
    <div class="scene">
      <div class="s15-l1"  id="l1">GIGANTYCZNY</div>
      <div class="s15-l2"  id="l2">PRZESKOK.</div>
      <div class="s15-sub" id="sub"><span class="chroma-plate">w świecie systemów ERP</span></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  tl.to("#l1", { opacity:1, x:0, duration:0.40, ease:"power4.out" }, 0.0);
  tl.to("#l2", { opacity:1, x:0, duration:0.40, ease:"power4.out" }, 0.18);

  // 0.7s — amber glow on PRZESKOK
  tl.to("#l2",
    { textShadow:"0 0 50px rgba(245,166,35,0.55), 0 0 90px rgba(245,166,35,0.25)",
      duration:0.5, ease:"power2.out" },
    0.7
  );

  // 1.0s — subtitle
  tl.to("#sub", { opacity:1, y:0, duration:0.35, ease:"power2.out" }, 1.0);

  // Hold tail
  tl.to({}, { duration: 1.0 }, 1.5);

  flowbizScene.init({
    id: "scene-15",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 15 · GIGANTYCZNY PRZESKOK · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 13 — Z SYSTEMEM ROZMAWIASZ. · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s13-quote{
    position:absolute;left:160px;top:200px;
    font-size:200px;font-weight:900;color:#F5A623;line-height:1;
    opacity:0;transform:scale(0);
    transform-origin:left top;
  }
  .s13-l1{
    position:absolute;left:340px;top:340px;
    font-size:160px;font-weight:900;color:#FAF8F0;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;transform:translateX(-80px);
  }
  .s13-l2-wrap{
    position:absolute;left:340px;top:530px;
    display:inline-block;
  }
  .s13-l2{
    font-size:160px;font-weight:900;color:#F5A623;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;transform:translateX(-80px);
    display:inline-block;
  }
  .s13-rule{
    position:absolute;left:0;bottom:-12px;height:4px;background:#F5A623;
    width:0;
  }
  .s13-sub{
    position:absolute;left:340px;top:760px;
    font-size:52px;font-weight:500;color:#5A5450;
    opacity:0;transform:translateY(20px);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <!-- no grid -->
    <div class="scene">
      <div class="s13-quote" id="q">❝</div>
      <div class="s13-l1" id="l1">Z SYSTEMEM</div>
      <div class="s13-l2-wrap">
        <span class="s13-l2" id="l2">ROZMAWIASZ.</span>
        <div class="s13-rule" id="rule"></div>
      </div>
      <div class="s13-sub" id="sub"><span class="chroma-plate">Nie wyklikujesz go.</span></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  // 0.0s — quote mark spring in
  tl.to("#q", { opacity:1, scale:1.10, duration:0.30, ease:"power3.out" }, 0.0);
  tl.to("#q", { scale:1.0, duration:0.15, ease:"power2.out" }, 0.30);

  // 0.2s — Z SYSTEMEM
  tl.to("#l1", { opacity:1, x:0, duration:0.4, ease:"back.out(1.6)" }, 0.2);

  // 0.38s — ROZMAWIASZ.
  tl.to("#l2", { opacity:1, x:0, duration:0.4, ease:"back.out(1.6)" }, 0.38);

  // 0.9s — amber underline (approx width of "ROZMAWIASZ." @ 160px DM Sans 900 ≈ 1180px)
  tl.to("#rule", { width:1180, duration:0.4, ease:"power2.inOut" }, 0.9);

  // 1.3s — subtitle
  tl.to("#sub", { opacity:1, y:0, duration:0.38, ease:"power2.out" }, 1.3);

  // Hold tail
  tl.to({}, { duration: 0.8 }, 1.7);

  flowbizScene.init({
    id: "scene-13",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 13 · Z SYSTEMEM ROZMAWIASZ · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

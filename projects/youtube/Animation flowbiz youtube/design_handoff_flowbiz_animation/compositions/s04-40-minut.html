<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 04 — 40 MINUT · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s04-label{
    position:absolute;left:0;right:0;top:220px;text-align:center;
    font-size:26px;font-weight:600;color:#3A3630;
    letter-spacing:0.32em;text-transform:uppercase;
    opacity:0;
  }
  .s04-number-wrap{
    position:absolute;left:0;right:0;top:300px;text-align:center;
    will-change:transform;
  }
  .s04-number{
    display:inline-block;
    font-size:480px;font-weight:900;color:#2E2C28;
    letter-spacing:-0.04em;line-height:1;
    opacity:0;transform:translateY(-180px);
    will-change:transform,opacity;
    position:relative;
  }
  .s04-tint{
    position:absolute;inset:-20px -40px;
    background:rgba(192,85,58,0.04);
    opacity:0;pointer-events:none;
  }
  .s04-unit{
    position:absolute;left:0;right:0;top:840px;text-align:center;
    font-size:72px;font-weight:700;color:#3A3630;
    letter-spacing:0.18em;
    opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="s04-label" id="label"><span class="chroma-plate amber">WYSTAWIENIE JEDNEJ OFERTY</span></div>
      <div class="s04-number-wrap" id="shake">
        <span class="s04-number chroma-plate" id="num">40<span class="s04-tint" id="tint"></span></span>
      </div>
      <div class="s04-unit" id="unit"><span class="chroma-plate">MINUT</span></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  tl.to("#label", { opacity:1, duration:0.35, ease:"power2.out" }, 0.0);

  // Number drops heavily — no spring, thud
  tl.to("#num", { opacity:1, y:0, duration:0.5, ease:"power3.out" }, 0.1);

  // Unit fades in after the number lands
  tl.to("#unit", { opacity:1, duration:0.3, ease:"power2.out" }, 0.6);

  // 1.0s — subtle red tint creeps in (psychological)
  tl.to("#tint", { opacity:1, duration:0.5, ease:"power2.inOut" }, 1.0);

  // 1.5s — uncomfortable micro-shake
  tl.to("#shake", { x:-3, duration:0.05, ease:"none" }, 1.50);
  tl.to("#shake", { x: 3, duration:0.05, ease:"none" }, 1.55);
  tl.to("#shake", { x:-3, duration:0.05, ease:"none" }, 1.60);
  tl.to("#shake", { x: 0, duration:0.05, ease:"none" }, 1.65);

  // Hold tail
  tl.to({}, { duration: 0.7 }, 1.8);

  flowbizScene.init({
    id: "scene-04",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 04 · 40 MINUT · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

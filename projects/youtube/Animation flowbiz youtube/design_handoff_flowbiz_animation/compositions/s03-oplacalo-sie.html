<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 03 — Opłacało się · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s03-main{
    position:absolute;left:0;right:0;top:50%;text-align:center;
    transform:translateY(-58%);
    font-size:200px;font-weight:900;color:#FAF8F0;
    letter-spacing:-0.025em;line-height:1;
    opacity:0;
    will-change:transform,opacity,text-shadow;
  }
  .s03-label{
    position:absolute;left:0;right:0;top:660px;text-align:center;
    font-size:28px;font-weight:600;color:#3A3630;
    letter-spacing:0.04em;
    opacity:0;transform:translateY(20px);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <!-- no grid — clean cinematic -->
    <div class="scene">
      <div class="s03-main"  id="main">Opłacało się.</div>
      <div class="s03-label" id="label"><span class="chroma-plate amber">Open Mercato — case study: szwalnia</span></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  // 0.1s — scale spring in with overshoot
  tl.fromTo("#main",
    { opacity:0, scale:0 },
    { opacity:1, scale:1.08, duration:0.42, ease:"power3.out" },
    0.1
  );
  tl.to("#main", { scale:1.0, duration:0.18, ease:"power2.out" }, 0.52);

  // 0.7s — amber bloom on text
  tl.to("#main",
    { textShadow:"0 0 40px rgba(245,166,35,0.55), 0 0 80px rgba(245,166,35,0.25)",
      duration:0.35, ease:"power2.out" },
    0.7
  );
  tl.to("#main",
    { textShadow:"0 0 20px rgba(245,166,35,0.35), 0 0 40px rgba(245,166,35,0.15)",
      duration:0.25, ease:"power2.inOut" },
    1.05
  );

  // 1.2s — case-study label
  tl.to("#label", { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 1.2);

  // Hold tail
  tl.to({}, { duration: 0.7 }, 1.8);

  flowbizScene.init({
    id: "scene-03",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 03 · Opłacało się · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

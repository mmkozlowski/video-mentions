<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 12 — Node graph: Open Mercato moduły · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s12-lines{ position:absolute;inset:0;z-index:1;pointer-events:none; }

  .s12-root{
    position:absolute;left:50%;top:180px;
    width:460px;height:80px;border-radius:40px;
    border:2px solid #F5A623;background:rgba(245,166,35,0.06);
    transform:translate(-50%,0) scale(0);
    display:flex;align-items:center;justify-content:center;
    font-size:34px;font-weight:700;color:#F5A623;letter-spacing:0.08em;
    z-index:3;
  }

  .s12-cards{ position:absolute;inset:0;z-index:2;pointer-events:none; }
  .s12-card{
    position:absolute;top:500px;
    width:240px;height:200px;border-radius:20px;
    border:1.5px solid rgba(245,166,35,0.18);background:#0D0D0B;
    transform:translateX(-50%) scale(0);
    opacity:0;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    padding:18px 12px 14px;
    text-align:center;
  }
  .s12-card i{ font-size:52px;color:#F5A623;line-height:1;opacity:0;transform:translateY(6px); }
  .s12-card .name{ font-size:26px;font-weight:700;color:#FAF8F0;margin-top:12px;opacity:0;transform:translateY(6px); }
  .s12-card .desc{ font-size:18px;font-weight:500;color:#5A5450;margin-top:6px;opacity:0;transform:translateY(6px); }
  .s12-card.green .desc{ color:#6BAA6B; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <svg class="s12-lines" id="lines" viewBox="0 0 1920 1080" aria-hidden="true"></svg>

    <div class="scene">
      <div class="s12-root" id="root">OPEN MERCATO</div>
      <div class="s12-cards" id="cards"></div>
    </div>
  </div>
</div>

<script>
  const MODULES = [
    { icon:"ti ti-database", name:"CRM",         desc:"klienci + oferty" },
    { icon:"ti ti-robot",    name:"AI Agent",    desc:"rozmawiasz z nim" },
    { icon:"ti ti-shield",   name:"Dostęp",      desc:"kto co widzi" },
    { icon:"ti ti-building", name:"Multi-firma", desc:"osobne dane" },
    { icon:"ti ti-coin",     name:"Licencja",    desc:"zero opłat", green:true },
  ];

  const cards = document.getElementById('cards');
  const lines = document.getElementById('lines');

  // 5 cards evenly across 1600px wide band, centered (160px side margins)
  const POS_X = [280, 620, 960, 1300, 1640];   // card center x
  const CARD_TOP = 500;

  // Root bottom anchor for the connector
  const ROOT_X = 960, ROOT_BOTTOM_Y = 260;

  MODULES.forEach((m, i) => {
    const cx = POS_X[i];

    // Card
    const card = document.createElement('div');
    card.className = 's12-card' + (m.green ? ' green' : '');
    card.style.left = cx + 'px';
    card.dataset.idx = i;
    card.innerHTML = `
      <i class="${m.icon}"></i>
      <div class="name">${m.name}</div>
      <div class="desc">${m.desc}</div>
    `;
    cards.appendChild(card);

    // Connector (cubic bezier, gentle bow)
    const dy = CARD_TOP - ROOT_BOTTOM_Y;
    const path = document.createElementNS("http://www.w3.org/2000/svg", "path");
    path.setAttribute("d",
      `M ${ROOT_X} ${ROOT_BOTTOM_Y}
       C ${ROOT_X} ${ROOT_BOTTOM_Y + dy*0.55},
         ${cx} ${ROOT_BOTTOM_Y + dy*0.45},
         ${cx} ${CARD_TOP}`);
    path.setAttribute("fill", "none");
    path.setAttribute("stroke", "#F5A623");
    path.setAttribute("stroke-opacity", "0.22");
    path.setAttribute("stroke-width", "2");
    path.setAttribute("pathLength", "1");
    path.setAttribute("stroke-dasharray", "1");
    path.setAttribute("stroke-dashoffset", "1");
    lines.appendChild(path);
  });

  const tl = gsap.timeline({ paused:true });

  // 0.0s — root pill spring
  tl.fromTo("#root",
    { scale:0 },
    { scale:1.06, duration:0.40, ease:"power3.out" },
    0.0
  );
  tl.to("#root", { scale:1.0, duration:0.15, ease:"power2.out" }, 0.40);

  // 0.45s — lines draw simultaneously
  tl.to("#lines path",
    { strokeDashoffset:0, duration:0.40, ease:"power2.inOut" },
    0.45
  );

  // 0.85s — cards spring in with stagger
  tl.to(".s12-card",
    { scale:1.08, opacity:1, duration:0.4, ease:"back.out(1.7)", stagger:0.09 },
    0.85
  );
  tl.to(".s12-card", { scale:1.0, duration:0.18, ease:"power2.out", stagger:0.09 }, 1.25);

  // 1.4s — icons fade
  tl.to(".s12-card i",    { opacity:1, y:0, duration:0.25, ease:"power2.out", stagger:0.07 }, 1.4);
  // 1.7s — names fade
  tl.to(".s12-card .name",{ opacity:1, y:0, duration:0.25, ease:"power2.out", stagger:0.07 }, 1.7);
  // 2.0s — descriptors fade
  tl.to(".s12-card .desc",{ opacity:1, y:0, duration:0.25, ease:"power2.out", stagger:0.07 }, 2.0);

  // 2.8s — soft pulse on cards
  tl.to(".s12-card",
    { opacity:0.88, duration:1.0, ease:"sine.inOut", yoyo:true, repeat:-1, stagger:0.3 },
    2.8
  );

  // Hold tail to 4.5s
  tl.to({}, { duration: 1.0 }, 3.5);

  flowbizScene.init({
    id: "scene-12",
    duration: 4.5,
    tail: 0.4,
    label: "Scene 12 · Open Mercato moduły · 4.5s",
    timeline: tl
  });
</script>
</body>
</html>

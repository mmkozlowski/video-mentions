<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 11 — MODIFY NOTHING · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s11-l1{
    position:absolute;left:160px;top:380px;
    font-size:128px;font-weight:900;color:#3A3630;
    letter-spacing:-0.025em;line-height:1.05;
    opacity:0;transform:translateX(-120px);
  }
  .s11-l2-wrap{
    position:absolute;left:160px;top:540px;
    display:inline-block;
  }
  .s11-l2{
    font-size:128px;font-weight:900;color:#F5A623;
    letter-spacing:-0.025em;line-height:1.05;
    opacity:0;transform:translateX(-120px);
    display:inline-block;
    will-change:transform,opacity,text-shadow;
  }
  .s11-rule{
    position:absolute;left:0;bottom:-10px;height:3px;background:#F5A623;
    width:0;
    will-change:width;
  }
  .s11-tag{
    position:absolute;right:160px;bottom:120px;
    font-size:22px;font-style:italic;color:#2E2C28;
    opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <!-- no grid -->
    <div class="scene">
      <div class="s11-l1" id="l1"><span class="chroma-plate">MODIFY NOTHING,</span></div>
      <div class="s11-l2-wrap">
        <span class="s11-l2" id="l2">EXTEND EVERYTHING.</span>
        <div class="s11-rule" id="rule"></div>
      </div>
      <div class="s11-tag" id="tag"><span class="chroma-plate amber">Open Mercato — filozofia</span></div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  tl.to("#l1", { opacity:1, x:0, duration:0.4, ease:"back.out(1.6)" }, 0.0);
  tl.to("#l2", { opacity:1, x:0, duration:0.4, ease:"back.out(1.6)" }, 0.22);

  // 0.65s — amber rule under line 2
  // Approximate width of "EXTEND EVERYTHING." at 128px DM Sans 900: ~1280px
  tl.to("#rule", { width:1280, duration:0.4, ease:"power2.inOut" }, 0.65);

  // 1.2s — glow on line 2
  tl.to("#l2",
    { textShadow:"0 0 30px rgba(245,166,35,0.4)",
      duration:0.30, ease:"power2.out" },
    1.2
  );
  tl.to("#l2",
    { textShadow:"0 0 20px rgba(245,166,35,0.25)",
      duration:0.20, ease:"power2.inOut" },
    1.5
  );

  // 1.5s — bottom-right tag
  tl.to("#tag", { opacity:1, duration:0.3, ease:"power2.out" }, 1.5);

  // Hold tail
  tl.to({}, { duration: 0.7 }, 1.8);

  flowbizScene.init({
    id: "scene-11",
    duration: 2.5,
    tail: 0.4,
    label: "Scene 11 · MODIFY NOTHING · 2.5s",
    timeline: tl
  });
</script>
</body>
</html>

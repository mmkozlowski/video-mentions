<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>TEST · biel z cieniem · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* Arkusz 3: BIEL — bo sama biel tez nie wychodzi idealnie.
     Wszystkie warianty maja ten sam kolor i stopien pisma; rozni je wylacznie
     sposob zbudowania ciemnego kontrastu przy krawedzi.
     Numer wariantu jest na ciemnej plytce, wiec pozostaje czytelny zawsze. */
  .row{
    position:absolute;left:0;right:0;height:96px;
    display:flex;align-items:center;gap:26px;padding-left:64px;
  }
  .no{
    flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.34);
    font:800 24px/1 'DM Sans',sans-serif;color:#F5A623;
  }
  .spec{ font-family:'DM Sans',sans-serif;white-space:nowrap;
         font-size:44px;font-weight:800;color:#FAF8F0 }

  /* 01 — biel gola (kontrola) */
  .w1{}

  /* 02 — twardy cien w dol, bez rozmycia */
  .w2{ text-shadow:0 3px 0 #0A0A08 }

  /* 03 — krotki cien z lekkim rozmyciem */
  .w3{ text-shadow:0 2px 4px rgba(10,10,8,0.95) }

  /* 04 — ciasna poswiata dookola */
  .w4{ text-shadow:0 0 6px rgba(10,10,8,0.95) }

  /* 05 — cien z czterech stron (obrys udawany) */
  .w5{ text-shadow:-2px 0 0 #0A0A08, 2px 0 0 #0A0A08, 0 -2px 0 #0A0A08, 0 2px 0 #0A0A08 }

  /* 06 — cien z osmiu stron (gladszy obrys udawany) */
  .w6{ text-shadow:
        -2px 0 0 #0A0A08, 2px 0 0 #0A0A08, 0 -2px 0 #0A0A08, 0 2px 0 #0A0A08,
        -2px -2px 0 #0A0A08, 2px -2px 0 #0A0A08, -2px 2px 0 #0A0A08, 2px 2px 0 #0A0A08 }

  /* 07 — prawdziwy obrys 3 px */
  .w7{ -webkit-text-stroke:3px #0A0A08;paint-order:stroke fill }

  /* 08 — prawdziwy obrys 5 px */
  .w8{ -webkit-text-stroke:5px #0A0A08;paint-order:stroke fill }

  /* 09 — obrys 3 px + cien pod spodem (pas i szelki) */
  .w9{ -webkit-text-stroke:3px #0A0A08;paint-order:stroke fill;
       text-shadow:0 4px 10px rgba(6,6,5,0.8) }

  /* 10 — waga 900 + twardy cien */
  .w10{ font-weight:900;text-shadow:0 3px 0 #0A0A08, 0 0 10px rgba(10,10,8,0.85) }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="scene" id="scene"></div>
  </div>
</div>

<script>
  const TXT = "Moduł to nie ekran — to kawałek procesu";
  const scene = document.getElementById('scene');
  for (let i = 0; i < 10; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.top = (28 + i * 102) + 'px';
    row.innerHTML = '<span class="no">' + String(i + 1).padStart(2, '0') + '</span>'
                  + '<span class="spec w' + (i + 1) + '">' + TXT + '</span>';
    scene.appendChild(row);
  }

  const tl = gsap.timeline({ paused:true });
  tl.to({}, { duration: 2.0 });

  flowbizScene.init({
    id: "test-biel",
    duration: 2.0,
    tail: 0,
    label: "TEST · biel z cieniem · 2.0s",
    timeline: tl
  });
</script>
</body>
</html>

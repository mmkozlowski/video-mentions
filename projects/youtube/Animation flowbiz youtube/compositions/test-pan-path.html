<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Test — ścieżka panoramiczna · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* Fixed eyebrow (outside the panning track) */
  .tpp-eyebrow{
    position:absolute;left:50%;top:120px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;
    z-index:5;
    opacity:0;
  }
  .tpp-counter{
    position:absolute;left:50%;bottom:140px;transform:translateX(-50%);
    font-size:20px;font-weight:600;color:#5A5450;letter-spacing:0.18em;
    z-index:5;
    font-variant-numeric:tabular-nums;
    opacity:0;
  }
  .tpp-counter b{ color:#F5A623; }

  /* Soft edge masks so the pan-out doesn't show hard cuts */
  .tpp-fade{
    position:absolute;top:0;bottom:0;width:220px;z-index:6;pointer-events:none;
  }
  .tpp-fade.left { left:0;  background:linear-gradient(to right, #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  .tpp-fade.right{ right:0; background:linear-gradient(to left,  #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  body.chromakey .tpp-fade{ display:none !important; }
  /* Defensive: ikona w środku węzła zawsze na ciemnym tle, nawet po chroma key */
  body.chromakey .tpp-node{ background:#0D0D0B !important; }

  /* The panning track — translated horizontally as the "camera" moves */
  .tpp-track{
    position:absolute;left:0;top:0;
    height:1080px;
    will-change:transform;
    z-index:2;
  }

  /* Base connecting line — dim, sits behind nodes */
  .tpp-line-bg{
    position:absolute;top:540px;
    height:2px;background:rgba(245,166,35,0.18);
    transform:translateY(-50%);
  }
  /* Bright amber line that extends as we pan */
  .tpp-line-fg{
    position:absolute;top:540px;
    height:2px;background:#F5A623;
    transform:translateY(-50%);
    width:0;
    box-shadow:0 0 16px rgba(245,166,35,0.55);
  }

  /* Node bubble */
  .tpp-node{
    position:absolute;top:540px;
    width:170px;height:170px;border-radius:50%;
    border:2px solid rgba(245,166,35,0.32);
    background:#0D0D0B;
    transform:translate(-50%,-50%) scale(0);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
    transition:border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .tpp-node i{ font-size:64px;color:#F5A623;line-height:1; }
  .tpp-node.active{
    border-color:#F5A623;
    box-shadow:0 0 0 6px rgba(245,166,35,0.10), 0 0 48px rgba(245,166,35,0.38);
  }

  /* Label below each node */
  .tpp-label{
    position:absolute;top:760px;
    transform:translate(-50%, 0);
    text-align:center;
    z-index:3;
    opacity:0;
    min-width:260px;
  }
  .tpp-label .num{
    font-size:18px;font-weight:600;letter-spacing:0.28em;
    color:#F5A623;
    margin-bottom:10px;
  }
  .tpp-label .title{
    font-size:48px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em;line-height:1.05;
  }
  .tpp-label .desc{
    font-size:22px;font-weight:500;color:#FAF8F0;opacity:0.6;margin-top:6px;
  }

  /* Travelling "pulse" dot — fixed at viewport center, lives behind nodes */
  .tpp-pulse{
    position:absolute;left:960px;top:540px;
    width:24px;height:24px;border-radius:50%;
    background:#F5A623;
    transform:translate(-50%,-50%) scale(0);
    z-index:1;
    box-shadow:0 0 24px rgba(245,166,35,0.65);
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="tpp-eyebrow" id="eyebrow">
        <span class="chroma-plate amber">PROCES · 4 KROKI</span>
      </div>

      <div class="tpp-track" id="track">
        <div class="tpp-line-bg" id="lineBg"></div>
        <div class="tpp-line-fg" id="lineFg"></div>
        <div class="tpp-pulse" id="pulse"></div>
      </div>

      <div class="tpp-fade left"></div>
      <div class="tpp-fade right"></div>

      <div class="tpp-counter" id="counter">
        <span class="chroma-plate"><b id="counterNow">01</b> / <span id="counterTot">04</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  const NODES = [
    { icon: "ti ti-message-circle-2", num: "01", title: "Rozmowa",   desc: "co Cię boli" },
    { icon: "ti ti-search",           num: "02", title: "Analiza",   desc: "co robi proces" },
    { icon: "ti ti-tools",            num: "03", title: "Build",     desc: "moduły + flow" },
    { icon: "ti ti-rocket",           num: "04", title: "Wdrożenie", desc: "na produkcję" },
  ];

  const FIRST_X = 960;     // first node x in track coords (also viewport center at start)
  const GAP     = 1000;    // distance between nodes in track coords
  const NODE_X  = NODES.map((_, i) => FIRST_X + i * GAP);
  const STATIONS = NODE_X.map(x => 960 - x);   // track translateX so node i lands at viewport-center 960

  const track   = document.getElementById('track');
  const lineBg  = document.getElementById('lineBg');
  const lineFg  = document.getElementById('lineFg');

  // Size the track so it visually extends a bit past the last node
  track.style.width = (NODE_X[NODE_X.length - 1] + 960) + 'px';

  // Base line: from first node center to last node center
  const LINE_START = NODE_X[0];
  const LINE_END   = NODE_X[NODE_X.length - 1];
  lineBg.style.left  = LINE_START + 'px';
  lineBg.style.width = (LINE_END - LINE_START) + 'px';
  lineFg.style.left  = LINE_START + 'px';

  // Build node + label DOM
  NODES.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'tpp-node';
    node.id = 'node' + i;
    node.style.left = NODE_X[i] + 'px';
    node.innerHTML = '<i class="' + n.icon + '"></i>';
    track.appendChild(node);

    const lab = document.createElement('div');
    lab.className = 'tpp-label';
    lab.id = 'lab' + i;
    lab.style.left = NODE_X[i] + 'px';
    lab.innerHTML =
      '<div class="num"><span class="chroma-plate amber">' + n.num + '</span></div>' +
      '<div class="title">' + n.title + '</div>' +
      '<div class="desc">' + n.desc + '</div>';
    track.appendChild(lab);
  });

  function activate(i){
    document.querySelectorAll('.tpp-node').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('node' + i);
    if (el) el.classList.add('active');
    document.getElementById('counterNow').textContent = NODES[i].num;
  }

  const tl = gsap.timeline({ paused:true });

  // --- ENTRY: eyebrow + counter
  tl.to('#eyebrow',  { opacity:1, y:0, duration:0.4, ease:"power2.out" }, 0.0);
  tl.fromTo('#eyebrow', { y:-10 }, { y:0, duration:0.4, ease:"power2.out" }, 0.0);
  tl.to('#counter',  { opacity:1, duration:0.4, ease:"power2.out" }, 0.15);

  // --- NODE 0 lands centered (no pan needed at start)
  tl.fromTo('#node0',
    { scale:0 },
    { scale:1.10, duration:0.45, ease:"back.out(1.7)" },
    0.30
  );
  tl.to('#node0', { scale:1, duration:0.15, ease:"power2.out" }, 0.75);
  tl.call(() => activate(0), null, 0.55);
  tl.to('#lab0', { opacity:1, duration:0.35, ease:"power2.out" }, 0.70);

  // pulse dot appears at center
  tl.fromTo('#pulse',
    { scale:0 },
    { scale:1, duration:0.35, ease:"back.out(1.7)" },
    0.55
  );

  // --- For each subsequent node: pan, extend line, spring node, fade label
  const STEP = 1.55;         // time per station (pan + reveal + hold)
  const STATION_HOLD = 0.4;  // hold at start of each station before next pan
  let cursor = 1.3;          // when the first pan begins

  for (let i = 1; i < NODES.length; i++) {
    const t = cursor;

    // (1) Camera pans from STATIONS[i-1] → STATIONS[i]
    tl.to(track,  { x: STATIONS[i], duration:0.95, ease:"power2.inOut" }, t);

    // (2) Bright line grows toward the new node (synced with pan)
    tl.to(lineFg, { width: NODE_X[i] - LINE_START, duration:0.95, ease:"power2.inOut" }, t);

    // (3) Mid-pan: new node springs in (so it "lands" with the camera)
    tl.fromTo('#node' + i,
      { scale:0 },
      { scale:1.10, duration:0.45, ease:"back.out(1.7)" },
      t + 0.50
    );
    tl.to('#node' + i, { scale:1, duration:0.15, ease:"power2.out" }, t + 0.95);

    // (4) On arrival, switch active state + reveal label
    tl.call(() => activate(i), null, t + 0.85);
    tl.to('#lab' + i, { opacity:1, duration:0.35, ease:"power2.out" }, t + 0.95);

    cursor = t + STEP;
  }

  // --- Outro: subtle pulse on the active (last) node + a tiny breath on the line
  const outroAt = cursor;
  tl.to('#pulse', { scale:1.4, opacity:0.6, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1 }, outroAt);
  tl.to(() => document.querySelector('.tpp-node.active'),
    { scale:1.03, duration:0.8, ease:"sine.inOut", yoyo:true, repeat:1 },
    outroAt);

  // Hold tail
  const DURATION = outroAt + 1.6;
  tl.to({}, { duration: 0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "test-pan-path",
    duration: DURATION,
    tail: 0.4,
    label: "Test · Ścieżka panoramiczna · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

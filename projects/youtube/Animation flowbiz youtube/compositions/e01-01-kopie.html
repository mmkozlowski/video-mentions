    letter-spacing:0.02em;opacity:0;

<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="k-label" id="label"><span class="chroma-plate amber">TEN SAM PLIK. TRZY WERSJE.</span></div>

      <div class="k-file F" id="f1" style="left:150px">
        <div class="k-name"><i class="logo logo-excel"></i>zamowienia.xlsx</div>
        <div class="k-who">właściciel</div>
        <div class="k-col">Klient <span>✓</span></div>
        <div class="k-col">Ilość <span>✓</span></div>
        <div class="k-col">Cena <span>✓</span></div>
        <div class="k-col" style="border-bottom:0">Marża <span>✓</span></div>
      </div>

      <div class="k-file F" id="f2" style="left:720px">
        <div class="k-name"><i class="logo logo-excel"></i>zamowienia_v2.xlsx</div>
        <div class="k-who">handlowiec</div>
        <div class="k-col">Klient <span>✓</span></div>
        <div class="k-col">Ilość <span>✓</span></div>
        <div class="k-col">Cena <span>✓</span></div>
        <div class="k-col off" style="border-bottom:0">Marża <i>—</i></div>
      </div>

      <div class="k-file F" id="f3" style="left:1290px">
        <div class="k-name"><i class="logo logo-excel"></i>zamowienia_biuro.xlsx</div>
        <div class="k-who">biuro</div>
        <div class="k-col">Klient <span>✓</span></div>
        <div class="k-col">Ilość <span>✓</span></div>
        <div class="k-col off">Cena <i>—</i></div>
        <div class="k-col off" style="border-bottom:0">Marża <i>—</i></div>
      </div>

      <div class="k-q" id="q">A kto wprowadza te dane?</div>
      <div class="k-a" id="a">WSZYSCY TRZEJ</div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });

  tl.to("#label", { opacity:1, duration:0.30, ease:"power2.out" }, 0.0);

  // pierwszy plik — oryginał
  tl.fromTo("#f1", { opacity:0, y:40 }, { opacity:1, y:0, duration:0.42, ease:"back.out(1.6)" }, 0.25);

  // kopie wysuwają się z oryginału w prawo — widać, że to ten sam plik
  tl.fromTo("#f2", { opacity:0, x:-560 }, { opacity:1, x:0, duration:0.55, ease:"power3.out" }, 1.00);
  tl.fromTo("#f3", { opacity:0, x:-1120 }, { opacity:1, x:0, duration:0.60, ease:"power3.out" }, 1.45);

  // kolumny gasną w kopiach — każdy widzi mniej
  tl.fromTo("#f2 .off", { color:"#FAF8F0" }, { color:"#2E2C28", duration:0.35, ease:"power2.out" }, 1.75);
  tl.fromTo("#f3 .off", { color:"#FAF8F0" }, { color:"#2E2C28", duration:0.35, stagger:0.1, ease:"power2.out" }, 2.15);

  // pytanie i odpowiedź
  tl.to("#q", { opacity:1, duration:0.35, ease:"power3.out" }, 2.70);
  tl.from("#q", { y:20, duration:0.35, ease:"power3.out" }, 2.70);
  tl.to("#a", { opacity:1, duration:0.35, ease:"back.out(1.7)" }, 3.20);

  tl.to({}, { duration:0.4 }, 3.6);

  flowbizScene.init({
    id: "e01-01",
    duration: 4.0,
    tail: 0.4,
    label: "E01 · 01 · TRZY WERSJE · 4.0s",
    timeline: tl
  });
</script>
</body>

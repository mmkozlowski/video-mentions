<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E01 LONG · 04 — SKĄD PRZENOSISZ PROCES · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .eyebrow{
    position:absolute;left:0;right:0;top:80px;text-align:center;
    font-size:24px;font-weight:600;letter-spacing:0.24em;z-index:9;opacity:0;
  }

  /* Sześć źródeł w dwóch rzędach: u góry systemy, u dołu to, co systemem nie jest.
     Ten podział sam w sobie jest treścią — proces rzadko siedzi w jednym miejscu. */
  .src{
    position:absolute;width:380px;margin-left:-190px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.26);
    padding:22px 0 20px;text-align:center;opacity:0;
    z-index:3;   /* nad liniami — kreski mają biec POD kartami */
  }
  .src .mark{ font-size:64px;line-height:1;display:block;margin-bottom:16px }
  .src .mark i.ti{ color:#F5A623 }
  .src .nm{ font-size:31px;font-weight:700;color:#FAF8F0;letter-spacing:-0.01em }
  .src .sub{ font-size:21px;font-weight:500;color:#5A5450;margin-top:6px }

  .flow{ position:absolute;inset:0;z-index:1;pointer-events:none }

  .dest{
    position:absolute;left:50%;top:668px;transform:translateX(-50%) scale(0.88);
    background:#0D0D0B;border:2px solid #F5A623;
    box-shadow:0 0 60px rgba(245,166,35,0.20);
    padding:34px 72px;text-align:center;opacity:0;z-index:4;
  }
  .dest .wm{ font-size:66px;line-height:1;display:block }
  .dest .sub{ font-size:26px;font-weight:600;color:#FAF8F0;opacity:0.62;margin-top:16px;letter-spacing:0.02em }

  .final{
    position:absolute;left:0;right:0;top:928px;text-align:center;
    font-size:44px;font-weight:800;color:#F5A623;letter-spacing:-0.015em;z-index:9;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <svg class="flow" id="flow" viewBox="0 0 1920 1080"></svg>

      <div class="dest" id="dest">
        <span class="wm"><i class="logo logo-openmercato"></i></span>
        <div class="sub"><span class="chroma-plate">jeden system, Twój kod</span></div>
      </div>

      <div class="final" id="final">Szybko i tanio — czy nie?</div>
    </div>
  </div>
</div>

<script>
  // Górny rząd to systemy, dolny — to, co systemem nie jest, a proces i tak w tym siedzi.
  const SRC = [
    { x:420,  y:176, logo:"logo-hubspot",    nm:"HubSpot",         sub:"CRM" },
    { x:960,  y:176, logo:"logo-salesforce", nm:"Salesforce",      sub:"CRM" },
    { x:1500, y:176, icon:"ti ti-database",  nm:"Inny CRM / ERP",  sub:"system, z którego wychodzisz" },
    { x:420,  y:404, logo:"logo-excel",      nm:"Excel",           sub:"arkusze" },
    { x:960,  y:404, logo:"logo-gmail",      nm:"Mail",            sub:"ustalenia w skrzynce" },
    { x:1500, y:404, icon:"ti ti-file-text", nm:"Kartka papieru",  sub:"i notatnik na biurku" },
  ];

  const DEST = { x:960, y:668 };
  const scene = document.querySelector('.scene');
  const flow  = document.getElementById('flow');
  const dest  = document.getElementById('dest');

  SRC.forEach((s, i) => {
    const el = document.createElement('div');
    el.className = 'src'; el.id = 's' + i;
    el.style.left = s.x + 'px';
    el.style.top  = s.y + 'px';
    const mark = s.logo ? '<i class="logo ' + s.logo + '"></i>' : '<i class="' + s.icon + '"></i>';
    el.innerHTML = '<span class="mark">' + mark + '</span>' +
                   '<div class="nm">' + s.nm + '</div>' +
                   '<div class="sub"><span class="chroma-plate">' + s.sub + '</span></div>';
    scene.insertBefore(el, dest);

    // krzywa od dolnej krawędzi kafla do karty celu; górny rząd omija dolny łukiem
    const y0 = s.y + 196;
    const p = document.createElementNS("http://www.w3.org/2000/svg", "path");
    p.setAttribute("d", `M ${s.x} ${y0} C ${s.x} ${y0 + 90}, ${DEST.x} ${DEST.y - 110}, ${DEST.x} ${DEST.y}`);
    p.setAttribute("stroke", "#F5A623");
    p.setAttribute("stroke-width", "2.5");
    p.setAttribute("stroke-linecap", "round");
    p.setAttribute("fill", "none");
    p.setAttribute("opacity", "0.85");
    p.setAttribute("id", "f" + i);
    flow.appendChild(p);

    const len = p.getTotalLength();
    gsap.set(p, { strokeDasharray:len, strokeDashoffset:len });
  });

  const beats = gsap.timeline();

  // najpierw systemy, potem to, co systemem nie jest
  beats.to('#s0, #s1, #s2', { opacity:1, duration:0.40, stagger:0.26, ease:"back.out(1.6)" }, 0.30);
  beats.from('#s0, #s1, #s2', { y:-26, duration:0.40, stagger:0.26, ease:"back.out(1.6)" }, 0.30);

  beats.to('#s3, #s4, #s5', { opacity:1, duration:0.40, stagger:0.26, ease:"back.out(1.6)" }, 1.35);
  beats.from('#s3, #s4, #s5', { y:-26, duration:0.40, stagger:0.26, ease:"back.out(1.6)" }, 1.35);

  // proces spływa do jednego miejsca
  SRC.forEach((_, i) => {
    beats.to('#f' + i, { strokeDashoffset:0, duration:0.78, ease:"power2.inOut" }, 2.45 + i * 0.13);
  });

  beats.to('#dest', { opacity:1, scale:1, duration:0.50, ease:"back.out(1.7)" }, 3.65);

  beats.to('.src', { opacity:0.34, duration:0.55, ease:"power2.out" }, 4.35);
  beats.to('.flow path', { opacity:0.28, duration:0.55, ease:"power2.out" }, 4.35);

  beats.to('#final',   { opacity:1, duration:0.42, ease:"power3.out" }, 4.85);
  beats.from('#final', { y:22, duration:0.42, ease:"power3.out" }, 4.85);

  const BEATS_DUR = 6.0;
  beats.timeScale(0.58);

  // oś główna: najpierw karta tytułowa, potem spowolnione beaty oryginału
  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"GDZIE DZIŚ ŻYJE TWÓJ PROCES" });
  tl.add(beats, 3.9);

  const DURATION = 3.9 + BEATS_DUR / 0.58 + 2.4;
  beats.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e01-04-long",
    duration: DURATION,
    tail: 0.4,
    label: "E01 LONG · 04 · SKĄD PRZENOSISZ · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>X01 — CO WIDZISZ vs CO KUPUJESZ (split) · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* EKSPERYMENT: podział kadru zamiast rzędu kart.
     Prawa połowa jest ZAKRYTA i odsłania się wycieraczką — widz najpierw
     domyka listę „co widzisz", dopiero potem dostaje drugą kolumnę.
     Statyczny split pokazałby obie naraz i zabił pointę. */
  .half{ position:absolute;top:176px;bottom:196px;width:850px;padding:36px 44px }
  .half.l{ left:70px;  background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.22) }
  .half.r{ left:1000px;background:#13110D;border:1.5px solid #F5A623;
           box-shadow:0 0 60px rgba(245,166,35,0.14) }

  .half .cap{
    font-size:24px;font-weight:800;letter-spacing:0.2em;text-transform:uppercase;
    padding-bottom:20px;margin-bottom:26px;border-bottom:1px solid rgba(245,166,35,0.2);
  }
  .half.l .cap{ color:#5A5450 }
  .half.r .cap{ color:#F5A623 }

  .it{
    display:flex;align-items:center;gap:18px;padding:15px 0;
    font-size:34px;font-weight:600;color:#FAF8F0;opacity:0;
  }
  .it i{ font-size:30px;width:36px }
  .half.l .it i{ color:#5A5450 }
  .half.r .it i{ color:#6BAA6B }

  /* zasłona na prawej połowie — zjeżdża w prawo jak wycieraczka */
  .shade{ position:absolute;left:960px;right:0;top:0;bottom:0;background:#0A0A08;z-index:7 }
  body.chromakey .shade{ background:#00B140 }

  .edge{
    position:absolute;top:120px;bottom:150px;width:3px;background:#F5A623;
    box-shadow:0 0 22px rgba(245,166,35,0.6);z-index:8;
  }

  .final{
    position:absolute;left:0;right:0;bottom:64px;text-align:center;
    font-size:50px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:9;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="half l" id="hl">
        <div class="cap">Co widzisz</div>
        <div class="it a"><i class="ti ti-layout-dashboard"></i>ekrany i przyciski</div>
        <div class="it a"><i class="ti ti-list"></i>listy rekordów</div>
        <div class="it a"><i class="ti ti-palette"></i>kolory i układ</div>
        <div class="it a"><i class="ti ti-forms"></i>formularze</div>
      </div>

      <div class="half r" id="hr">
        <div class="cap">Co naprawdę kupujesz</div>
        <div class="it b"><i class="ti ti-id-badge-2"></i>role i uprawnienia</div>
        <div class="it b"><i class="ti ti-history"></i>historię zmian</div>
        <div class="it b"><i class="ti ti-file-export"></i>eksport swoich danych</div>
        <div class="it b"><i class="ti ti-server-2"></i>dostęp do infrastruktury</div>
      </div>

      <div class="shade" id="shade"></div>
      <div class="edge" id="edge" style="left:958px"></div>

      <div class="final" id="final">Interfejs widać. Reszty nie.</div>
    </div>
  </div>
</div>

<script>
  const beats = gsap.timeline();

  // lewa kolumna — to, co klient ocenia na demo
  beats.to('#hl', { opacity:1, duration:0.01 }, 0);
  beats.to('.it.a', { opacity:1, duration:0.30, stagger:0.34, ease:"power2.out" }, 0.20);
  beats.from('.it.a', { x:-24, duration:0.30, stagger:0.34, ease:"power2.out" }, 0.20);

  // 1.9 — wycieraczka odjeżdża w prawo i odsłania drugą kolumnę
  beats.to('#shade', { x:960, duration:1.05, ease:"power3.inOut" }, 1.90);
  beats.to('#edge',  { x:960, duration:1.05, ease:"power3.inOut" }, 1.90);
  beats.to('#edge',  { opacity:0, duration:0.35 }, 2.85);

  beats.to('.it.b', { opacity:1, duration:0.30, stagger:0.34, ease:"power2.out" }, 2.70);
  beats.from('.it.b', { x:24, duration:0.30, stagger:0.34, ease:"power2.out" }, 2.70);

  // lewa przygasa — nie jest nieprawdziwa, po prostu nie o nią chodzi
  beats.to('#hl', { opacity:0.42, duration:0.6, ease:"power2.out" }, 4.30);

  beats.to('#final',   { opacity:1, duration:0.44, ease:"power3.out" }, 4.75);
  beats.from('#final', { y:22, duration:0.44, ease:"power3.out" }, 4.75);

  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"CO NAPRAWDĘ KUPUJESZ?" });
  beats.timeScale(0.72);
  tl.add(beats, 3.90);

  const DURATION = 3.90 + 5.6 / 0.72 + 2.2;
  tl.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "x01-split",
    duration: DURATION,
    tail: 0.4,
    label: "X01 · SPLIT — CO KUPUJESZ · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

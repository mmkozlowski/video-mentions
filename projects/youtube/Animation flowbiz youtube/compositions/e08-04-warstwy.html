<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E08 · 04 — WARSTW JEST WIĘCEJ · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .eyebrow{
    position:absolute;left:50%;top:110px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;z-index:7;opacity:0;
  }
  .counter{
    position:absolute;left:50%;bottom:110px;transform:translateX(-50%);
    font-size:20px;font-weight:600;color:#5A5450;letter-spacing:0.18em;
    z-index:7;font-variant-numeric:tabular-nums;opacity:0;
  }
  .counter b{ color:#F5A623 }

  .vfade{ position:absolute;left:0;right:0;height:200px;z-index:6;pointer-events:none }
  .vfade.top{ top:0;    background:linear-gradient(to bottom, #0A0A08 0%, rgba(10,10,8,0.7) 45%, transparent 100%) }
  .vfade.bot{ bottom:0; background:linear-gradient(to top,    #0A0A08 0%, rgba(10,10,8,0.7) 45%, transparent 100%) }
  body.chromakey .vfade{ display:none !important }
  body.chromakey .layer{ background:#0D0D0B !important }

  .track{ position:absolute;left:0;top:0;width:1920px;will-change:transform;z-index:2 }

  /* pionowa linia łącząca warstwy */
  .vline-bg{ position:absolute;left:300px;width:2px;background:rgba(245,166,35,0.16) }
  .vline-fg{ position:absolute;left:300px;width:2px;background:#F5A623;height:0;
             box-shadow:0 0 16px rgba(245,166,35,0.5) }

  .layer{
    position:absolute;left:200px;width:1420px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.28);
    padding:38px 46px;display:flex;align-items:center;gap:34px;
    transform:translateY(-50%) scale(0.9);opacity:0;
  }
  .layer .dot{
    width:96px;height:96px;border-radius:50%;flex:none;
    background:#0A0A08;border:2px solid rgba(245,166,35,0.35);
    display:flex;align-items:center;justify-content:center;
  }
  .layer .dot i{ font-size:44px;color:#F5A623 }
  .layer .num{ font-size:24px;font-weight:800;color:#F5A623;letter-spacing:0.12em;flex:none;width:56px }
  .layer .nm{ font-size:52px;font-weight:800;color:#FAF8F0;letter-spacing:-0.015em }
  .layer .nt{ margin-left:auto;font-size:26px;font-weight:500;color:#FAF8F0;opacity:0.55;text-align:right }
  .layer.active{ border-color:#F5A623;box-shadow:0 0 48px rgba(245,166,35,0.18) }

  .final{
    position:absolute;left:0;right:0;top:935px;text-align:center;
    font-size:48px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:7;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="eyebrow" id="eyebrow"><span class="chroma-plate amber">TO NIE SĄ DWIE WARSTWY</span></div>

      <div class="track" id="track">
        <div class="vline-bg" id="lineBg"></div>
        <div class="vline-fg" id="lineFg"></div>
      </div>

      <div class="vfade top" id="fadeT"></div>
      <div class="vfade bot" id="fadeB"></div>

      <div class="counter" id="counter"><span class="chroma-plate"><b id="cNow">01</b> / <span>04</span></span></div>
      <div class="final" id="final">I to powstaje od razu. Nie po roku.</div>
    </div>
  </div>
</div>

<script>
  const LAYERS = [
    { icon:"ti ti-users",        num:"01", name:"Użytkownicy", note:"kto się loguje" },
    { icon:"ti ti-id-badge-2",   num:"02", name:"Role",        note:"kim jest w firmie" },
    { icon:"ti ti-lock-check",   num:"03", name:"Uprawnienia", note:"co wolno mu zrobić" },
    { icon:"ti ti-box-multiple", num:"04", name:"Moduły",      note:"gdzie mu wolno" },
  ];

  const FIRST_Y = 540, GAPY = 520;
  const Y = LAYERS.map((_, i) => FIRST_Y + i * GAPY);
  const STATIONS = Y.map(y => 540 - y);

  const track  = document.getElementById('track');
  const lineBg = document.getElementById('lineBg');
  const lineFg = document.getElementById('lineFg');

  track.style.height = (Y[Y.length-1] + 540) + 'px';
  lineBg.style.top = Y[0] + 'px';
  lineBg.style.height = (Y[Y.length-1] - Y[0]) + 'px';
  lineFg.style.top = Y[0] + 'px';

  LAYERS.forEach((l, i) => {
    const el = document.createElement('div');
    el.className = 'layer'; el.id = 'l' + i;
    el.style.top = Y[i] + 'px';
    el.innerHTML =
      '<div class="dot"><i class="' + l.icon + '"></i></div>' +
      '<div class="num">' + l.num + '</div>' +
      '<div class="nm">' + l.name + '</div>' +
      '<div class="nt"><span class="chroma-plate">' + l.note + '</span></div>';
    track.appendChild(el);
  });

  function activate(i){
    document.querySelectorAll('.layer').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('l' + i);
    if (el) el.classList.add('active');
    document.getElementById('cNow').textContent = LAYERS[i].num;
  }

  const tl = gsap.timeline({ paused:true });

  tl.to('#eyebrow', { opacity:1, duration:0.4, ease:"power2.out" }, 0.0);
  tl.to('#counter', { opacity:1, duration:0.4, ease:"power2.out" }, 0.15);

  tl.to('#l0', { opacity:1, scale:1, duration:0.45, ease:"back.out(1.7)" }, 0.30);
  tl.call(() => activate(0), null, 0.55);

  const STEP = 1.35;
  let cursor = 1.15;
  for (let i = 1; i < LAYERS.length; i++) {
    const t = cursor;
    // kamera zjeżdża w dół po stosie
    tl.to(track,  { y: STATIONS[i], duration:0.85, ease:"power2.inOut" }, t);
    tl.to(lineFg, { height: Y[i] - Y[0], duration:0.85, ease:"power2.inOut" }, t);
    tl.to('#l' + i, { opacity:1, scale:1, duration:0.45, ease:"back.out(1.7)" }, t + 0.40);
    tl.call(() => activate(i), null, t + 0.75);
    cursor = t + STEP;
  }

  // ODJAZD — cały stos w jednym kadrze
  const S = 0.42;
  const MID_Y = (Y[0] + Y[Y.length-1]) / 2;
  const backAt = cursor;

  gsap.set(track, { transformOrigin:"0px 0px" });
  tl.to(track, {
    y: 520 - S * MID_Y,
    x: 960 - S * 960,
    scale: S,
    duration:1.10, ease:"power3.inOut"
  }, backAt);
  tl.to(['#fadeT','#fadeB'], { opacity:0, duration:0.5 }, backAt);
  tl.to('#counter', { opacity:0, duration:0.4 }, backAt);
  tl.to('.layer', { className:"layer", duration:0 }, backAt + 0.5);

  tl.to('#final', { opacity:1, duration:0.42, ease:"power3.out" }, backAt + 1.05);
  tl.from('#final', { y:22, duration:0.42, ease:"power3.out" }, backAt + 1.05);

  const DURATION = backAt + 2.1;
  tl.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e08-04",
    duration: DURATION,
    tail: 0.4,
    label: "E08 · 04 · WARSTWY (pan pionowy) · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

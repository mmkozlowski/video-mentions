<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 05 — Chaos Exceli · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<style>
  :root{
    --bg:#0A0A08;--amber:#F5A623;--light:#FAF8F0;
    --sec1:#5A5450;--sec2:#3A3630;--sec3:#2E2C28;
    --red:#C0553A;--excel:#217346;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--light);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{position:absolute;width:1920px;height:1080px;background:var(--bg);overflow:hidden;transform-origin:top left}
  .grid{position:absolute;inset:0;pointer-events:none;z-index:0}

  .layer{position:absolute;inset:0;z-index:2}

  /* Excel card */
  .xcard{
    position:absolute;
    width:320px;
    border-radius:12px;
    background:#1A1918;
    box-shadow: 0 12px 24px rgba(0,0,0,0.45), 0 0 0 1px rgba(255,255,255,0.04);
    opacity:0;
    will-change: transform, opacity;
  }
  .xcard .x-head{
    height:40px;background:var(--excel);
    border-radius:12px 12px 0 0;
    display:flex;align-items:center;gap:10px;
    padding:0 14px;
    color:#fff;font-size:14px;font-weight:700;letter-spacing:0.1em;text-transform:uppercase;
    position:relative;
  }
  .xcard .x-head .ic{font-size:18px;line-height:1}
  .xcard .x-body{
    padding:18px 16px;
    display:flex;flex-direction:column;gap:10px;
    background:#1A1918;
    height:160px;
    border-radius:0 0 12px 12px;
  }
  .row{display:flex;gap:8px}
  .cell{height:14px;background:#2A2826;border-radius:2px;flex:1}
  .cell.short{flex:0.55}
  .cell.long{flex:1.4}
  .cell.bright{background:#3A3735}
  .vbadge{
    position:absolute;
    top:-10px;right:-10px;
    width:42px;height:42px;border-radius:50%;
    background:var(--red);
    color:#fff;font-size:14px;font-weight:800;letter-spacing:0.02em;
    display:flex;align-items:center;justify-content:center;
    box-shadow:0 4px 10px rgba(0,0,0,0.4);
    z-index:2;
  }
  .xlabel{
    position:absolute;
    left:50%;
    top:calc(100% + 10px);
    transform:translateX(-50%);
    font-size:18px;color:var(--red);font-weight:600;letter-spacing:0.04em;
    white-space:nowrap;
  }

  /* Warning badge */
  .warn{
    position:absolute;
    left:50%;top:50%;
    width:180px;height:180px;border-radius:50%;
    background:var(--red);
    color:#fff;
    display:flex;align-items:center;justify-content:center;
    font-size:100px;font-weight:900;line-height:1;
    box-shadow:0 0 0 0 rgba(192,85,58,0.0), 0 20px 60px rgba(192,85,58,0.45);
    opacity:0;
    transform: translate(-50%,-50%) scale(0);
    z-index:6;
  }
  .warn-title{
    position:absolute;
    left:0;right:0;
    top:calc(50% + 130px);
    text-align:center;
    font-size:36px;font-weight:700;color:var(--red);
    letter-spacing:0.06em;
    opacity:0;
    transform:translateY(20px);
    z-index:6;
    text-shadow: 0 2px 24px rgba(0,0,0,0.7);
  }

  .watermark{
    position:absolute;right:48px;bottom:36px;
    color:#1E1C18;font-size:22px;font-weight:600;letter-spacing:0.08em;
    z-index:8;user-select:none;
  }
  .corner-brand{
    position:fixed;top:14px;left:18px;z-index:100;
    color:var(--sec1);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;
  }
  .corner-brand b{color:var(--amber)}
  .controls{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;background:rgba(20,18,14,0.92);
    border:1px solid rgba(245,166,35,0.2);padding:8px 10px;z-index:100;backdrop-filter:blur(8px);
  }
  .controls button{background:transparent;border:0;color:var(--light);font:inherit;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:6px}
  .controls button:hover{background:rgba(245,166,35,0.12);color:var(--amber)}
  .controls .primary{color:var(--amber)}
  .controls .t{color:var(--sec1);font-size:13px;font-variant-numeric:tabular-nums;padding:0 10px;min-width:84px;text-align:center}
  .controls .t b{color:var(--amber)}
  body.export .controls,body.export .corner-brand{display:none}
  /* OBS-NATIVE-MODE — 1:1 capture, no transform scaling, no letterbox */
  body.native, body.native html { background:#0A0A08; overflow:hidden; }
  body.native .wrap{ width:1920px; height:1080px; position:fixed; top:0; left:0; transform:none; }
  body.native .stage{ left:0 !important; top:0 !important; transform:none !important; }
  body.native .controls, body.native .corner-brand{ display:none }
</style>
</head>
<body>

<div class="corner-brand"><b>Build with Matt</b> · Scene 05 · Chaos Exceli · 4.0s</div>

<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <!-- Grid -->
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="layer">
      <!-- 7 Excel cards. Each has data-x / data-y / data-rot for the resting position. -->
      <div class="xcard" data-x="120"  data-y="120" data-rot="-12">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell short"></div><div class="cell long bright"></div><div class="cell"></div></div>
          <div class="row"><div class="cell"></div><div class="cell short bright"></div><div class="cell long"></div></div>
          <div class="row"><div class="cell long"></div><div class="cell"></div><div class="cell short"></div></div>
        </div>
        <div class="vbadge">v1</div>
        <div class="xlabel">OFERTY_OGÓLNE_FINAL.xlsx</div>
      </div>

      <div class="xcard" data-x="510"  data-y="80"  data-rot="5">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell long"></div><div class="cell"></div><div class="cell short bright"></div></div>
          <div class="row"><div class="cell short"></div><div class="cell long bright"></div><div class="cell"></div></div>
          <div class="row"><div class="cell"></div><div class="cell"></div><div class="cell long"></div></div>
        </div>
        <div class="vbadge">v2</div>
        <div class="xlabel">OFERTY_2024_v2.xlsx</div>
      </div>

      <div class="xcard" data-x="1460" data-y="150" data-rot="10">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell"></div><div class="cell short"></div><div class="cell long bright"></div></div>
          <div class="row"><div class="cell long bright"></div><div class="cell"></div><div class="cell"></div></div>
          <div class="row"><div class="cell short"></div><div class="cell long"></div><div class="cell"></div></div>
        </div>
        <div class="vbadge">v3</div>
        <div class="xlabel">OFERTY_JANEK.xlsx</div>
      </div>

      <div class="xcard" data-x="100"  data-y="720" data-rot="7">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell"></div><div class="cell long"></div><div class="cell short"></div></div>
          <div class="row"><div class="cell long bright"></div><div class="cell short"></div><div class="cell"></div></div>
          <div class="row"><div class="cell short"></div><div class="cell"></div><div class="cell long bright"></div></div>
        </div>
        <div class="vbadge">v4</div>
        <div class="xlabel">CENY_AKTUALNE.xlsx</div>
      </div>

      <div class="xcard" data-x="1490" data-y="720" data-rot="-10">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell long"></div><div class="cell"></div><div class="cell short bright"></div></div>
          <div class="row"><div class="cell short bright"></div><div class="cell"></div><div class="cell long"></div></div>
          <div class="row"><div class="cell"></div><div class="cell long"></div><div class="cell"></div></div>
        </div>
        <div class="vbadge">v5</div>
        <div class="xlabel">CENY_STARE_NIE_UŻYWAĆ.xlsx</div>
      </div>

      <div class="xcard" data-x="340"  data-y="430" data-rot="-15">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell long bright"></div><div class="cell short"></div><div class="cell"></div></div>
          <div class="row"><div class="cell"></div><div class="cell long"></div><div class="cell short bright"></div></div>
          <div class="row"><div class="cell short"></div><div class="cell"></div><div class="cell long"></div></div>
        </div>
        <div class="vbadge">v6</div>
        <div class="xlabel">OFERTY_BACKUP_FINAL_v4.xlsx</div>
      </div>

      <div class="xcard" data-x="1240" data-y="430" data-rot="12">
        <div class="x-head"><span class="ic"><i class="ti ti-table"></i></span><span>xlsx</span></div>
        <div class="x-body">
          <div class="row"><div class="cell"></div><div class="cell short bright"></div><div class="cell long"></div></div>
          <div class="row"><div class="cell long"></div><div class="cell"></div><div class="cell short"></div></div>
          <div class="row"><div class="cell short bright"></div><div class="cell long"></div><div class="cell"></div></div>
        </div>
        <div class="vbadge">v?</div>
        <div class="xlabel">???.xlsx</div>
      </div>
    </div>

    <!-- Warning badge -->
    <div class="warn" id="warn">!</div>
    <div class="warn-title" id="warnTitle">KTÓRY JEST AKTUALNY?</div>

    <div class="watermark">flowbiz.pl</div>
  </div>
</div>

<div class="controls">
  <button id="play" class="primary"><i class="ti ti-player-play-filled"></i> Odtwórz</button>
  <button id="restart"><i class="ti ti-refresh"></i> Restart</button>
  <span class="t"><b id="t-now">0.00</b> / 4.00s</span>
  <button id="rec" title="Nagraj scenę 1920×1080 (WebM, 25 Mbps)" style="color:#FF6E4F"><i class="ti ti-circle-filled"></i> Nagraj</button>
  <button id="fullsize" title="Pełny widok do nagrania (fullscreen + ukryte chrome)"><i class="ti ti-arrows-maximize"></i> Full</button>
  <button id="native11" title="Tryb 1:1 (1920×1080, do OBS)"><i class="ti ti-aspect-ratio"></i> 1:1</button>
  <button id="fs" title="Pełny ekran"><i class="ti ti-maximize"></i></button>
</div>

<script>
  // Fit
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  function fit(){
    if (document.body.classList.contains('native')) {
      stage.style.transform = 'none';
      stage.style.left = '0px';
      stage.style.top  = '0px';
      return;
    }
    const s = Math.min(wrap.clientWidth/1920, wrap.clientHeight/1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = ((wrap.clientWidth - 1920*s)/2)+'px';
    stage.style.top  = ((wrap.clientHeight - 1080*s)/2)+'px';
  }
  // OBS-NATIVE-INIT
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get('native') === '1' || location.hash === '#native') {
      document.body.classList.add('native');
    }
  })();
  function toggleNative(){
    document.body.classList.toggle('native');
    fit();
  }
  window.toggleNative = toggleNative;
  window.addEventListener('resize', fit);
  fit();

  // Place cards at their resting positions + rotation; start them off-stage above.
  const cards = [...document.querySelectorAll('.xcard')];
  cards.forEach((c)=>{
    const x = parseFloat(c.dataset.x);
    const y = parseFloat(c.dataset.y);
    const r = parseFloat(c.dataset.rot);
    c.style.left = x + 'px';
    c.style.top  = y + 'px';
    c.dataset.restRot = r;
    gsap.set(c, { y: -260, rotation: r, opacity: 0, transformOrigin: "50% 50%" });
  });

  const tl = gsap.timeline({ paused: true });

  // 0.0s — cards drop from top with stagger 0.12s, spring overshoot
  cards.forEach((c, i)=>{
    const r = parseFloat(c.dataset.restRot);
    const at = 0 + i*0.12;
    // drop with slight overshoot rotation
    tl.to(c, {
      y: 0,
      rotation: r + (r>0 ? -2 : 2),     // overshoot the resting rotation
      opacity: 1,
      duration: 0.45,
      ease: "power3.out"
    }, at);
    tl.to(c, {
      rotation: r,
      duration: 0.15,
      ease: "power2.out"
    }, at + 0.45);
  });

  // 1.2s — cards shake (x ±4, rot ±1) once each with stagger 0.08s
  cards.forEach((c, i)=>{
    const r = parseFloat(c.dataset.restRot);
    const at = 1.2 + i*0.08;
    tl.to(c, { x: -4, rotation: r - 1, duration: 0.08, ease: "none" }, at);
    tl.to(c, { x:  4, rotation: r + 1, duration: 0.08, ease: "none" }, at+0.08);
    tl.to(c, { x: -3, rotation: r - 0.6, duration: 0.07, ease: "none" }, at+0.16);
    tl.to(c, { x:  0, rotation: r,       duration: 0.07, ease: "none" }, at+0.23);
  });

  // 1.8s — version badges pulse red, stagger 0.1s
  document.querySelectorAll('.vbadge').forEach((b, i)=>{
    const at = 1.8 + i*0.1;
    tl.to(b, { backgroundColor:"#FF6E4F", scale:1.18, duration:0.18, ease:"power2.out" }, at);
    tl.to(b, { backgroundColor:"#C0553A", scale:1.0, duration:0.22, ease:"power2.inOut" }, at+0.18);
  });

  // 2.2s — warning badge springs in from center
  tl.fromTo("#warn",
    { opacity: 0, scale: 0 },
    { opacity: 1, scale: 1.15, duration: 0.35, ease: "power3.out" },
    2.2
  );
  tl.to("#warn", { scale: 1.0, duration: 0.20, ease: "power2.out" }, 2.55);
  // subtle ring pulse on hold
  tl.to("#warn", {
    boxShadow:"0 0 0 22px rgba(192,85,58,0.0), 0 20px 60px rgba(192,85,58,0.45)",
    duration: 0.7, ease: "power2.out"
  }, 2.55);

  // 2.8s — title fade + slide up
  tl.fromTo("#warnTitle",
    { opacity: 0, y: 20 },
    { opacity: 1, y: 0, duration: 0.4, ease: "power2.out" },
    2.8
  );

  // Hold tail to land at 4s
  tl.to({}, { duration: 0.7 }, 3.3);

  window.__timelines = window.__timelines || {};
  window.__timelines["scene-05-chaos-exceli"] = tl;

  const tNow = document.getElementById('t-now');
  tl.eventCallback("onUpdate", ()=>{ tNow.textContent = tl.time().toFixed(2); });

  document.getElementById('play').onclick = ()=>{ tl.progress() >= 1 ? tl.restart() : tl.play(); };
  document.getElementById('restart').onclick = ()=>tl.restart();
  document.getElementById('native11').onclick = ()=>{ toggleNative(); };
  // RECORDER-MODE — expose timeline + fit so recorder.js can drive them
  window.__sceneTimeline = tl;
  window.__sceneDuration = 4;
  window.fit = fit;
  document.getElementById('rec').onclick = async ()=>{
    const btn = document.getElementById('rec');
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-loader-2"></i> Wybierz tę kartę…';
    btn.disabled = true;
    try {
      await window.flowbizRecorder.record({
        timeline: window.__sceneTimeline,
        duration: 4,
        tail: 0.4,
        fileName: 'scene-05-chaos-exceli.webm'
      });
    } finally {
      btn.innerHTML = old;
      btn.disabled = false;
    }
  };
  // FULLSIZE-MODE — fullscreen + hide chrome + auto-1:1 if screen >= 1920×1080
  document.getElementById('fullsize').onclick = async ()=>{
    document.body.classList.add('export');
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    } catch(e){ /* ignore */ }
    // After entering fullscreen, if the screen comfortably holds 1920×1080, engage native 1:1.
    setTimeout(()=>{
      if (window.innerWidth >= 1920 && window.innerHeight >= 1080) {
        document.body.classList.add('native');
      }
      fit();
    }, 80);
  };
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) {
      document.body.classList.remove('export');
      document.body.classList.remove('native');
      fit();
    }
  });
  document.getElementById('fs').onclick = ()=>{
    if (!document.fullscreenElement) wrap.requestFullscreen?.(); else document.exitFullscreen?.();
  };
  document.addEventListener('keydown', e=>{
    if (e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if (tl.progress() >= 1) tl.restart();
      else tl.paused() ? tl.play() : tl.pause();
    }
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ setTimeout(()=>tl.play(0), 250); });
</script>
</body>
</html>

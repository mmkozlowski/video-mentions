<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E01 · 05 — CZYM TO NIE JEST · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .eyebrow{
    position:absolute;left:0;right:0;top:120px;text-align:center;
    font-size:24px;font-weight:600;letter-spacing:0.24em;z-index:8;opacity:0;
  }
  .card{
    position:absolute;top:296px;width:430px;margin-left:-215px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.26);
    padding:44px 0 38px;text-align:center;opacity:0;
  }
  .card .mark{ font-size:104px;line-height:1;display:block;margin-bottom:26px }
  .card .nm{ font-size:42px;font-weight:700;color:#FAF8F0;letter-spacing:-0.01em }
  .strike{
    position:absolute;top:50%;left:34px;height:5px;width:0;
    background:#C0553A;border-radius:3px;box-shadow:0 0 20px rgba(192,85,58,0.55);
    transform:rotate(-6deg);
  }
  .verdict{
    position:absolute;left:0;right:0;top:640px;text-align:center;
    font-size:52px;font-weight:800;color:#C0553A;letter-spacing:-0.015em;opacity:0;
  }
  .apart{
    position:absolute;left:50%;top:766px;transform:translateX(-50%) scale(0.9);
    background:#0D0D0B;border:2px solid #F5A623;
    box-shadow:0 0 56px rgba(245,166,35,0.18);
    padding:34px 68px;text-align:center;opacity:0;
  }
  .apart .wm{ font-size:64px;line-height:1;display:block }
  .apart .sub{ font-size:26px;font-weight:600;color:#FAF8F0;opacity:0.6;margin-top:16px }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="eyebrow" id="eyebrow"><span class="chroma-plate amber">Z CZYM TO MYLĄ</span></div>

      <div class="card c" id="c0" style="left:420px">
        <span class="mark"><i class="logo logo-make"></i></span>
        <div class="nm">Make</div>
        <div class="strike s"></div>
      </div>
      <div class="card c" id="c1" style="left:960px">
        <span class="mark"><i class="logo logo-n8n"></i></span>
        <div class="nm">n8n</div>
        <div class="strike s"></div>
      </div>
      <div class="card c" id="c2" style="left:1500px">
        <span class="mark"><i class="logo logo-zapier"></i></span>
        <div class="nm">Zapier</div>
        <div class="strike s"></div>
      </div>

      <div class="verdict" id="verdict">To nie ta klasa narzędzia.</div>

      <div class="apart" id="apart">
        <span class="wm"><i class="logo logo-openmercato"></i></span>
        <div class="sub"><span class="chroma-plate">inna półka</span></div>
      </div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });
  const STRIKE_W = 362;  // szerokość karty minus 2×34 px marginesu

  tl.to('#eyebrow', { opacity:1, duration:0.38, ease:"power2.out" }, 0.0);

  // 0.30 — trzy narzędzia wjeżdżają
  tl.to('.card.c', { opacity:1, duration:0.38, stagger:0.22, ease:"back.out(1.6)" }, 0.30);
  tl.from('.card.c', { scale:0.86, duration:0.38, stagger:0.22, ease:"back.out(1.6)" }, 0.30);

  // 1.35 — skreślenia, jedno po drugim, w rytmie zdania
  ["#c0","#c1","#c2"].forEach((id, i) => {
    const t = 1.35 + i * 0.42;
    tl.to(id + " .strike", { width:STRIKE_W, duration:0.30, ease:"power3.out" }, t);
    tl.to(id, { borderColor:"#2E2C28", duration:0.35, ease:"power2.out" }, t + 0.10);
    tl.to(id + " .mark, " + id + " .nm", { opacity:0.34, duration:0.35, ease:"power2.out" }, t + 0.10);
  });

  // 2.85 — werdykt
  tl.to('#verdict', { opacity:1, duration:0.40, ease:"power3.out" }, 2.85);
  tl.from('#verdict', { y:22, duration:0.40, ease:"power3.out" }, 2.85);

  // 3.55 — OM staje osobno, nie w rzędzie z tamtymi
  tl.to('#apart', { opacity:1, scale:1, duration:0.48, ease:"back.out(1.7)" }, 3.55);

  const DURATION = 4.9;
  tl.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e01-05",
    duration: DURATION,
    tail: 0.4,
    label: "E01 · 05 · CZYM TO NIE JEST · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

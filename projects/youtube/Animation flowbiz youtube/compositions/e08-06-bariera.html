<script>
  const tl = gsap.timeline({ paused: true });

  // 0.0s — eyebrow
  tl.to("#label", { opacity:1, duration:0.30, ease:"power2.out" }, 0.0);

  // 0.15s — zdanie prowadzące
  tl.to("#lead", { opacity:1, duration:0.35, ease:"power2.out" }, 0.15);

  // 0.35s — słowo wjeżdża sprężyną z lewej

  // 1.15s — skreślenie na czerwono, L→R

  // 1.55s — stare słowo przygasa
  tl.to("#word", { opacity:0.22, duration:0.30, ease:"power2.out" }, 1.55);

  // 1.7s — nowe słowo wjeżdża z dołu
  tl.to("#new", { opacity:1, y:0, duration:0.45, ease:"back.out(1.6)" }, 1.70);

  // 2.15s — bursztynowa kreska pod spodem
  tl.to("#rule", { width:1180, duration:0.32, ease:"power2.inOut" }, 2.15);

  // 2.7s — puls na nowym słowie
  tl.to("#new", { scale:1.02, duration:0.18, ease:"power2.out" }, 2.70);
  tl.to("#new", { scale:1.00, duration:0.18, ease:"power2.in"  }, 2.88);

  // ogon do 3.6s
  tl.to({}, { duration:0.3 }, 3.3);

  flowbizScene.init({
    id: "e08-06",
    duration: 3.6,
    tail: 0.4,
    label: "E08 · 06 · BARIERA · 3.6s",
    timeline: tl
  });
</script>

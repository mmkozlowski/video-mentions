<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E01 LONG · 03 — 100% DOSTĘPU · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .eyebrow{
    position:absolute;left:50%;top:96px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;z-index:8;opacity:0;
  }
  .hfade{ position:absolute;top:0;bottom:0;width:230px;z-index:6;pointer-events:none }
  .hfade.l{ left:0;  background:linear-gradient(to right, #0A0A08 0%, rgba(10,10,8,0.7) 45%, transparent 100%) }
  .hfade.r{ right:0; background:linear-gradient(to left,  #0A0A08 0%, rgba(10,10,8,0.7) 45%, transparent 100%) }
  body.chromakey .hfade{ display:none !important }

  .track{ position:absolute;left:0;top:0;height:1080px;will-change:transform;z-index:2 }

  .hline-bg{ position:absolute;top:540px;height:2px;background:rgba(245,166,35,0.16) }
  .hline-fg{ position:absolute;top:540px;height:2px;width:0;background:#F5A623;
             box-shadow:0 0 16px rgba(245,166,35,0.5) }

  .panel{
    position:absolute;top:230px;width:1020px;margin-left:-510px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.26);
    padding:40px 44px 46px;opacity:0;transform:scale(0.9);
  }
  .panel .cap{
    font-size:24px;font-weight:700;letter-spacing:0.2em;text-transform:uppercase;
    color:#5A5450;margin-bottom:30px;
  }
  .panel.on{ border-color:#F5A623;box-shadow:0 0 52px rgba(245,166,35,0.16) }

  /* lewy panel — pudełko low-code */
  .tiles{ display:flex;gap:20px;justify-content:center }
  /* Bubble nie ma znaku w simple-icons — kafel niesie sama nazwę */
  .tile .wd{ font-size:27px;font-weight:800;color:#3D8BFD;letter-spacing:-0.01em }
  .tile{
    width:152px;height:150px;font-size:62px;
    background:#0A0A08;border:2px solid rgba(245,166,35,0.24);border-radius:20px;
    display:flex;align-items:center;justify-content:center;opacity:0;
  }
  .lockrow{
    margin-top:36px;display:flex;align-items:center;justify-content:center;gap:18px;
    font-size:38px;font-weight:800;color:#C0553A;letter-spacing:-0.01em;opacity:0;
  }
  .lockrow i{ font-size:46px }

  /* prawy panel — repo */
  .repo{ font-family:"DM Sans",monospace;text-align:left }
  .repo .row{
    display:flex;align-items:center;gap:14px;
    font-size:34px;font-weight:600;color:#FAF8F0;padding:9px 0;opacity:0;
  }
  .repo .row i.ti{ font-size:32px;color:#F5A623;width:36px }
  .repo .row .pad{ display:inline-block;width:38px }
  .repo .row em{ font-style:normal;color:#6BAA6B;font-weight:500;margin-left:auto;font-size:26px }
  .agentrow{
    margin-top:30px;display:flex;align-items:center;justify-content:center;gap:16px;
    font-size:34px;font-weight:700;color:#FAF8F0;opacity:0;
  }

  .final{
    position:absolute;left:0;right:0;top:906px;text-align:center;
    font-size:58px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:8;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">

      <div class="track" id="track">
        <div class="hline-bg" id="lineBg"></div>
        <div class="hline-fg" id="lineFg"></div>

        <!-- STACJA 01 — low-code / no-code -->
        <div class="panel" id="p0" style="left:960px">
          <div class="cap">Low-code · no-code</div>
          <div class="tiles">
            <div class="tile t0"><i class="logo logo-retool"></i></div>
            <div class="tile t0"><span class="wd">Bubble</span></div>
            <div class="tile t0"><i class="logo logo-n8n"></i></div>
            <div class="tile t0"><i class="logo logo-zapier"></i></div>
            <div class="tile t0"><i class="logo logo-make"></i></div>
          </div>
          <div class="lockrow" id="lock"><i class="ti ti-lock"></i>Nie zajrzysz, jak to jest zrobione</div>
        </div>

        <!-- STACJA 02 — repozytorium -->
        <div class="panel" id="p1" style="left:2480px">
          <div class="cap"><span class="logo-lockup"><i class="logo logo-github"></i> Twoje repozytorium</span></div>
          <div class="repo">
            <div class="row r1"><i class="ti ti-folder"></i>modules/<em>kod modułów</em></div>
            <div class="row r1"><span class="pad"></span><i class="ti ti-file-code"></i>.ai/specs/<em>specyfikacje</em></div>
            <div class="row r1"><span class="pad"></span><i class="ti ti-file-text"></i>AGENTS.md<em>zasady dla agenta</em></div>
            <div class="row r1"><i class="ti ti-server-2"></i>infra/<em>infrastruktura</em></div>
          </div>
          <div class="agentrow" id="agentrow">
            <span class="logo-lockup"><i class="logo logo-claude"></i> Claude</span>
            <i class="ti ti-arrow-narrow-right" style="color:#F5A623;font-size:40px"></i>
            <span style="color:#6BAA6B">czyta wszystko</span>
          </div>
        </div>
      </div>

      <div class="hfade l" id="fadeL"></div>
      <div class="hfade r" id="fadeR"></div>

      <div class="final" id="final">100% dostępu do kodu.</div>
    </div>
  </div>
</div>

<script>
  const X = [960, 2480];
  const STATIONS = X.map(x => 960 - x);

  const track  = document.getElementById('track');
  const lineBg = document.getElementById('lineBg');
  const lineFg = document.getElementById('lineFg');

  track.style.width = (X[X.length-1] + 960) + 'px';
  lineBg.style.left = X[0] + 'px';
  lineBg.style.width = (X[X.length-1] - X[0]) + 'px';
  lineFg.style.left = X[0] + 'px';

  const beats = gsap.timeline();

  // 0.30 — pudełko low-code
  beats.to('#p0', { opacity:1, scale:1, duration:0.45, ease:"back.out(1.7)" }, 0.30);
  beats.call(() => document.getElementById('p0').classList.add('on'), null, 0.55);
  beats.to('.t0', { opacity:1, duration:0.32, stagger:0.14, ease:"back.out(1.7)" }, 0.62);

  // 1.55 — zamek: nie zajrzysz
  beats.to('#lock', { opacity:1, duration:0.34, ease:"power3.out" }, 1.55);
  beats.from('#lock', { scale:1.25, duration:0.34, ease:"power3.out" }, 1.55);
  beats.to('.t0', { opacity:0.44, duration:0.45, ease:"power2.out" }, 1.75);

  // 2.45 — przejazd kamery do repozytorium
  const T1 = 2.45;
  beats.to(track,  { x: STATIONS[1], duration:0.90, ease:"power2.inOut" }, T1);
  beats.to(lineFg, { width: X[1] - X[0], duration:0.90, ease:"power2.inOut" }, T1);
  beats.call(() => document.getElementById('p0').classList.remove('on'), null, T1 + 0.1);

  beats.to('#p1', { opacity:1, scale:1, duration:0.45, ease:"back.out(1.7)" }, T1 + 0.45);
  beats.call(() => document.getElementById('p1').classList.add('on'), null, T1 + 0.75);
  beats.to('.r1', { opacity:1, x:0, duration:0.30, stagger:0.13, ease:"power2.out" }, T1 + 0.72);
  beats.from('.r1', { x:-26, duration:0.30, stagger:0.13, ease:"power2.out" }, T1 + 0.72);
  beats.to('#agentrow', { opacity:1, duration:0.36, ease:"back.out(1.6)" }, T1 + 1.42);

  // 4.55 — ODJAZD: oba światy obok siebie
  const S = 0.58, BACK = T1 + 2.10;
  const MID_X = (X[0] + X[X.length-1]) / 2;

  gsap.set(track, { transformOrigin:"0px 0px" });
  beats.to(track, { x: 960 - S * MID_X, y: 430 - S * 430, scale:S, duration:1.10, ease:"power3.inOut" }, BACK);
  beats.to(['#fadeL','#fadeR'], { opacity:0, duration:0.5 }, BACK);
  beats.to('.t0', { opacity:1, duration:0.5 }, BACK);
  beats.call(() => document.getElementById('p1').classList.remove('on'), null, BACK + 0.5);

  beats.to('#final', { opacity:1, duration:0.44, ease:"power3.out" }, BACK + 1.05);
  beats.from('#final', { y:24, duration:0.44, ease:"power3.out" }, BACK + 1.05);

  const BEATS_DUR = BACK + 2.15;
  beats.timeScale(0.58);

  // oś główna: najpierw karta tytułowa, potem spowolnione beaty oryginału
  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"100% DOSTĘPU DO KODU" });
  tl.add(beats, 3.9);

  const DURATION = 3.9 + BEATS_DUR / 0.58 + 2.2;
  beats.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e01-03-long",
    duration: DURATION,
    tail: 0.4,
    label: "E01 LONG · 03 · 100% DOSTĘPU (pan + odjazd) · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E08 LONG · 03 — AI PRZYZNAJE CI RACJĘ · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .r-label{
    position:absolute;left:0;right:0;top:140px;text-align:center;
    font-size:26px;font-weight:600;color:#3A3630;
    letter-spacing:0.36em;text-transform:uppercase;opacity:0;
  }
  .r-you{
    position:absolute;right:260px;top:250px;
    max-width:820px;background:#13110D;
    border:1.5px solid #2E2C28;
    padding:28px 36px;font-size:32px;font-weight:400;color:#FAF8F0;
    line-height:1.35;opacity:0;
  }
  .r-ai{
    position:absolute;left:260px;top:430px;
    max-width:1080px;background:#0D0D0B;
    border:1.5px solid rgba(245,166,35,0.35);
    padding:34px 44px;font-size:38px;font-weight:600;color:#F5A623;
    line-height:1.35;opacity:0;
  }
  .r-caret{
    display:inline-block;width:4px;height:38px;background:#F5A623;
    vertical-align:-6px;margin-left:6px;
  }
  .r-who{
    position:absolute;font-size:22px;font-weight:600;letter-spacing:0.24em;
    text-transform:uppercase;color:#5A5450;opacity:0;
  }
  .r-final{
    position:absolute;left:0;right:0;top:850px;text-align:center;
    font-size:48px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em;opacity:0;
  }
  .r-final b{color:#C0553A;font-weight:800}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">

      <div class="r-who" id="who1" style="right:260px;top:212px"><span class="chroma-plate">TY</span></div>
      <div class="r-you" id="you">Zrób to tak, jak mówię.</div>

      <div class="r-who" id="who2" style="left:260px;top:392px"><span class="chroma-plate amber logo-lockup"><i class="logo logo-claude"></i>AGENT</span></div>
      <div class="r-ai"  id="ai"><span id="txt"></span><span class="r-caret" id="caret"></span></div>

      <div class="r-final" id="final">Zawsze ma <b>rację</b>. Nawet gdy jej nie masz.</div>
    </div>
  </div>
</div>

<script>
  const beats = gsap.timeline();
  const FULL = "Świetny pomysł! Jesteś najwspanialszym inżynierem na świecie.";
  const txt = document.getElementById("txt");

  beats.to("#who1", { opacity:1, duration:0.25 }, 0.25);
  beats.to("#you",  { opacity:1, duration:0.32, ease:"back.out(1.5)" }, 0.30);
  beats.from("#you",{ y:20, duration:0.32, ease:"back.out(1.5)" }, 0.30);

  beats.to("#who2", { opacity:1, duration:0.25 }, 0.95);
  beats.to("#ai",   { opacity:1, duration:0.32, ease:"back.out(1.5)" }, 1.00);
  beats.from("#ai", { y:20, duration:0.32, ease:"back.out(1.5)" }, 1.00);

  // 1.35s — odpowiedź wpisuje się litera po literze
  const typer = { n: 0 };
  beats.to(typer, {
    n: FULL.length, duration: 1.85, ease: "none",
    onUpdate(){ txt.textContent = FULL.slice(0, Math.round(typer.n)); }
  }, 1.35);

  // kursor mruga do końca pisania
  beats.to("#caret", { opacity:0, duration:0.35, repeat:5, yoyo:true, ease:"none" }, 1.35);
  beats.to("#caret", { opacity:0, duration:0.2 }, 3.25);

  // 3.4s — puenta
  beats.to("#final", { opacity:1, duration:0.40, ease:"power3.out" }, 3.40);
  beats.from("#final", { y:24, duration:0.40, ease:"power3.out" }, 3.40);

  beats.to({}, { duration:0.4 }, 3.9);

  const BEATS_DUR = 4.3;
  beats.timeScale(0.6);

  // oś główna: najpierw karta tytułowa, potem spowolnione beaty oryginału
  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"DLACZEGO AGENT POTRZEBUJE GRANIC" });
  tl.add(beats, 3.9);

  const DURATION = 3.9 + BEATS_DUR / 0.6 + 3;

  flowbizScene.init({
    id: "e08-03-long",
    duration: DURATION,
    tail: 0.4,
    label: "E08 LONG · 03 · PRZYZNAJE RACJĘ · 4.3s",
    timeline: tl
  });
</script>
</body>
</html>

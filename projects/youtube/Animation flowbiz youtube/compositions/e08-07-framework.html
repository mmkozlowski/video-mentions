<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E08 · 07 — FRAMEWORK WE FRAMEWORKU · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .eyebrow{
    position:absolute;left:0;right:0;top:104px;text-align:center;
    font-size:24px;font-weight:600;letter-spacing:0.24em;z-index:8;opacity:0;
  }

  /* agenci po lewej */
  .agent{
    position:absolute;left:150px;width:300px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.26);
    padding:26px 0;text-align:center;opacity:0;
  }
  .agent .mark{ font-size:62px;line-height:1;display:block;margin-bottom:14px }
  .agent .nm{ font-size:30px;font-weight:700;color:#FAF8F0 }

  .plug{ position:absolute;inset:0;z-index:1;pointer-events:none }

  /* struktura po prawej */
  .frame{
    position:absolute;left:660px;top:212px;width:1090px;
    background:#0D0D0B;border:2px solid rgba(245,166,35,0.30);
    padding:32px 40px 38px;opacity:0;transform:scale(0.93);
  }
  .frame.on{ border-color:#F5A623;box-shadow:0 0 56px rgba(245,166,35,0.16) }
  .frame .cap{
    font-size:24px;font-weight:700;letter-spacing:0.18em;text-transform:uppercase;
    color:#5A5450;margin-bottom:24px;
  }
  .frame .row{
    display:flex;align-items:center;gap:16px;padding:11px 0;
    font-size:33px;font-weight:600;color:#FAF8F0;opacity:0;
  }
  .frame .row i.ti{ font-size:32px;color:#F5A623;width:38px }
  .frame .row em{ font-style:normal;color:#5A5450;font-weight:500;margin-left:auto;font-size:25px }

  /* co struktura MÓWI agentowi */
  .say{
    position:absolute;left:660px;width:1090px;
    background:#13110D;border-left:5px solid #F5A623;
    padding:20px 30px;font-size:31px;font-weight:600;color:#FAF8F0;opacity:0;
  }
  .say i{ color:#F5A623;margin-right:14px;font-size:30px }
  .say.stop{ border-left-color:#C0553A } .say.stop i{ color:#C0553A }
  .say.good{ border-left-color:#6BAA6B } .say.good i{ color:#6BAA6B }
  /* „brakuje Ci tego" to brak, nie zielone światło — amber, jak reszta ostrzeżeń */
  .say.warn{ border-left-color:#F5A623 } .say.warn i{ color:#F5A623 }

  .final{
    position:absolute;left:0;right:0;top:962px;text-align:center;
    font-size:50px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:8;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="eyebrow" id="eyebrow"><span class="chroma-plate amber">FRAMEWORK WE FRAMEWORKU</span></div>

      <svg class="plug" id="plug" viewBox="0 0 1920 1080">
        <path class="pl" id="pl0" d="M 450 300 C 545 300, 560 300, 660 300" fill="none"
              stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
        <path class="pl" id="pl1" d="M 450 480 C 545 480, 560 400, 660 380" fill="none"
              stroke="#F5A623" stroke-width="3" stroke-linecap="round"/>
      </svg>

      <div class="agent a" id="a0" style="top:216px">
        <span class="mark"><i class="logo logo-claude"></i></span>
        <div class="nm">Claude</div>
      </div>
      <div class="agent a" id="a1" style="top:396px">
        <span class="mark"><i class="logo logo-openai"></i></span>
        <div class="nm">Codex</div>
      </div>

      <div class="frame" id="frame">
        <div class="cap"><span class="logo-lockup"><i class="logo logo-github"></i> Struktura w repozytorium</span></div>
        <div class="row fr"><i class="ti ti-file-text"></i>AGENTS.md<em>zasady dla agenta</em></div>
        <div class="row fr"><i class="ti ti-file-code"></i>.ai/specs/<em>spec przed kodem</em></div>
        <div class="row fr"><i class="ti ti-box-multiple"></i>modules/<em>każdy moduł osobno</em></div>
      </div>

      <div class="say sy warn" id="s0" style="top:620px"><i class="ti ti-alert-triangle"></i>Brakuje Ci tego, tego i tego.</div>
      <div class="say sy stop" id="s1" style="top:718px"><i class="ti ti-ban"></i>Tego nie możesz zrobić.</div>
      <div class="say sy good" id="s2" style="top:816px"><i class="ti ti-check"></i>Chcesz dobrze? Zrób to w ten sposób.</div>

      <div class="final" id="final">Nie zaczyna od pustej kartki.</div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused:true });

  gsap.utils.toArray('.pl').forEach(p => {
    const len = p.getTotalLength();
    gsap.set(p, { strokeDasharray:len, strokeDashoffset:len });
  });

  tl.to('#eyebrow', { opacity:1, duration:0.38, ease:"power2.out" }, 0.0);

  // 0.30 — podłączasz swojego agenta
  tl.to('.agent.a', { opacity:1, duration:0.38, stagger:0.20, ease:"back.out(1.6)" }, 0.30);
  tl.from('.agent.a', { x:-34, duration:0.38, stagger:0.20, ease:"back.out(1.6)" }, 0.30);

  // 1.10 — kabel do struktury
  tl.to('#pl0', { strokeDashoffset:0, duration:0.52, ease:"power2.inOut" }, 1.10);
  tl.to('#pl1', { strokeDashoffset:0, duration:0.52, ease:"power2.inOut" }, 1.24);

  // 1.75 — wpada w strukturę
  tl.to('#frame', { opacity:1, scale:1, duration:0.46, ease:"back.out(1.6)" }, 1.75);
  tl.call(() => document.getElementById('frame').classList.add('on'), null, 2.05);
  tl.to('.row.fr', { opacity:1, duration:0.28, stagger:0.15, ease:"power2.out" }, 2.10);
  tl.from('.row.fr', { x:-24, duration:0.28, stagger:0.15, ease:"power2.out" }, 2.10);

  // 3.05 — i ta struktura mu mówi:
  ["#s0","#s1","#s2"].forEach((id, i) => {
    const t = 3.05 + i * 0.52;
    tl.to(id, { opacity:1, duration:0.34, ease:"power3.out" }, t);
    tl.from(id, { x:34, duration:0.34, ease:"power3.out" }, t);
  });

  // 4.85 — puenta
  tl.to('#final', { opacity:1, duration:0.44, ease:"power3.out" }, 4.85);
  tl.from('#final', { y:24, duration:0.44, ease:"power3.out" }, 4.85);

  const DURATION = 6.1;
  tl.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e08-07",
    duration: DURATION,
    tail: 0.4,
    label: "E08 · 07 · FRAMEWORK WE FRAMEWORKU · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

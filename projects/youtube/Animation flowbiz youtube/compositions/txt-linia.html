<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>TXT · goła linia tekstu · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* SZABLON: goly tekst na materiale, bez karty i bez scrimu.
     Cala czytelnosc niesie sama typografia — waga 900 + twardy cien
     + delikatna poswiata (wariant wybrany 21.08 z arkusza test-typografia-biel).

     Tresc podmieniasz z linii polecen, bez dotykania tego pliku:
       TXT="Twoje zdanie" SUB="podpis" FPS=30 ALPHA=1 node render.js txt-linia
     SUB jest opcjonalny — pusty znika razem z bursztynowa belka. */

  .blok{
    position:absolute;left:0;right:0;top:760px;text-align:center;z-index:7;
  }
  .maska{ overflow:hidden;display:block }
  .linia{
    display:inline-block;
    font-family:'DM Sans',sans-serif;
    font-size:76px;font-weight:900;letter-spacing:-0.022em;line-height:1.12;
    color:#FAF8F0;
    text-shadow:0 3px 0 #0A0A08, 0 0 10px rgba(10,10,8,0.85);
  }
  .belka{
    height:7px;width:0;margin:26px auto 0;background:#F5A623;
    box-shadow:0 0 26px rgba(245,166,35,0.45), 0 0 18px rgba(6,6,5,0.85);
  }
  .podpis{
    margin-top:22px;font-family:'DM Sans',sans-serif;
    font-size:31px;font-weight:700;color:#F5A623;opacity:0;
    -webkit-text-stroke:4px #0A0A08;paint-order:stroke fill;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="scene">
      <div class="blok" id="blok">
        <span class="maska"><span class="linia" id="linia"></span></span>
        <div class="belka" id="belka"></div>
        <div class="podpis" id="podpis"></div>
      </div>
    </div>
  </div>
</div>

<script>
  const P = new URLSearchParams(location.search);
  const TXT = P.get('txt') || "Moduł to nie ekran — to kawałek procesu";
  const SUB = P.get('sub') || "";

  document.getElementById('linia').textContent = TXT;
  const podpis = document.getElementById('podpis');
  const belka = document.getElementById('belka');
  if (SUB) podpis.textContent = SUB; else { podpis.style.display = 'none'; }

  // Belka dopasowuje sie do szerokosci tekstu, ale nie wiecej niz 460 px —
  // przy dlugim zdaniu kreska przez caly kadr wyglada jak podkreslenie bledu.
  const BELKA_W = Math.min(460, Math.max(180, document.getElementById('linia').offsetWidth * 0.34));

  gsap.set('#linia', { yPercent:120 });

  const tl = gsap.timeline({ paused:true });

  // 0.00 — tekst wyjezdza spod maski
  tl.to('#linia', { yPercent:0, duration:0.56, ease:"power4.out" }, 0.0);

  // 0.42 — belka rozjezdza sie od srodka
  tl.to('#belka', { width:BELKA_W, duration:0.42, ease:"power3.out" }, 0.42);

  // 0.70 — podpis
  if (SUB) {
    tl.to('#podpis', { opacity:1, duration:0.34, ease:"power2.out" }, 0.70);
    tl.from('#podpis', { y:14, duration:0.34, ease:"power2.out" }, 0.70);
  }

  // wyjscie — tekst i belka schodza, zeby wstawka nie urywala sie na twardo
  tl.to('#belka', { width:0, duration:0.30, ease:"power2.in" }, 3.30);
  if (SUB) tl.to('#podpis', { opacity:0, duration:0.26, ease:"power2.in" }, 3.30);
  tl.to('#linia', { yPercent:-120, duration:0.44, ease:"power3.in" }, 3.42);

  const DURATION = 3.9;
  tl.to({}, { duration:0.2 }, DURATION - 0.2);

  flowbizScene.init({
    id: "txt-linia",
    duration: DURATION,
    tail: 0.2,
    label: "TXT · goła linia · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

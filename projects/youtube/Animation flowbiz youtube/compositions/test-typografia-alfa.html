<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>TEST · typografia na alfie · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* Arkusz testowy: 10 wariantow jednej linii tekstu, kazdy z innymi parametrami.
     Cel: sprawdzic, ktore przezywaja lancuch alfa -> kompozyt -> h.264 4:2:0.
     Numer wariantu jest zawsze bialy na ciemnej plytce, zeby byl czytelny
     niezaleznie od tego, czy sam specimen sie rozsypie. */
  .row{
    position:absolute;left:0;right:0;height:96px;
    display:flex;align-items:center;gap:26px;padding-left:64px;
  }
  .no{
    flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.34);
    font:800 24px/1 'DM Sans',sans-serif;color:#F5A623;
  }
  .spec{ font-family:'DM Sans',sans-serif;white-space:nowrap }

  /* 01 — kosc sloniowa, bez tla (odniesienie) */
  .v1{ font-size:44px;font-weight:800;color:#FAF8F0 }

  /* 02 — czysta biel, waga 900 */
  .v2{ font-size:44px;font-weight:900;color:#FFFFFF }

  /* 03 — bursztyn goly (KONTROLA — ma sie rozsypac) */
  .v3{ font-size:44px;font-weight:800;color:#F5A623 }

  /* 04 — bursztyn na pelnej ciemnej pigulce */
  .v4{ font-size:44px;font-weight:800;color:#F5A623;
       background:#0D0D0B;padding:14px 28px }

  /* 05 — bursztyn z twardym obrysem (paint-order: obrys POD glifem) */
  .v5{ font-size:44px;font-weight:800;color:#F5A623;
       -webkit-text-stroke:6px #0A0A08;paint-order:stroke fill }

  /* 06 — jasny bursztyn, wyzsza luminancja (hipoteza do obalenia) */
  .v6{ font-size:44px;font-weight:800;color:#FFD089 }

  /* 07 — kosc sloniowa + twardy cien (nie rozmyte halo) */
  .v7{ font-size:44px;font-weight:800;color:#FAF8F0;
       text-shadow:0 3px 0 #0A0A08, 0 0 8px rgba(10,10,8,0.9) }

  /* 08 — bursztyn, waga 900, wiekszy stopien */
  .v8{ font-size:60px;font-weight:900;color:#F5A623 }

  /* 09 — bialy tekst, kolor przeniesiony do KSZTALTU (podkreslenie) */
  .v9{ font-size:44px;font-weight:800;color:#FAF8F0;
       border-bottom:7px solid #F5A623;padding-bottom:8px }

  /* 10 — bursztyn na polprzezroczystej plycie */
  .v10{ font-size:44px;font-weight:800;color:#F5A623;
        background:rgba(10,10,8,0.78);padding:14px 28px }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="scene" id="scene"></div>
  </div>
</div>

<script>
  const TXT = "Moduł to nie ekran — to kawałek procesu";
  const VARIANTS = [
    "v1","v2","v3","v4","v5","v6","v7","v8","v9","v10"
  ];
  const scene = document.getElementById('scene');
  VARIANTS.forEach((v, i) => {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.top = (28 + i * 102) + 'px';
    row.innerHTML = '<span class="no">' + String(i + 1).padStart(2, '0') + '</span>'
                  + '<span class="spec ' + v + '">' + TXT + '</span>';
    scene.appendChild(row);
  });

  // Arkusz statyczny — zadnej animacji, zeby ocena dotyczyla samej typografii.
  const tl = gsap.timeline({ paused:true });
  tl.to({}, { duration: 2.0 });

  flowbizScene.init({
    id: "test-typografia",
    duration: 2.0,
    tail: 0,
    label: "TEST · typografia na alfie · 2.0s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>TEST · bursztyn: cien kontra obrys · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* Arkusz 2: czy da sie utrzymac BURSZTYN bez tla, samym cieniem.
     Wszystkie warianty maja ten sam kolor #F5A623 i ten sam stopien pisma —
     rozni je wylacznie sposob zbudowania ciemnego kontrastu przy krawedzi. */
  .row{
    position:absolute;left:0;right:0;height:96px;
    display:flex;align-items:center;gap:26px;padding-left:64px;
  }
  .no{
    flex:none;width:52px;height:52px;display:flex;align-items:center;justify-content:center;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.34);
    font:800 24px/1 'DM Sans',sans-serif;color:#F5A623;
  }
  .spec{ font-family:'DM Sans',sans-serif;white-space:nowrap;
         font-size:44px;font-weight:800;color:#F5A623 }

  /* 01 — goly bursztyn (kontrola, wiadomo ze pada) */
  .s1{}

  /* 02 — twardy cien odsuniety w dol, bez rozmycia */
  .s2{ text-shadow:0 3px 0 #0A0A08 }

  /* 03 — ciasna poswiata */
  .s3{ text-shadow:0 0 6px rgba(10,10,8,0.95) }

  /* 04 — srednia poswiata */
  .s4{ text-shadow:0 0 14px rgba(10,10,8,0.95) }

  /* 05 — wielowarstwowa poswiata (to, co bylo w .halo) */
  .s5{ text-shadow:0 0 14px rgba(6,6,5,0.92), 0 0 38px rgba(6,6,5,0.78), 0 3px 10px rgba(6,6,5,0.85) }

  /* 06 — cien z czterech stron: obrys udawany cieniem */
  .s6{ text-shadow:-3px 0 0 #0A0A08, 3px 0 0 #0A0A08, 0 -3px 0 #0A0A08, 0 3px 0 #0A0A08 }

  /* 07 — cien z osmiu stron: gladszy obrys udawany */
  .s7{ text-shadow:
        -3px 0 0 #0A0A08, 3px 0 0 #0A0A08, 0 -3px 0 #0A0A08, 0 3px 0 #0A0A08,
        -2px -2px 0 #0A0A08, 2px -2px 0 #0A0A08, -2px 2px 0 #0A0A08, 2px 2px 0 #0A0A08 }

  /* 08 — prawdziwy obrys, 4 px (odniesienie, cienszy) */
  .s8{ -webkit-text-stroke:4px #0A0A08;paint-order:stroke fill }

  /* 09 — prawdziwy obrys, 6 px (odniesienie, zwyciezca z arkusza 1) */
  .s9{ -webkit-text-stroke:6px #0A0A08;paint-order:stroke fill }

  /* 10 — obrys 6 px + delikatny cien pod spodem (pas i szelki) */
  .s10{ -webkit-text-stroke:6px #0A0A08;paint-order:stroke fill;
        text-shadow:0 4px 12px rgba(6,6,5,0.75) }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <div class="scene" id="scene"></div>
  </div>
</div>

<script>
  const TXT = "Moduł to nie ekran — to kawałek procesu";
  const scene = document.getElementById('scene');
  for (let i = 0; i < 10; i++) {
    const row = document.createElement('div');
    row.className = 'row';
    row.style.top = (28 + i * 102) + 'px';
    row.innerHTML = '<span class="no">' + String(i + 1).padStart(2, '0') + '</span>'
                  + '<span class="spec s' + (i + 1) + '">' + TXT + '</span>';
    scene.appendChild(row);
  }

  const tl = gsap.timeline({ paused:true });
  tl.to({}, { duration: 2.0 });

  flowbizScene.init({
    id: "test-cienie",
    duration: 2.0,
    tail: 0,
    label: "TEST · bursztyn: cien kontra obrys · 2.0s",
    timeline: tl
  });
</script>
</body>
</html>

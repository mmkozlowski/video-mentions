<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E01 LONG · 02 — CZTERY BRANŻE, JEDEN FUNDAMENT · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .tpp-eyebrow{
    position:absolute;left:50%;top:110px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;z-index:5;opacity:0;
  }
  .tpp-counter{
    position:absolute;left:50%;bottom:120px;transform:translateX(-50%);
    font-size:20px;font-weight:600;color:#5A5450;letter-spacing:0.18em;
    z-index:5;font-variant-numeric:tabular-nums;opacity:0;
  }
  .tpp-counter b{ color:#F5A623; }

  .tpp-fade{ position:absolute;top:0;bottom:0;width:220px;z-index:6;pointer-events:none; }
  .tpp-fade.left { left:0;  background:linear-gradient(to right, #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  .tpp-fade.right{ right:0; background:linear-gradient(to left,  #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  body.chromakey .tpp-fade{ display:none !important; }
  body.chromakey .tpp-node{ background:#0D0D0B !important; }

  .tpp-track{ position:absolute;left:0;top:0;height:1080px;will-change:transform;z-index:2; }

  .tpp-line-bg{ position:absolute;top:470px;height:2px;background:rgba(245,166,35,0.18);transform:translateY(-50%); }
  .tpp-line-fg{ position:absolute;top:470px;height:2px;background:#F5A623;transform:translateY(-50%);width:0;
                box-shadow:0 0 16px rgba(245,166,35,0.55); }

  .tpp-node{
    position:absolute;top:470px;width:170px;height:170px;border-radius:50%;
    border:2px solid rgba(245,166,35,0.32);background:#0D0D0B;
    transform:translate(-50%,-50%) scale(0);
    display:flex;align-items:center;justify-content:center;z-index:3;
    transition:border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .tpp-node i{ font-size:64px;color:#F5A623;line-height:1; }
  .tpp-node.active{ border-color:#F5A623;box-shadow:0 0 0 6px rgba(245,166,35,0.10),0 0 48px rgba(245,166,35,0.38); }

  .tpp-label{ position:absolute;top:670px;transform:translate(-50%,0);text-align:center;z-index:3;opacity:0;min-width:460px; }
  .tpp-label .num{ font-size:18px;font-weight:700;letter-spacing:0.28em;color:#F5A623;margin-bottom:12px; }
  .tpp-label .title{ font-size:50px;font-weight:800;color:#FAF8F0;letter-spacing:-0.015em;line-height:1.06; }
  .tpp-label .desc{ font-size:23px;font-weight:500;color:#FAF8F0;opacity:0.6;margin-top:10px; }

  .tpp-pulse{
    position:absolute;left:960px;top:470px;width:24px;height:24px;border-radius:50%;
    background:#F5A623;transform:translate(-50%,-50%) scale(0);z-index:1;
    box-shadow:0 0 24px rgba(245,166,35,0.65);
  }

  /* Wspólny szkielet — chrome, poza trekiem, pojawia się po odjeździe kamery */
  .core{
    position:absolute;left:50%;top:700px;transform:translateX(-50%);
    background:#13110D;border:1.5px solid #F5A623;
    padding:30px 48px;display:flex;align-items:center;gap:40px;
    z-index:7;opacity:0;
  }
  .core .st{ font-size:40px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em }
  .core .ar{ font-size:32px;font-weight:700;color:#F5A623 }
  .final{
    position:absolute;left:0;right:0;top:880px;text-align:center;
    font-size:54px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:7;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">

      <div class="tpp-track" id="track">
        <div class="tpp-line-bg" id="lineBg"></div>
        <div class="tpp-line-fg" id="lineFg"></div>
        <div class="tpp-pulse" id="pulse"></div>
      </div>

      <div class="tpp-fade left" id="fadeL"></div>
      <div class="tpp-fade right" id="fadeR"></div>

      <div class="tpp-counter" id="counter">
        <span class="chroma-plate"><b id="counterNow">01</b> / <span>04</span></span>
      </div>

      <div class="core" id="core">
        <div class="st">rekord</div><div class="ar">→</div>
        <div class="st">role</div><div class="ar">→</div>
        <div class="st">status</div><div class="ar">→</div>
        <div class="st">dokument</div>
      </div>

      <div class="final" id="final">Jeden fundament.</div>
    </div>
  </div>
</div>

<script>
  const NODES = [
    { icon:"ti ti-package",        num:"01", title:"Karta techniczna", desc:"opakowania" },
    { icon:"ti ti-stethoscope",    num:"02", title:"Wizyta pacjenta",  desc:"proces medyczny" },
    { icon:"ti ti-building-factory",num:"03", title:"Zamówienie B2B",  desc:"produkcja na zamówienie" },
    { icon:"ti ti-tool",           num:"04", title:"Zlecenie",         desc:"mała produkcja" },
  ];

  const FIRST_X = 960, GAP = 900;
  const NODE_X = NODES.map((_, i) => FIRST_X + i * GAP);
  const STATIONS = NODE_X.map(x => 960 - x);

  const track  = document.getElementById('track');
  const lineBg = document.getElementById('lineBg');
  const lineFg = document.getElementById('lineFg');

  track.style.width = (NODE_X[NODE_X.length-1] + 960) + 'px';
  const LINE_START = NODE_X[0], LINE_END = NODE_X[NODE_X.length-1];
  lineBg.style.left = LINE_START + 'px';
  lineBg.style.width = (LINE_END - LINE_START) + 'px';
  lineFg.style.left = LINE_START + 'px';

  NODES.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'tpp-node'; node.id = 'node' + i;
    node.style.left = NODE_X[i] + 'px';
    node.innerHTML = '<i class="' + n.icon + '"></i>';
    track.appendChild(node);

    const lab = document.createElement('div');
    lab.className = 'tpp-label'; lab.id = 'lab' + i;
    lab.style.left = NODE_X[i] + 'px';
    lab.innerHTML =
      '<div class="num"><span class="chroma-plate amber">' + n.num + '</span></div>' +
      '<div class="title">' + n.title + '</div>' +
      '<div class="desc">' + n.desc + '</div>';
    track.appendChild(lab);
  });

  function activate(i){
    document.querySelectorAll('.tpp-node').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('node' + i);
    if (el) el.classList.add('active');
    document.getElementById('counterNow').textContent = NODES[i].num;
  }

  const beats = gsap.timeline();
  beats.to('#counter', { opacity:1, duration:0.4, ease:"power2.out" }, 0.15);

  beats.fromTo('#node0', { scale:0 }, { scale:1.10, duration:0.45, ease:"back.out(1.7)" }, 0.30);
  beats.to('#node0', { scale:1, duration:0.15, ease:"power2.out" }, 0.75);
  beats.call(() => activate(0), null, 0.55);
  beats.to('#lab0', { opacity:1, duration:0.35, ease:"power2.out" }, 0.70);
  beats.fromTo('#pulse', { scale:0 }, { scale:1, duration:0.35, ease:"back.out(1.7)" }, 0.55);

  const STEP = 1.45;
  let cursor = 1.25;
  for (let i = 1; i < NODES.length; i++) {
    const t = cursor;
    beats.to(track,  { x: STATIONS[i], duration:0.90, ease:"power2.inOut" }, t);
    beats.to(lineFg, { width: NODE_X[i] - LINE_START, duration:0.90, ease:"power2.inOut" }, t);
    beats.fromTo('#node' + i, { scale:0 }, { scale:1.10, duration:0.45, ease:"back.out(1.7)" }, t + 0.45);
    beats.to('#node' + i, { scale:1, duration:0.15, ease:"power2.out" }, t + 0.90);
    beats.call(() => activate(i), null, t + 0.80);
    beats.to('#lab' + i, { opacity:1, duration:0.35, ease:"power2.out" }, t + 0.90);
    cursor = t + STEP;
  }

  // ODJAZD KAMERY — wszystkie cztery branże w jednym kadrze
  const S = 0.46;
  const MID_X = (NODE_X[0] + NODE_X[NODE_X.length-1]) / 2;
  const backAt = cursor;

  gsap.set(track, { transformOrigin: "0px 0px" });
  beats.to(track, {
    x: 960 - S * MID_X,
    y: 400 - S * 470,
    scale: S,
    duration: 1.10, ease:"power3.inOut"
  }, backAt);

  // podpisy gasną — w odjeździe i tak byłyby nieczytelne
  beats.to('.tpp-label', { opacity:0.28, duration:0.5, ease:"power2.out" }, backAt);
  beats.to(['#fadeL','#fadeR'], { opacity:0, duration:0.5 }, backAt);
  beats.to('#counter', { opacity:0, duration:0.4 }, backAt);

  // wspólny szkielet wyłania się pod nimi
  beats.fromTo('#core', { opacity:0, y:40 }, { opacity:1, y:0, duration:0.55, ease:"back.out(1.5)" }, backAt + 0.75);
  beats.to('#core', { scale:1.03, duration:0.35, ease:"back.out(1.8)" }, backAt + 1.30);
  beats.to('#core', { scale:1.00, duration:0.30, ease:"power2.out" }, backAt + 1.65);

  beats.to('#final', { opacity:1, duration:0.40, ease:"power3.out" }, backAt + 1.55);
  beats.from('#final', { y:22, duration:0.40, ease:"power3.out" }, backAt + 1.55);

  const BEATS_DUR = backAt + 2.6;
  beats.timeScale(0.62);

  // oś główna: najpierw karta tytułowa, potem spowolnione beaty oryginału
  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"CZTERY BRANŻE. JEDEN FUNDAMENT." });
  tl.add(beats, 3.9);

  const DURATION = 3.9 + BEATS_DUR / 0.62 + 2.2;
  beats.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "e01-02-long",
    duration: DURATION,
    tail: 0.4,
    label: "E01 LONG · 02 · CZTERY BRANŻE (pan + odjazd) · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

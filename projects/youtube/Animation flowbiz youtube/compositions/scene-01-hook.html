<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 01 — Hook · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<style>
  :root{
    --bg:#0A0A08;
    --amber:#F5A623;
    --light:#FAF8F0;
    --sec1:#5A5450;
    --sec2:#3A3630;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--light);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}

  .wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}

  .stage{
    position:absolute;
    width:1920px;height:1080px;
    background:var(--bg);
    overflow:hidden;
    transform-origin:top left;
  }
  /* SVG grid */
  .stage .grid{
    position:absolute;inset:0;
    pointer-events:none;
    z-index:0;
  }
  .stage .particles{
    position:absolute;inset:0;
    pointer-events:none;
    z-index:1;
  }

  /* Content */
  .scene{
    position:absolute;inset:0;
    display:flex;flex-direction:column;justify-content:center;
    padding: 0 160px;
    z-index:2;
  }
  .lines{
    display:flex;flex-direction:column;gap:18px;
  }
  .line{
    font-size:72px;
    font-weight:900;
    letter-spacing:-0.02em;
    line-height:1.05;
    color:var(--light);
    opacity:0;
    transform:translateX(-80px);
    will-change:transform,opacity;
  }
  .line .am{color:var(--amber)}

  .rule{
    margin-top:48px;
    height:3px;
    width:0;
    background:var(--amber);
    will-change:width;
  }

  .punch{
    position:absolute;
    left:0;right:0;
    bottom:200px;
    text-align:center;
    z-index:3;
  }
  .punch .big{
    display:inline-block;
    font-size:96px;
    font-weight:800;
    letter-spacing:-0.025em;
    color:var(--light);
    opacity:0;
    transform:scale(0.6);
    will-change:transform,opacity,text-shadow;
  }

  .watermark{
    position:absolute;right:48px;bottom:36px;
    color:#1E1C18;
    font-size:22px;font-weight:600;letter-spacing:0.08em;
    z-index:5;
    user-select:none;
  }

  /* Controls */
  .controls{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;
    background:rgba(20,18,14,0.92);
    border:1px solid rgba(245,166,35,0.2);
    padding:8px 10px;
    z-index:100;
    backdrop-filter:blur(8px);
  }
  .controls button{
    background:transparent;border:0;color:var(--light);font:inherit;
    padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0.04em;
    display:inline-flex;align-items:center;gap:6px;
  }
  .controls button:hover{background:rgba(245,166,35,0.12);color:var(--amber)}
  .controls .primary{color:var(--amber)}
  .controls .t{color:var(--sec1);font-size:13px;font-variant-numeric:tabular-nums;padding:0 10px;min-width:84px;text-align:center}
  .controls .t b{color:var(--amber)}
  .corner-brand{
    position:fixed;top:14px;left:18px;z-index:100;
    color:var(--sec1);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;
  }
  .corner-brand b{color:var(--amber)}
  body.export .controls,body.export .corner-brand{display:none}
  /* OBS-NATIVE-MODE — 1:1 capture, no transform scaling, no letterbox */
  body.native, body.native html { background:#0A0A08; overflow:hidden; }
  body.native .wrap{ width:1920px; height:1080px; position:fixed; top:0; left:0; transform:none; }
  body.native .stage{ left:0 !important; top:0 !important; transform:none !important; }
  body.native .controls, body.native .corner-brand{ display:none }
</style>
</head>
<body>

<div class="corner-brand"><b>Build with Matt</b> · Scene 01 · Hook · 5.0s</div>

<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <!-- Grid -->
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <!-- Particles -->
    <svg class="particles" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <circle cx="220"  cy="180" r="3"   fill="#F5A623" opacity="0.12"/>
      <circle cx="1640" cy="240" r="2"   fill="#F5A623" opacity="0.10"/>
      <circle cx="1820" cy="640" r="4"   fill="#F5A623" opacity="0.08"/>
      <circle cx="120"  cy="820" r="3"   fill="#F5A623" opacity="0.13"/>
      <circle cx="980"  cy="120" r="2.5" fill="#F5A623" opacity="0.09"/>
      <circle cx="540"  cy="940" r="3"   fill="#F5A623" opacity="0.11"/>
      <circle cx="1280" cy="900" r="2"   fill="#F5A623" opacity="0.15"/>
      <circle cx="1480" cy="420" r="2.5" fill="#F5A623" opacity="0.08"/>
    </svg>

    <!-- Scene content -->
    <div class="scene">
      <div class="lines">
        <div class="line" id="l1"><span class="am">PÓŁ ROKU</span> budowania narzędzia.</div>
        <div class="line" id="l2"><span class="am">8 MIESIĘCY</span> w low-code.</div>
        <div class="line" id="l3"><span class="am">Jedna rozmowa</span> z Tomkiem Karwatką.</div>
      </div>
      <div class="rule" id="rule"></div>
    </div>

    <div class="punch">
      <span class="big" id="punch">Opłacało się.</span>
    </div>

    <div class="watermark">flowbiz.pl</div>
  </div>
</div>

<div class="controls">
  <button id="play" class="primary" title="Odtwórz (spacja)"><i class="ti ti-player-play-filled"></i> Odtwórz</button>
  <button id="restart" title="Restart"><i class="ti ti-refresh"></i> Restart</button>
  <span class="t"><b id="t-now">0.00</b> / 5.00s</span>
  <button id="rec" title="Nagraj scenę 1920×1080 (WebM, 25 Mbps)" style="color:#FF6E4F"><i class="ti ti-circle-filled"></i> Nagraj</button>
  <button id="fullsize" title="Pełny widok do nagrania (fullscreen + ukryte chrome)"><i class="ti ti-arrows-maximize"></i> Full</button>
  <button id="native11" title="Tryb 1:1 (1920×1080, do OBS)"><i class="ti ti-aspect-ratio"></i> 1:1</button>
  <button id="fs" title="Pełny ekran"><i class="ti ti-maximize"></i></button>
</div>

<script>
  // Fit 1920x1080 to viewport
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  function fit(){
    const s = Math.min(wrap.clientWidth/1920, wrap.clientHeight/1080);
    stage.style.transform = `scale(${s})`;
    const w = 1920*s, h = 1080*s;
    stage.style.left = ((wrap.clientWidth - w)/2)+'px';
    stage.style.top  = ((wrap.clientHeight - h)/2)+'px';
  }
  // OBS-NATIVE-INIT
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get('native') === '1' || location.hash === '#native') {
      document.body.classList.add('native');
    }
  })();
  function toggleNative(){
    document.body.classList.toggle('native');
    fit();
  }
  window.toggleNative = toggleNative;
  window.addEventListener('resize', fit);
  fit();

  // ===== GSAP TIMELINE =====
  const spring = "cubic-bezier(0.34, 1.56, 0.64, 1)";
  // GSAP's CustomEase isn't included on the free CDN by default, so we replicate the cubic with gsap.parseEase fallback
  gsap.registerPlugin();

  const tl = gsap.timeline({ paused: true });

  // 0.0s — three lines stagger in from left
  tl.to(["#l1","#l2","#l3"], {
    opacity: 1,
    x: 0,
    duration: 0.45,
    ease: "power3.out",
    stagger: 0.18
  }, 0);

  // 1.4s — amber rule draws left → right
  tl.to("#rule", {
    width: 640,
    duration: 0.5,
    ease: "power2.inOut"
  }, 1.4);

  // 2.1s — "Opłacało się." spring scale + fade in
  // Approximate the spring cubic-bezier(0.34,1.56,0.64,1) by going to 1.04 then settling to 1.0
  tl.fromTo("#punch",
    { opacity: 0, scale: 0.6 },
    { opacity: 1, scale: 1.04, duration: 0.45, ease: "power3.out" },
    2.1
  );
  tl.to("#punch", { scale: 1.0, duration: 0.20, ease: "power2.out" }, 2.55);

  // 3.2s — subtle amber glow pulse on "Opłacało się"
  tl.to("#punch", {
    textShadow: "0 0 20px rgba(245,166,35,0.85), 0 0 40px rgba(245,166,35,0.35)",
    duration: 0.4,
    ease: "power2.out"
  }, 3.2);
  tl.to("#punch", {
    textShadow: "0 0 0px rgba(245,166,35,0)",
    duration: 0.4,
    ease: "power2.in"
  }, 3.6);

  // Hold tail to land at 5s
  tl.to({}, { duration: 0.8 }, 4.2);

  // Register on window for external runners
  window.__timelines = window.__timelines || {};
  window.__timelines["scene-01-hook"] = tl;

  // ===== Controls =====
  const tNow = document.getElementById('t-now');
  function update(){
    tNow.textContent = tl.time().toFixed(2);
  }
  tl.eventCallback("onUpdate", update);

  document.getElementById('play').onclick = ()=>{
    if (tl.progress() >= 1) tl.restart();
    else tl.play();
  };
  document.getElementById('restart').onclick = ()=>tl.restart();
  document.getElementById('native11').onclick = ()=>{ toggleNative(); };
  // RECORDER-MODE — expose timeline + fit so recorder.js can drive them
  window.__sceneTimeline = tl;
  window.__sceneDuration = 5;
  window.fit = fit;
  document.getElementById('rec').onclick = async ()=>{
    const btn = document.getElementById('rec');
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-loader-2"></i> Wybierz tę kartę…';
    btn.disabled = true;
    try {
      await window.flowbizRecorder.record({
        timeline: window.__sceneTimeline,
        duration: 5,
        tail: 0.4,
        fileName: 'scene-01-hook.webm'
      });
    } finally {
      btn.innerHTML = old;
      btn.disabled = false;
    }
  };
  // FULLSIZE-MODE — fullscreen + hide chrome + auto-1:1 if screen >= 1920×1080
  document.getElementById('fullsize').onclick = async ()=>{
    document.body.classList.add('export');
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    } catch(e){ /* ignore */ }
    // After entering fullscreen, if the screen comfortably holds 1920×1080, engage native 1:1.
    setTimeout(()=>{
      if (window.innerWidth >= 1920 && window.innerHeight >= 1080) {
        document.body.classList.add('native');
      }
      fit();
    }, 80);
  };
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) {
      document.body.classList.remove('export');
      document.body.classList.remove('native');
      fit();
    }
  });
  document.getElementById('fs').onclick = ()=>{
    if (!document.fullscreenElement) wrap.requestFullscreen?.();
    else document.exitFullscreen?.();
  };
  document.addEventListener('keydown', e=>{
    if (e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if (tl.progress() >= 1) tl.restart();
      else tl.paused() ? tl.play() : tl.pause();
    }
  });

  // Autoplay once fonts are ready so first paint isn't jarring
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{
    setTimeout(()=>tl.play(0), 250);
  });
</script>
</body>
</html>

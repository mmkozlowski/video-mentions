<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 06 — Retool ceiling · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<style>
  :root{
    --bg:#0A0A08;--amber:#F5A623;--amber2:#E09010;
    --light:#FAF8F0;--sec1:#5A5450;--sec2:#3A3630;
    --red:#C0553A;--green:#3FA66A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:#000;color:var(--light);font-family:"DM Sans",system-ui,sans-serif;overflow:hidden;-webkit-font-smoothing:antialiased}
  .wrap{position:relative;width:100vw;height:100vh;display:flex;align-items:center;justify-content:center}
  .stage{
    position:absolute;width:1920px;height:1080px;
    background:var(--bg);overflow:hidden;transform-origin:top left;
  }
  .grid{position:absolute;inset:0;pointer-events:none;z-index:0}
  .shaker{position:absolute;inset:0;will-change:transform;z-index:1}

  /* Chart frame
     y-axis at x=240, from y=120 (top) to y=880 (bottom)
     x-axis at y=880, from x=240 to x=1700
     Chart inner height = 760px
     Ceiling line at 65% up from x-axis: y = 880 - 0.65*760 = 386
     Bar: x=560, width=200, anchored bottom y=880
     Bar peak height (60% of chart) = 456 ; top at y=424 — sits just under ceiling.
  */
  .chartLayer{position:absolute;inset:0;z-index:2}

  /* Bar (HTML so we can animate height and house labels easily) */
  .bar{
    position:absolute;
    left:560px;
    bottom:200px;       /* 1080 - 880 = 200 */
    width:200px;
    height:0px;
    background: linear-gradient(180deg, #F5A623 0%, #E09010 100%);
    border-radius: 4px 4px 0 0;
    z-index:2;
    will-change:height;
    box-shadow: 0 0 0 1px rgba(245,166,35,0.4);
  }

  /* Axis labels */
  .x-lab{
    position:absolute;
    top:920px;
    left:50%;
    transform:translateX(-50%);
    font-size:24px;color:var(--sec2);letter-spacing:0.18em;font-weight:600;
    white-space:nowrap;
    z-index:2;opacity:0;
  }
  .y-lab{
    position:absolute;
    left:96px;
    top:50%;
    transform: translate(-50%, -50%) rotate(-90deg);
    transform-origin:center center;
    font-size:24px;color:var(--sec2);letter-spacing:0.18em;font-weight:600;
    white-space:nowrap;
    z-index:2;opacity:0;
  }

  /* Badges along the bar */
  .badge{
    position:absolute;
    display:inline-flex;align-items:center;gap:10px;
    padding:10px 16px;
    border-radius:6px;
    font-size:22px;font-weight:600;letter-spacing:0.02em;
    white-space:nowrap;
    opacity:0;
    transform:translateX(60px);
    z-index:3;
    will-change:transform,opacity;
  }
  .badge .mk{font-weight:800;font-size:22px}
  .badge.ok{ background:rgba(63,166,106,0.10); border:1px solid rgba(63,166,106,0.45); color:#7FD49E }
  .badge.ok .mk{color:#3FA66A}
  .badge.warn{ background:rgba(245,166,35,0.10); border:1px solid rgba(245,166,35,0.45); color:var(--amber) }
  .badge.warn .mk{color:var(--amber)}

  /* Impact ŚCIANA badge */
  .wall{
    position:absolute;
    left: 800px;             /* left edge ~ right of bar (560+200=760) + small gap */
    top: 240px;              /* sits above ceiling (y=386) so it doesn't overlap badge3 */
    padding:18px 30px;
    background:#1A0E0B;
    border:2px solid var(--red);
    border-radius:10px;
    display:inline-flex;align-items:center;gap:14px;
    color:var(--red);
    font-size:42px;font-weight:900;letter-spacing:0.16em;
    opacity:0;transform:scale(0);
    z-index:5;
    box-shadow: 0 0 0 0 rgba(192,85,58,0.0);
  }
  .wall .mk{font-size:42px}

  /* Ceiling line (SVG so we can drawSVG and flash opacity) */
  .ceiling{position:absolute;inset:0;z-index:3;pointer-events:none}
  .ceiling-label{
    position:absolute;
    right:240px;
    top:340px;          /* a bit above the line so it doesn't clip */
    font-size:22px;color:var(--red);letter-spacing:0.22em;font-weight:700;
    z-index:3;opacity:0;
  }

  /* Below-bar caption */
  .caption{
    position:absolute;left:0;right:0;
    top:980px;
    text-align:center;
    font-size:34px;color:var(--sec1);font-weight:500;
    opacity:0;
    z-index:4;
  }

  /* watermark + chrome */
  .watermark{
    position:absolute;right:48px;bottom:36px;
    color:#1E1C18;font-size:22px;font-weight:600;letter-spacing:0.08em;
    z-index:6;user-select:none;
  }
  .corner-brand{
    position:fixed;top:14px;left:18px;z-index:100;
    color:var(--sec1);font-size:13px;letter-spacing:0.18em;text-transform:uppercase;font-weight:600;
  }
  .corner-brand b{color:var(--amber)}
  .controls{
    position:fixed;bottom:18px;left:50%;transform:translateX(-50%);
    display:flex;gap:8px;align-items:center;background:rgba(20,18,14,0.92);
    border:1px solid rgba(245,166,35,0.2);padding:8px 10px;z-index:100;backdrop-filter:blur(8px);
  }
  .controls button{background:transparent;border:0;color:var(--light);font:inherit;padding:8px 14px;cursor:pointer;font-size:14px;font-weight:600;letter-spacing:0.04em;display:inline-flex;align-items:center;gap:6px}
  .controls button:hover{background:rgba(245,166,35,0.12);color:var(--amber)}
  .controls .primary{color:var(--amber)}
  .controls .t{color:var(--sec1);font-size:13px;font-variant-numeric:tabular-nums;padding:0 10px;min-width:84px;text-align:center}
  .controls .t b{color:var(--amber)}
  body.export .controls,body.export .corner-brand{display:none}
  /* OBS-NATIVE-MODE — 1:1 capture, no transform scaling, no letterbox */
  body.native, body.native html { background:#0A0A08; overflow:hidden; }
  body.native .wrap{ width:1920px; height:1080px; position:fixed; top:0; left:0; transform:none; }
  body.native .stage{ left:0 !important; top:0 !important; transform:none !important; }
  body.native .controls, body.native .corner-brand{ display:none }
</style>
</head>
<body>

<div class="corner-brand"><b>Build with Matt</b> · Scene 06 · Retool ceiling · 4.5s</div>

<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <!-- Grid -->
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <!-- Everything that should shake on impact goes inside .shaker -->
    <div class="shaker" id="shaker">

      <!-- Axes -->
      <svg class="chartLayer" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <path id="yAxis" d="M 240 880 L 240 120" fill="none" stroke="#3A3630" stroke-width="2" stroke-linecap="round"/>
        <path id="xAxis" d="M 240 880 L 1700 880" fill="none" stroke="#3A3630" stroke-width="2" stroke-linecap="round"/>
        <!-- subtle tick marks -->
        <g stroke="#2E2C28" stroke-width="1.5">
          <line x1="232" y1="728" x2="248" y2="728"/>
          <line x1="232" y1="576" x2="248" y2="576"/>
          <line x1="232" y1="424" x2="248" y2="424"/>
          <line x1="232" y1="272" x2="248" y2="272"/>
        </g>
      </svg>

      <!-- Bar -->
      <div class="bar" id="bar"></div>

      <!-- Ceiling line (full-width dashed) -->
      <svg class="ceiling" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
        <line id="ceilLine" x1="240" y1="386" x2="1700" y2="386"
              stroke="#C0553A" stroke-width="4" stroke-dasharray="14 10" stroke-linecap="round" opacity="0"/>
      </svg>
      <div class="ceiling-label" id="ceilLabel">LOW-CODE LIMIT</div>

      <!-- Bar badges (positioned by chart y for 20/40/60% of inner height) -->
      <!-- 20% → y=728   (bar right edge at x=760, badge x=800) -->
      <div class="badge ok"   id="badge1" style="left:800px; top:702px;"><span class="mk">✓</span><span>Proste zamówienia</span></div>
      <!-- 40% → y=576 -->
      <div class="badge ok"   id="badge2" style="left:800px; top:550px;"><span class="mk">✓</span><span>Standardowe produkty</span></div>
      <!-- 60% → y=424 -->
      <div class="badge warn" id="badge3" style="left:800px; top:398px;"><span class="mk">…</span><span>Złożone produkty</span></div>

      <!-- Impact ŚCIANA badge (above the bar near ceiling) -->
      <div class="wall" id="wall"><span class="mk">✗</span><span>ŚCIANA</span></div>

      <!-- Axis labels -->
      <div class="x-lab" id="xLab">ZŁOŻONOŚĆ PRODUKTU →</div>
      <div class="y-lab" id="yLab">MOŻLIWOŚCI NARZĘDZIA ↑</div>

      <!-- Caption -->
      <div class="caption" id="caption">Złożoność kodu rosła. Utrzymanie zaczęło boleć.</div>

    </div>

    <div class="watermark">flowbiz.pl</div>
  </div>
</div>

<div class="controls">
  <button id="play" class="primary"><i class="ti ti-player-play-filled"></i> Odtwórz</button>
  <button id="restart"><i class="ti ti-refresh"></i> Restart</button>
  <span class="t"><b id="t-now">0.00</b> / 4.50s</span>
  <button id="rec" title="Nagraj scenę 1920×1080 (WebM, 25 Mbps)" style="color:#FF6E4F"><i class="ti ti-circle-filled"></i> Nagraj</button>
  <button id="fullsize" title="Pełny widok do nagrania (fullscreen + ukryte chrome)"><i class="ti ti-arrows-maximize"></i> Full</button>
  <button id="native11" title="Tryb 1:1 (1920×1080, do OBS)"><i class="ti ti-aspect-ratio"></i> 1:1</button>
  <button id="fs" title="Pełny ekran"><i class="ti ti-maximize"></i></button>
</div>

<script>
  // Fit
  const stage = document.getElementById('stage');
  const wrap = document.getElementById('wrap');
  function fit(){
    if (document.body.classList.contains('native')) {
      stage.style.transform = 'none';
      stage.style.left = '0px';
      stage.style.top  = '0px';
      return;
    }
    const s = Math.min(wrap.clientWidth/1920, wrap.clientHeight/1080);
    stage.style.transform = `scale(${s})`;
    stage.style.left = ((wrap.clientWidth - 1920*s)/2)+'px';
    stage.style.top  = ((wrap.clientHeight - 1080*s)/2)+'px';
  }
  // OBS-NATIVE-INIT
  (function(){
    const q = new URLSearchParams(location.search);
    if (q.get('native') === '1' || location.hash === '#native') {
      document.body.classList.add('native');
    }
  })();
  function toggleNative(){
    document.body.classList.toggle('native');
    fit();
  }
  window.toggleNative = toggleNative;
  window.addEventListener('resize', fit);
  fit();

  // Prep drawSVG-style for axes
  function prepLine(id){
    const el = document.getElementById(id);
    const L = el.getTotalLength();
    el.style.strokeDasharray  = L;
    el.style.strokeDashoffset = L;
    return L;
  }
  prepLine('xAxis');
  prepLine('yAxis');

  const tl = gsap.timeline({ paused: true });

  // 0.0s — axes draw, labels fade
  tl.to("#xAxis", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.0);
  tl.to("#yAxis", { strokeDashoffset: 0, duration: 0.4, ease: "power2.inOut" }, 0.0);
  tl.to(["#xLab","#yLab"], { opacity: 1, duration: 0.35, ease: "power2.out" }, 0.25);

  // Ceiling line drawn faintly first so the bar growing toward it feels intentional
  tl.to("#ceilLine",   { opacity: 0.55, duration: 0.4, ease: "power2.out" }, 0.25);
  tl.to("#ceilLabel",  { opacity: 1,    duration: 0.4, ease: "power2.out" }, 0.30);

  // 0.4s — bar grows from 0 to 60% of inner height (456px)
  tl.to("#bar", { height: 456, duration: 1.8, ease: "power1.inOut" }, 0.4);

  // 0.8s — badge 1 (20%)
  tl.to("#badge1", { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 0.8);
  // 1.2s — badge 2 (40%)
  tl.to("#badge2", { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.2);
  // 1.6s — badge 3 (60%, amber/uncertain)
  tl.to("#badge3", { x: 0, opacity: 1, duration: 0.35, ease: "power3.out" }, 1.6);

  // 2.2s — IMPACT: bar stops, screen shake + ceiling flash
  // Screen shake — x ±6, 3 cycles, 0.2s total
  tl.to("#shaker", { x: -6,  duration: 0.033, ease: "none" }, 2.2);
  tl.to("#shaker", { x:  6,  duration: 0.034, ease: "none" }, 2.233);
  tl.to("#shaker", { x: -5,  duration: 0.033, ease: "none" }, 2.267);
  tl.to("#shaker", { x:  5,  duration: 0.034, ease: "none" }, 2.300);
  tl.to("#shaker", { x: -3,  duration: 0.033, ease: "none" }, 2.334);
  tl.to("#shaker", { x:  0,  duration: 0.034, ease: "none" }, 2.367);

  // Ceiling flash: opacity 1→0.3→1→0.3→1, over 0.4s
  tl.to("#ceilLine", { opacity: 1.0, duration: 0.07, ease: "none" }, 2.2);
  tl.to("#ceilLine", { opacity: 0.3, duration: 0.08, ease: "none" }, 2.27);
  tl.to("#ceilLine", { opacity: 1.0, duration: 0.08, ease: "none" }, 2.35);
  tl.to("#ceilLine", { opacity: 0.3, duration: 0.07, ease: "none" }, 2.43);
  tl.to("#ceilLine", { opacity: 1.0, duration: 0.10, ease: "none" }, 2.50);

  // 2.6s — ŚCIANA ✗ impact badge (spring overshoot)
  tl.fromTo("#wall",
    { opacity: 0, scale: 0 },
    { opacity: 1, scale: 1.2, duration: 0.25, ease: "power3.out" },
    2.6
  );
  tl.to("#wall", { scale: 1.0, duration: 0.15, ease: "power2.out" }, 2.85);
  // pulse the red border softly on hold
  tl.to("#wall", { boxShadow:"0 0 0 12px rgba(192,85,58,0.0)", duration: 0.6, ease: "power2.out" }, 2.85);

  // 3.2s — caption below
  tl.fromTo("#caption",
    { opacity: 0, y: 12 },
    { opacity: 1, y: 0, duration: 0.5, ease: "power2.out" },
    3.2
  );

  // Hold tail to land at 4.5s
  tl.to({}, { duration: 0.6 }, 3.9);

  window.__timelines = window.__timelines || {};
  window.__timelines["scene-06-retool-ceiling"] = tl;

  const tNow = document.getElementById('t-now');
  tl.eventCallback("onUpdate", ()=>{ tNow.textContent = tl.time().toFixed(2); });

  document.getElementById('play').onclick = ()=>{ tl.progress() >= 1 ? tl.restart() : tl.play(); };
  document.getElementById('restart').onclick = ()=>tl.restart();
  document.getElementById('native11').onclick = ()=>{ toggleNative(); };
  // RECORDER-MODE — expose timeline + fit so recorder.js can drive them
  window.__sceneTimeline = tl;
  window.__sceneDuration = 4.5;
  window.fit = fit;
  document.getElementById('rec').onclick = async ()=>{
    const btn = document.getElementById('rec');
    const old = btn.innerHTML;
    btn.innerHTML = '<i class="ti ti-loader-2"></i> Wybierz tę kartę…';
    btn.disabled = true;
    try {
      await window.flowbizRecorder.record({
        timeline: window.__sceneTimeline,
        duration: 4.5,
        tail: 0.4,
        fileName: 'scene-06-retool-ceiling.webm'
      });
    } finally {
      btn.innerHTML = old;
      btn.disabled = false;
    }
  };
  // FULLSIZE-MODE — fullscreen + hide chrome + auto-1:1 if screen >= 1920×1080
  document.getElementById('fullsize').onclick = async ()=>{
    document.body.classList.add('export');
    try {
      await document.documentElement.requestFullscreen({ navigationUI: 'hide' });
    } catch(e){ /* ignore */ }
    // After entering fullscreen, if the screen comfortably holds 1920×1080, engage native 1:1.
    setTimeout(()=>{
      if (window.innerWidth >= 1920 && window.innerHeight >= 1080) {
        document.body.classList.add('native');
      }
      fit();
    }, 80);
  };
  document.addEventListener('fullscreenchange', ()=>{
    if (!document.fullscreenElement) {
      document.body.classList.remove('export');
      document.body.classList.remove('native');
      fit();
    }
  });
  document.getElementById('fs').onclick = ()=>{
    if (!document.fullscreenElement) wrap.requestFullscreen?.(); else document.exitFullscreen?.();
  };
  document.addEventListener('keydown', e=>{
    if (e.key === ' ' || e.code === 'Space'){
      e.preventDefault();
      if (tl.progress() >= 1) tl.restart();
      else tl.paused() ? tl.play() : tl.pause();
    }
  });
  (document.fonts ? document.fonts.ready : Promise.resolve()).then(()=>{ setTimeout(()=>tl.play(0), 250); });
</script>
</body>
</html>

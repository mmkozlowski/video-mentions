<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 07 — Node graph: ryzyko · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .s07-bg{ position:absolute;inset:0;z-index:0;pointer-events:none; }
  .s07-lines{ position:absolute;inset:0;z-index:1;pointer-events:none; }
  .s07-node{
    position:absolute;left:580px;top:540px;
    width:200px;height:200px;border-radius:50%;
    border:3px solid #F5A623;background:#0D0D0B;  /* CHROMAKEY: solid bg pod ikoną */
    transform:translate(-50%,-50%) scale(0);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
    will-change:transform;
    box-shadow:0 0 60px rgba(245,166,35,0.15) inset, 0 0 40px rgba(245,166,35,0.10);
  }
  .s07-node svg{ width:80px;height:80px;color:#F5A623; }

  .s07-eyebrow{
    position:absolute;left:160px;top:200px;
    font-size:24px;font-weight:600;color:#C0553A;
    letter-spacing:0.32em;text-transform:uppercase;
    opacity:0;transform:translateY(-15px);
    z-index:3;
  }

  .s07-card{
    position:absolute;left:1050px;
    width:640px;padding:28px 36px;
    background:#0D0D0B;  /* CHROMAKEY: solid bg pod tekstem karty */
    border-left:6px solid #C0553A;
    transform:translate(60px,-50%);opacity:0;
    will-change:transform,opacity;
    z-index:2;
  }
  .s07-card.amber{ background:#0D0D0B;border-left-color:#F5A623; }  /* CHROMAKEY: solid */
  .s07-card .h{ font-size:52px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em;line-height:1.05; }
  .s07-card .s{ font-size:36px;font-weight:500;color:#5A5450;margin-top:6px;letter-spacing:-0.005em; }
  #cardA{ top:280px; }
  #cardB{ top:530px; }
  #cardC{ top:780px; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <svg class="s07-bg" viewBox="0 0 1920 1080" aria-hidden="true">
      <circle cx="580" cy="540" r="180" fill="none" stroke="rgba(245,166,35,0.05)" stroke-width="1.5"/>
      <circle cx="580" cy="540" r="320" fill="none" stroke="rgba(245,166,35,0.03)" stroke-width="1.5"/>
      <circle cx="580" cy="540" r="500" fill="none" stroke="rgba(245,166,35,0.02)" stroke-width="1.5"/>
    </svg>

    <svg class="s07-lines" viewBox="0 0 1920 1080" aria-hidden="true">
      <!-- Smooth cubic-bezier curves from node-right-edge (680,540) to card-left-edge -->
      <path id="lA" d="M 680 540 C 830 540, 900 280, 1050 280"
            fill="none" stroke="#C0553A" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
      <path id="lB" d="M 680 540 C 830 540, 900 530, 1050 530"
            fill="none" stroke="#C0553A" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>
      <path id="lC" d="M 680 540 C 830 540, 900 780, 1050 780"
            fill="none" stroke="#F5A623" stroke-opacity="0.55" stroke-width="3" stroke-linecap="round"/>

      <!-- Endpoint dots that pop in when each line finishes drawing -->
      <circle id="dotA" cx="1050" cy="280" r="0" fill="#C0553A"/>
      <circle id="dotB" cx="1050" cy="530" r="0" fill="#C0553A"/>
      <circle id="dotC" cx="1050" cy="780" r="0" fill="#F5A623"/>
    </svg>

    <div class="scene">
      <div class="s07-eyebrow" id="eyebrow"><span class="chroma-plate amber">PROBLEM #1 · RYZYKO</span></div>

      <div class="s07-node" id="node">
        <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
          <circle cx="12" cy="7" r="4"/>
          <path d="M4 21c0-4.5 3.5-8 8-8s8 3.5 8 8" stroke="currentColor" stroke-width="2" fill="none"/>
        </svg>
      </div>

      <div class="s07-card" id="cardA">
        <div class="h">Odejście</div>
        <div class="s">= utrata algorytmu</div>
      </div>
      <div class="s07-card" id="cardB">
        <div class="h">Choroba</div>
        <div class="s">= tygodnie bez wycen</div>
      </div>
      <div class="s07-card amber" id="cardC">
        <div class="h">Urlop</div>
        <div class="s">= chaos w ofertach</div>
      </div>
    </div>
  </div>
</div>

<script>
  // Set up stroke-dasharray for each line using its actual length — more
  // reliable than pathLength="1" + dasharray="1".
  ["lA","lB","lC"].forEach(id => {
    const p = document.getElementById(id);
    const len = p.getTotalLength();
    p.style.strokeDasharray  = len;
    p.style.strokeDashoffset = len;
  });

  const tl = gsap.timeline({ paused:true });

  // 0.0s — central node spring in
  tl.fromTo("#node",
    { scale:0 },
    { scale:1.10, duration:0.45, ease:"power3.out" },
    0.0
  );
  tl.to("#node", { scale:1.0, duration:0.15, ease:"power2.out" }, 0.45);

  // 0.3s — eyebrow label
  tl.to("#eyebrow", { opacity:1, y:0, duration:0.35, ease:"power2.out" }, 0.30);

  /**
   * Helper — draw line, pop endpoint dot, slide card in.
   *   line draws over 0.35s, dot pops 0.05s before line completes,
   *   card slides in 0.05s after line completes — so it feels like the
   *   line "delivers" the card.
   */
  function branch(at, lineId, dotId, cardId) {
    tl.to(`#${lineId}`,  { strokeDashoffset:0, duration:0.40, ease:"power2.inOut" }, at);
    tl.fromTo(`#${dotId}`, { attr:{ r:0 } },
                           { attr:{ r:10 }, duration:0.25, ease:"back.out(2.5)" }, at + 0.30);
    tl.to(`#${cardId}`,  { x:0, y:"-50%", opacity:1, duration:0.40, ease:"back.out(1.6)" }, at + 0.35);
  }

  branch(0.55, "lA", "dotA", "cardA");
  branch(0.95, "lB", "dotB", "cardB");
  branch(1.35, "lC", "dotC", "cardC");

  // 2.4s — node border pulses subtly while user reads
  tl.to("#node", { scale:1.06, duration:0.75, ease:"sine.inOut", yoyo:true, repeat:-1 }, 2.4);

  // Hold tail to land at 4.0s
  tl.to({}, { duration: 0.5 }, 3.4);

  flowbizScene.init({
    id: "scene-07",
    duration: 4.0,
    tail: 0.4,
    label: "Scene 07 · Node graph: ryzyko · 4.0s",
    timeline: tl
  });
</script>
</body>
</html>

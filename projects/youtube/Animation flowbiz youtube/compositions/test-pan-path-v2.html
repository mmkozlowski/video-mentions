<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Test — ścieżka panoramiczna v2 (krzywa) · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* Fixed chrome — eyebrow + counter staying outside the panning track */
  .tpp-eyebrow{
    position:absolute;left:50%;top:90px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;
    z-index:5;opacity:0;
  }
  .tpp-counter{
    position:absolute;left:50%;bottom:110px;transform:translateX(-50%);
    font-size:20px;font-weight:600;color:#5A5450;letter-spacing:0.18em;
    z-index:5;font-variant-numeric:tabular-nums;opacity:0;
  }
  .tpp-counter b{ color:#F5A623; }

  /* Soft edge masks so panning doesn't show hard cuts on the sides */
  .tpp-fade{ position:absolute;top:0;bottom:0;width:240px;z-index:6;pointer-events:none; }
  .tpp-fade.left { left:0;  background:linear-gradient(to right, #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  .tpp-fade.right{ right:0; background:linear-gradient(to left,  #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  body.chromakey .tpp-fade{ display:none !important; }
  /* Defensive: ikona w środku węzła zawsze na ciemnym tle, nawet po chroma key */
  body.chromakey .tpp-node{ background:#0D0D0B !important; }

  /* The wide panning track */
  .tpp-track{
    position:absolute;left:0;top:0;
    height:1080px;
    will-change:transform;
    z-index:2;
  }

  /* SVG layer inside the track — for the curved background + foreground line.
     Width matches track width; height = 1080. */
  .tpp-svg{
    position:absolute;left:0;top:0;height:1080px;
    overflow:visible;
  }

  /* Node bubble */
  .tpp-node{
    position:absolute;
    width:160px;height:160px;border-radius:50%;
    border:2px solid rgba(245,166,35,0.30);
    background:#0D0D0B;
    transform:translate(-50%,-50%) scale(0);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
    transition:border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .tpp-node i{ font-size:60px;color:#F5A623;line-height:1; }
  .tpp-node.active{
    border-color:#F5A623;
    box-shadow:0 0 0 6px rgba(245,166,35,0.10), 0 0 56px rgba(245,166,35,0.45);
  }

  /* Label — placed dynamically below OR above each node depending on its y */
  .tpp-label{
    position:absolute;
    transform:translate(-50%, 0);
    text-align:center;
    z-index:3;opacity:0;
    min-width:280px;
  }
  .tpp-label .num{ font-size:18px;font-weight:600;letter-spacing:0.28em;color:#F5A623;margin-bottom:8px; }
  .tpp-label .title{ font-size:46px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em;line-height:1.05; }
  .tpp-label .desc{ font-size:22px;font-weight:500;color:#FAF8F0;opacity:0.6;margin-top:6px; }

  /* Travelling pulse — sits on the path, animates via motionPath */
  .tpp-pulse{
    position:absolute;left:0;top:0;
    width:22px;height:22px;border-radius:50%;
    background:#F5A623;
    transform:translate(-50%,-50%) scale(0);
    z-index:1;
    box-shadow:0 0 24px rgba(245,166,35,0.65);
  }

  /* Floating dot decorations along the curve (just to add texture / motion) */
  .tpp-deco{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(245,166,35,0.45);
    transform:translate(-50%,-50%);
    z-index:1;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="tpp-eyebrow" id="eyebrow">
        <span class="chroma-plate amber">PROCES · 5 KROKÓW</span>
      </div>

      <div class="tpp-track" id="track">
        <svg class="tpp-svg" id="svg" aria-hidden="true">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <!-- dim background path -->
          <path id="pathBg" d="" fill="none" stroke="rgba(245,166,35,0.18)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10"/>
          <!-- bright foreground path that animates -->
          <path id="pathFg" d="" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"
                pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#glow)"/>
        </svg>

        <div class="tpp-pulse" id="pulse"></div>
      </div>

      <div class="tpp-fade left"></div>
      <div class="tpp-fade right"></div>

      <div class="tpp-counter" id="counter">
        <span class="chroma-plate"><b id="counterNow">01</b> / <span id="counterTot">05</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  // ────────────────────────────────────────────────────────────────────────
  // 5 nodes scattered abstractly — varying X, Y, with control points for smooth curves
  // ────────────────────────────────────────────────────────────────────────
  const NODES = [
    { x: 600,  y: 640, icon:"ti ti-message-circle-2", num:"01", title:"Rozmowa",     desc:"co Cię boli",    labelBelow:true  },
    { x: 1500, y: 360, icon:"ti ti-search",           num:"02", title:"Analiza",     desc:"co robi proces", labelBelow:false },
    { x: 2400, y: 720, icon:"ti ti-tools",            num:"03", title:"Build",       desc:"moduły + flow",  labelBelow:true  },
    { x: 3300, y: 420, icon:"ti ti-bolt",             num:"04", title:"Test",        desc:"twardo, na produkcji", labelBelow:false },
    { x: 4200, y: 540, icon:"ti ti-rocket",           num:"05", title:"Wdrożenie",   desc:"działa",         labelBelow:true  },
  ];

  // Camera target — each node should land roughly at viewport center
  const STATIONS = NODES.map(n => ({
    x: 960  - n.x,
    y: 540  - n.y    // we also pan slightly in y so node lands close to vertical center
  }));

  const track = document.getElementById('track');
  const svg   = document.getElementById('svg');
  const pathBg = document.getElementById('pathBg');
  const pathFg = document.getElementById('pathFg');

  // Track width/height
  const TRACK_W = NODES[NODES.length - 1].x + 960;
  track.style.width = TRACK_W + 'px';
  svg.setAttribute('width', TRACK_W);
  svg.setAttribute('height', 1080);
  svg.setAttribute('viewBox', `0 0 ${TRACK_W} 1080`);

  // ────────────────────────────────────────────────────────────────────────
  // Build a smooth cubic-bezier path through the nodes (Catmull-Rom-ish).
  // For each pair (P_i, P_{i+1}) we use control points based on tangents
  // approximated from neighbour points.
  // ────────────────────────────────────────────────────────────────────────
  function buildCurvePath(pts){
    if (pts.length < 2) return "";
    const k = 0.35; // tangent strength
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;

      const c1x = p1.x + (p2.x - p0.x) * k;
      const c1y = p1.y + (p2.y - p0.y) * k;
      const c2x = p2.x - (p3.x - p1.x) * k;
      const c2y = p2.y - (p3.y - p1.y) * k;

      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
    }
    return d;
  }

  const PATH_D = buildCurvePath(NODES);
  pathBg.setAttribute('d', PATH_D);
  pathFg.setAttribute('d', PATH_D);

  // pathLength sampling so we know where each node sits along the path (0..1)
  const totalLen = pathFg.getTotalLength();
  const NODE_T = NODES.map((n) => {
    // Binary search for the closest point on the path to this node's (x,y)
    let lo = 0, hi = totalLen, best = 0, bestD = Infinity;
    const SAMPLES = 600;
    for (let s = 0; s <= SAMPLES; s++){
      const t = s / SAMPLES * totalLen;
      const p = pathFg.getPointAtLength(t);
      const dx = p.x - n.x, dy = p.y - n.y;
      const d = dx*dx + dy*dy;
      if (d < bestD){ bestD = d; best = t; }
    }
    return best / totalLen;
  });

  // Build nodes + labels
  NODES.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'tpp-node';
    node.id = 'node' + i;
    node.style.left = n.x + 'px';
    node.style.top  = n.y + 'px';
    node.innerHTML = `<i class="${n.icon}"></i>`;
    track.appendChild(node);

    const lab = document.createElement('div');
    lab.className = 'tpp-label';
    lab.id = 'lab' + i;
    lab.style.left = n.x + 'px';
    lab.style.top  = (n.y + (n.labelBelow ? 110 : -260)) + 'px';
    lab.innerHTML =
      `<div class="num"><span class="chroma-plate amber">${n.num}</span></div>` +
      `<div class="title">${n.title}</div>` +
      `<div class="desc">${n.desc}</div>`;
    track.appendChild(lab);
  });

  // Decorative dots scattered along the path between nodes
  const NUM_DECOS = 18;
  for (let i = 0; i < NUM_DECOS; i++){
    const t = (i + 0.5) / NUM_DECOS;
    const p = pathFg.getPointAtLength(t * totalLen);
    // Offset perpendicular randomly for a bit of "noise"
    const off = (Math.sin(i * 1.7) * 24);
    const deco = document.createElement('div');
    deco.className = 'tpp-deco';
    deco.style.left = (p.x) + 'px';
    deco.style.top  = (p.y + off) + 'px';
    deco.dataset.t = t;
    track.appendChild(deco);
  }

  function activate(i){
    document.querySelectorAll('.tpp-node').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('node' + i);
    if (el) el.classList.add('active');
    document.getElementById('counterNow').textContent = NODES[i].num;
  }

  // Position the pulse dot at a given t along the path
  function pulseAt(t){
    const p = pathFg.getPointAtLength(t * totalLen);
    gsap.set('#pulse', { x: p.x, y: p.y });
  }

  // Initialize pulse at first node
  pulseAt(NODE_T[0]);

  // ────────────────────────────────────────────────────────────────────────
  // TIMELINE
  // ────────────────────────────────────────────────────────────────────────
  const tl = gsap.timeline({ paused:true });

  // Initial camera position centered on node 0
  gsap.set(track, { x: STATIONS[0].x, y: STATIONS[0].y });

  // Intro chrome
  tl.fromTo('#eyebrow', { y:-10, opacity:0 }, { y:0, opacity:1, duration:0.4, ease:"power2.out" }, 0.0);
  tl.to('#counter',  { opacity:1, duration:0.4, ease:"power2.out" }, 0.15);

  // Node 0 spring-in
  tl.fromTo('#node0', { scale:0 }, { scale:1.10, duration:0.45, ease:"back.out(1.7)" }, 0.30);
  tl.to('#node0', { scale:1, duration:0.15, ease:"power2.out" }, 0.75);
  tl.call(() => activate(0), null, 0.55);
  tl.to('#lab0', { opacity:1, duration:0.35, ease:"power2.out" }, 0.70);

  tl.fromTo('#pulse', { scale:0 }, { scale:1, duration:0.35, ease:"back.out(1.7)" }, 0.55);

  // Decorative dots fade in softly
  tl.to('.tpp-deco', { opacity:1, duration:0.6, ease:"power1.out", stagger:0.02 }, 0.7);

  // For each subsequent node: pan camera (x+y), extend path, drop new node
  const STEP = 1.55;
  let cursor = 1.3;

  for (let i = 1; i < NODES.length; i++){
    const t = cursor;

    // (1) Pan camera (both axes — gives a "drifting" abstract feel)
    tl.to(track, {
      x: STATIONS[i].x,
      y: STATIONS[i].y,
      duration: 0.95,
      ease: "power2.inOut"
    }, t);

    // (2) Bright path grows from previous t to this node's t
    tl.to(pathFg, {
      attr: { 'stroke-dashoffset': 1 - NODE_T[i] },
      duration: 0.95,
      ease: "power2.inOut"
    }, t);

    // (3) Pulse dot rides along the curve, synced with the line draw
    tl.to({ t: NODE_T[i-1] }, {
      t: NODE_T[i],
      duration: 0.95,
      ease: "power2.inOut",
      onUpdate: function(){ pulseAt(this.targets()[0].t); }
    }, t);

    // (4) New node lands
    tl.fromTo('#node' + i, { scale:0 }, { scale:1.10, duration:0.45, ease:"back.out(1.7)" }, t + 0.50);
    tl.to('#node' + i, { scale:1, duration:0.15, ease:"power2.out" }, t + 0.95);

    // (5) Activate + label fade
    tl.call(() => activate(i), null, t + 0.85);
    tl.to('#lab' + i, { opacity:1, duration:0.35, ease:"power2.out" }, t + 0.95);

    cursor = t + STEP;
  }

  // Initial path: stroke-dashoffset should start such that only up to node 0 shows
  // For node 0 (first), we want offset = 1 - NODE_T[0]
  gsap.set(pathFg, { attr: { 'stroke-dashoffset': 1 - NODE_T[0] } });

  // Outro pulse
  const outroAt = cursor;
  tl.to('#pulse', { scale:1.4, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1 }, outroAt);
  tl.to('.tpp-node.active', { scale:1.04, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1 }, outroAt);

  const DURATION = outroAt + 1.6;
  tl.to({}, { duration: 0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "test-pan-path-v2",
    duration: DURATION,
    tail: 0.4,
    label: "Test · Ścieżka panoramiczna v2 (krzywa) · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>X04 — VENN: SZYBKO vs DOSTĘP (odc. 01) · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  /* EKSPERYMENT: dwa zbiory zamiast listy „za i przeciw".
     Sedno segmentu 4 nie jest takie, że low-code jest zły — tylko że dwie
     rzeczy, których chcesz, długo się nie spotykały. Venn pokazuje to
     jednym obrazem, czego wyliczanka nie potrafi. */
  .venn{ position:absolute;left:50%;top:512px;transform:translate(-50%,-50%);width:1180px;height:560px }
  .circ{
    position:absolute;top:0;width:560px;height:560px;border-radius:50%;
    border:2.5px solid rgba(245,166,35,0.4);opacity:0;
  }
  .circ.a{ left:0;   background:rgba(245,166,35,0.05) }
  .circ.b{ right:0;  background:rgba(107,170,107,0.06);border-color:rgba(107,170,107,0.5) }

  .clab{
    position:absolute;top:-62px;width:560px;text-align:center;
    font-size:32px;font-weight:800;letter-spacing:0.06em;opacity:0;
  }
  .clab.a{ left:0;   color:#F5A623 }
  .clab.b{ right:0;  color:#6BAA6B }

  /* narzędzia siedzą tylko po lewej — dawały gotowe, nie dawały dostępu */
  .chip{
    position:absolute;display:flex;align-items:center;gap:11px;
    background:#0D0D0B;border:1.5px solid rgba(245,166,35,0.3);
    padding:11px 18px;font-size:26px;font-weight:700;color:#FAF8F0;opacity:0;
  }
  .chip .logo{ font-size:28px }

  .core{
    position:absolute;left:50%;top:280px;transform:translate(-50%,-50%) scale(0.8);
    background:#13110D;border:2px solid #F5A623;
    box-shadow:0 0 64px rgba(245,166,35,0.22);
    padding:22px 36px;text-align:center;opacity:0;z-index:5;
  }
  .core .wm{ font-size:44px;line-height:1;display:block }
  .core .sub{ font-size:21px;font-weight:600;color:#FAF8F0;opacity:0.6;margin-top:12px }

  .final{
    position:absolute;left:0;right:0;bottom:62px;text-align:center;
    font-size:50px;font-weight:900;color:#F5A623;letter-spacing:-0.02em;z-index:9;opacity:0;
  }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="venn">
        <div class="clab a" id="la">SZYBKO GOTOWE</div>
        <div class="clab b" id="lb">PEŁNY DOSTĘP</div>
        <div class="circ a" id="ca"></div>
        <div class="circ b" id="cb"></div>

        <div class="chip" id="ch0" style="left:96px;  top:186px"><i class="logo logo-make"></i>Make</div>
        <div class="chip" id="ch1" style="left:70px;  top:280px"><i class="logo logo-n8n"></i>n8n</div>
        <div class="chip" id="ch2" style="left:120px; top:374px"><i class="logo logo-zapier"></i>Zapier</div>

        <div class="core" id="core">
          <span class="wm"><i class="logo logo-openmercato"></i></span>
          <div class="sub"><span class="chroma-plate">i jedno, i drugie</span></div>
        </div>
      </div>

      <div class="final" id="final">Tu się długo nie spotykały.</div>
    </div>
  </div>
</div>

<script>
  const beats = gsap.timeline();

  // najpierw zbiór, który wszyscy znają
  beats.to('#ca',   { opacity:1, duration:0.45, ease:"power2.out" }, 0.10);
  beats.from('#ca', { scale:0.86, duration:0.55, ease:"back.out(1.4)" }, 0.10);
  beats.to('#la',   { opacity:1, duration:0.35 }, 0.40);
  beats.to('.chip', { opacity:1, duration:0.30, stagger:0.30, ease:"back.out(1.6)" }, 0.80);

  // dopiero potem drugi — i widać, że narzędzia w nim nie leżą
  beats.to('#cb',   { opacity:1, duration:0.45, ease:"power2.out" }, 2.30);
  beats.from('#cb', { scale:0.86, duration:0.55, ease:"back.out(1.4)" }, 2.30);
  beats.to('#lb',   { opacity:1, duration:0.35 }, 2.60);

  // część wspólna zapala się dopiero, gdy coś w niej stanie
  beats.to('#core',   { opacity:1, scale:1, duration:0.52, ease:"back.out(1.7)" }, 3.55);
  beats.to('.chip',   { opacity:0.40, duration:0.5, ease:"power2.out" }, 4.05);

  beats.to('#final',   { opacity:1, duration:0.44, ease:"power3.out" }, 4.55);
  beats.from('#final', { y:22, duration:0.44, ease:"power3.out" }, 4.55);

  const tl = gsap.timeline({ paused:true });
  flowbizScene.titleCard({ tl, text:"SZYBKO ALBO SWOJE?" });
  beats.timeScale(0.70);
  tl.add(beats, 3.90);

  const DURATION = 3.90 + 5.4 / 0.70 + 2.2;
  tl.to({}, { duration:0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "x04-venn", duration: DURATION, tail: 0.4,
    label: "X04 · VENN — SZYBKO vs DOSTĘP · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

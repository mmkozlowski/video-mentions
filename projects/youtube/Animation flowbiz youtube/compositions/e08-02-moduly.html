<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>E08 · 02 — MODUŁY, KTÓRE NIE GADAJĄ · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="scene-shell.css" />
<link rel="stylesheet" href="logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .m-label{
    position:absolute;left:0;right:0;top:130px;text-align:center;
    font-size:26px;font-weight:600;color:#3A3630;
    letter-spacing:0.36em;text-transform:uppercase;opacity:0;
  }
  .m-box{
    position:absolute;background:#0D0D0B;
    border:1.5px solid rgba(245,166,35,0.22);
    padding:26px 34px;font-size:30px;font-weight:600;color:#FAF8F0;
    letter-spacing:0.01em;opacity:0;white-space:nowrap;
  }
  .m-final{
    position:absolute;left:0;right:0;top:880px;text-align:center;
    font-size:52px;font-weight:800;color:#C0553A;letter-spacing:-0.01em;opacity:0;
  }
  .m-svg{position:absolute;inset:0;pointer-events:none;z-index:1}
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">
    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs><pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
        <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
      </pattern></defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="m-label" id="label"><span class="chroma-plate amber">OSIEM MODUŁÓW, ZERO POŁĄCZEŃ</span></div>

      <svg class="m-svg" id="msvg" viewBox="0 0 1920 1080"></svg>

      <div class="m-box b" style="left:180px;  top:280px">Pracownicy</div>
      <div class="m-box b" style="left:560px;  top:400px">Urlopy</div>
      <div class="m-box b" style="left:980px;  top:270px">Zamówienia</div>
      <div class="m-box b" style="left:1380px; top:390px">Klienci</div>
      <div class="m-box b" style="left:250px;  top:560px">Faktury</div>
      <div class="m-box b" style="left:680px;  top:660px">Magazyn</div>
      <div class="m-box b" style="left:1080px; top:570px">Produkcja</div>
      <div class="m-box b" style="left:1450px; top:660px">Raporty</div>

      <div class="m-final" id="final">Żaden nie wie o drugim.</div>
    </div>
  </div>
</div>

<script>
  const tl = gsap.timeline({ paused: true });
  const boxes = gsap.utils.toArray(".m-box.b");

  tl.to("#label", { opacity:1, duration:0.30, ease:"power2.out" }, 0.0);

  // 0.25s — moduły wskakują sprężyną, jeden po drugim, w losowej kolejności
  tl.fromTo(boxes,
    { opacity:0, scale:0.82 },
    { opacity:1, scale:1, duration:0.38, stagger:{ each:0.13, from:"random" }, ease:"back.out(1.7)" },
    0.25
  );

  // 1.9s — krótkie drgnięcie: każdy próbuje się z czymś połączyć i nic
  tl.to(boxes, {
    x:"+=6", duration:0.08, yoyo:true, repeat:3,
    stagger:{ each:0.04, from:"random" }, ease:"power1.inOut"
  }, 1.95);

  // 2.6s — obramowania gasną do szarości: żywe moduły, martwy system
  tl.to(boxes, { borderColor:"#2E2C28", duration:0.5, stagger:0.03, ease:"power2.out" }, 2.60);

  // 3.0s — puenta
  tl.to("#final", { opacity:1, duration:0.40, ease:"power3.out" }, 3.00);
  tl.from("#final", { y:24, duration:0.40, ease:"power3.out" }, 3.00);

  tl.to({}, { duration:0.4 }, 3.5);

  flowbizScene.init({
    id: "e08-02",
    duration: 3.9,
    tail: 0.4,
    label: "E08 · 02 · MODUŁY NIE GADAJĄ · 3.9s",
    timeline: tl
  });
</script>
</body>
</html>

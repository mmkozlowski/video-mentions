<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>Scene 09 — 30 zmiennych (pan-path) · flowbiz.pl</title>
<meta name="viewport" content="width=device-width,initial-scale=1" />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="scene-shell.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<script src="recorder.js"></script>
<script src="scene-shell.js"></script>
<style>
  .tpp-eyebrow{
    position:absolute;left:50%;top:90px;transform:translateX(-50%);
    font-size:22px;font-weight:600;letter-spacing:0.24em;
    z-index:5;opacity:0;
  }
  .tpp-counter{
    position:absolute;left:50%;bottom:110px;transform:translateX(-50%);
    font-size:20px;font-weight:600;color:#5A5450;letter-spacing:0.18em;
    z-index:5;font-variant-numeric:tabular-nums;opacity:0;
  }
  .tpp-counter b{ color:#F5A623; }

  /* Big "30" counter that sits in the corner — gives the scene its punchline */
  .tpp-bignum{
    position:absolute;right:140px;top:80px;
    z-index:5;
    text-align:right;
    opacity:0;
  }
  .tpp-bignum .big{
    font-size:120px;font-weight:900;color:#F5A623;line-height:0.9;letter-spacing:-0.04em;
    font-variant-numeric:tabular-nums;
  }
  .tpp-bignum .small{
    font-size:18px;font-weight:600;color:#5A5450;letter-spacing:0.28em;margin-top:4px;
  }

  .tpp-fade{ position:absolute;top:0;bottom:0;width:240px;z-index:6;pointer-events:none; }
  .tpp-fade.left { left:0;  background:linear-gradient(to right, #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  .tpp-fade.right{ right:0; background:linear-gradient(to left,  #0A0A08 0%, rgba(10,10,8,0.7) 50%, transparent 100%); }
  body.chromakey .tpp-fade{ display:none !important; }

  .tpp-track{
    position:absolute;left:0;top:0;
    height:1080px;
    will-change:transform;
    z-index:2;
  }
  .tpp-svg{
    position:absolute;left:0;top:0;height:1080px;
    overflow:visible;
  }

  .tpp-node{
    position:absolute;
    width:150px;height:150px;border-radius:50%;
    border:2px solid rgba(245,166,35,0.30);
    background:#0D0D0B;
    transform:translate(-50%,-50%) scale(0);
    display:flex;align-items:center;justify-content:center;
    z-index:3;
    transition:border-color 0.4s ease, box-shadow 0.4s ease;
  }
  .tpp-node i{ font-size:56px;color:#F5A623;line-height:1; }
  .tpp-node.active{
    border-color:#F5A623;
    box-shadow:0 0 0 6px rgba(245,166,35,0.10), 0 0 48px rgba(245,166,35,0.42);
  }
  /* "more" station — final ghost node showing "+22" */
  .tpp-node.more{ border-style:dashed; border-color:rgba(245,166,35,0.4); }
  .tpp-node.more i{ display:none; }
  .tpp-node.more .plus{
    font-size:40px;font-weight:900;color:#F5A623;line-height:1;letter-spacing:-0.02em;
  }

  .tpp-label{
    position:absolute;
    transform:translate(-50%, 0);
    text-align:center;
    z-index:3;opacity:0;
    min-width:240px;
  }
  .tpp-label .num{ font-size:16px;font-weight:700;letter-spacing:0.28em;color:#F5A623;margin-bottom:8px; }
  .tpp-label .title{ font-size:44px;font-weight:800;color:#FAF8F0;letter-spacing:-0.01em;line-height:1.05; }
  .tpp-label .desc{ font-size:20px;font-weight:500;color:#FAF8F0;opacity:0.6;margin-top:6px; }

  .tpp-pulse{
    position:absolute;left:0;top:0;
    width:22px;height:22px;border-radius:50%;
    background:#F5A623;
    transform:translate(-50%,-50%) scale(0);
    z-index:1;
    box-shadow:0 0 24px rgba(245,166,35,0.65);
  }

  .tpp-deco{
    position:absolute;width:6px;height:6px;border-radius:50%;
    background:rgba(245,166,35,0.45);
    transform:translate(-50%,-50%);
    z-index:1;opacity:0;
  }

  body.chromakey .tpp-node{ background:#0D0D0B !important; }
</style>
</head>
<body>
<div class="wrap" id="wrap">
  <div class="stage" id="stage">

    <svg class="grid" viewBox="0 0 1920 1080" preserveAspectRatio="none" aria-hidden="true">
      <defs>
        <pattern id="g100" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
          <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.04)" stroke-width="1"/>
        </pattern>
      </defs>
      <rect width="1920" height="1080" fill="url(#g100)"/>
    </svg>

    <div class="scene">
      <div class="tpp-eyebrow" id="eyebrow">
        <span class="chroma-plate amber">ILE ZMIENNYCH WCHODZI W WYCENĘ</span>
      </div>

      <div class="tpp-bignum" id="bignum">
        <div class="big" id="bignumVal">0</div>
        <div class="small"><span class="chroma-plate">ZMIENNYCH</span></div>
      </div>

      <div class="tpp-track" id="track">
        <svg class="tpp-svg" id="svg" aria-hidden="true">
          <defs>
            <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
              <feGaussianBlur stdDeviation="6" result="b"/>
              <feMerge>
                <feMergeNode in="b"/>
                <feMergeNode in="SourceGraphic"/>
              </feMerge>
            </filter>
          </defs>
          <path id="pathBg" d="" fill="none" stroke="rgba(245,166,35,0.18)" stroke-width="2" stroke-linecap="round" stroke-dasharray="6 10"/>
          <path id="pathFg" d="" fill="none" stroke="#F5A623" stroke-width="3" stroke-linecap="round"
                pathLength="1" stroke-dasharray="1" stroke-dashoffset="1" filter="url(#glow)"/>
        </svg>

        <div class="tpp-pulse" id="pulse"></div>
      </div>

      <div class="tpp-fade left"></div>
      <div class="tpp-fade right"></div>

      <div class="tpp-counter" id="counter">
        <span class="chroma-plate"><b id="counterNow">01</b> / <span id="counterTot">08</span></span>
      </div>
    </div>
  </div>
</div>

<script>
  // 8 stations — wycena zmienne (ostatni = "+22 inne")
  const NODES = [
    { x: 600,  y: 540, icon:"ti ti-chart-bar",              num:"01", title:"Ilość",      desc:"sztuk w zamówieniu",  labelBelow:true  },
    { x: 1300, y: 360, icon:"ti ti-droplet",                num:"02", title:"Kolor",      desc:"farby + tinty",       labelBelow:false },
    { x: 2000, y: 700, icon:"ti ti-pencil",                 num:"03", title:"Nadruk",     desc:"powierzchnia + DPI",  labelBelow:true  },
    { x: 2700, y: 420, icon:"ti ti-clock",                  num:"04", title:"Czas",       desc:"produkcji",           labelBelow:false },
    { x: 3400, y: 620, icon:"ti ti-stack-2",                num:"05", title:"Materiał",   desc:"klasy + grubość",     labelBelow:true  },
    { x: 4100, y: 380, icon:"ti ti-truck",                  num:"06", title:"Dostawa",    desc:"adres + termin",      labelBelow:false },
    { x: 4800, y: 580, icon:"ti ti-tool",                   num:"07", title:"Robocizna",  desc:"setup + ludzie",      labelBelow:true  },
    { x: 5500, y: 480, icon:"ti ti-dots-circle-horizontal", num:"08", title:"+22 inne",   desc:"które tylko on zna",  labelBelow:false, more:true },
  ];

  const STATIONS = NODES.map(n => ({ x: 960 - n.x, y: 540 - n.y }));

  const track = document.getElementById('track');
  const svg   = document.getElementById('svg');
  const pathBg = document.getElementById('pathBg');
  const pathFg = document.getElementById('pathFg');

  const TRACK_W = NODES[NODES.length - 1].x + 960;
  track.style.width = TRACK_W + 'px';
  svg.setAttribute('width', TRACK_W);
  svg.setAttribute('height', 1080);
  svg.setAttribute('viewBox', `0 0 ${TRACK_W} 1080`);

  function buildCurvePath(pts, k=0.32){
    if (pts.length < 2) return "";
    let d = `M ${pts[0].x} ${pts[0].y}`;
    for (let i = 0; i < pts.length - 1; i++){
      const p0 = pts[i - 1] || pts[i];
      const p1 = pts[i];
      const p2 = pts[i + 1];
      const p3 = pts[i + 2] || p2;
      const c1x = p1.x + (p2.x - p0.x) * k;
      const c1y = p1.y + (p2.y - p0.y) * k;
      const c2x = p2.x - (p3.x - p1.x) * k;
      const c2y = p2.y - (p3.y - p1.y) * k;
      d += ` C ${c1x.toFixed(1)} ${c1y.toFixed(1)}, ${c2x.toFixed(1)} ${c2y.toFixed(1)}, ${p2.x} ${p2.y}`;
    }
    return d;
  }

  const PATH_D = buildCurvePath(NODES);
  pathBg.setAttribute('d', PATH_D);
  pathFg.setAttribute('d', PATH_D);

  const totalLen = pathFg.getTotalLength();
  const NODE_T = NODES.map((n) => {
    let best = 0, bestD = Infinity;
    const SAMPLES = 800;
    for (let s = 0; s <= SAMPLES; s++){
      const t = s / SAMPLES * totalLen;
      const p = pathFg.getPointAtLength(t);
      const dx = p.x - n.x, dy = p.y - n.y;
      const d = dx*dx + dy*dy;
      if (d < bestD){ bestD = d; best = t; }
    }
    return best / totalLen;
  });

  NODES.forEach((n, i) => {
    const node = document.createElement('div');
    node.className = 'tpp-node' + (n.more ? ' more' : '');
    node.id = 'node' + i;
    node.style.left = n.x + 'px';
    node.style.top  = n.y + 'px';
    node.innerHTML = n.more
      ? `<span class="plus">+22</span>`
      : `<i class="${n.icon}"></i>`;
    track.appendChild(node);

    const lab = document.createElement('div');
    lab.className = 'tpp-label';
    lab.id = 'lab' + i;
    lab.style.left = n.x + 'px';
    lab.style.top  = (n.y + (n.labelBelow ? 105 : -250)) + 'px';
    lab.innerHTML =
      `<div class="num"><span class="chroma-plate amber">${n.num}</span></div>` +
      `<div class="title">${n.title}</div>` +
      `<div class="desc">${n.desc}</div>`;
    track.appendChild(lab);
  });

  const NUM_DECOS = 24;
  for (let i = 0; i < NUM_DECOS; i++){
    const t = (i + 0.5) / NUM_DECOS;
    const p = pathFg.getPointAtLength(t * totalLen);
    const off = (Math.sin(i * 1.7) * 24);
    const deco = document.createElement('div');
    deco.className = 'tpp-deco';
    deco.style.left = (p.x) + 'px';
    deco.style.top  = (p.y + off) + 'px';
    track.appendChild(deco);
  }

  function activate(i){
    document.querySelectorAll('.tpp-node').forEach(n => n.classList.remove('active'));
    const el = document.getElementById('node' + i);
    if (el) el.classList.add('active');
    document.getElementById('counterNow').textContent = String(i + 1).padStart(2, '0');
  }

  function pulseAt(t){
    const p = pathFg.getPointAtLength(t * totalLen);
    gsap.set('#pulse', { x: p.x, y: p.y });
  }
  pulseAt(NODE_T[0]);

  const tl = gsap.timeline({ paused:true });
  gsap.set(track, { x: STATIONS[0].x, y: STATIONS[0].y });

  // Intro
  tl.fromTo('#eyebrow', { y:-10, opacity:0 }, { y:0, opacity:1, duration:0.4, ease:"power2.out" }, 0.0);
  tl.to('#counter',  { opacity:1, duration:0.4, ease:"power2.out" }, 0.15);
  tl.to('#bignum',   { opacity:1, duration:0.4, ease:"power2.out" }, 0.2);

  // Big counter starts at 0 (revealed when bignum fades in)
  const bignumVal = document.getElementById('bignumVal');
  let bigCounter = { v: 0 };

  tl.fromTo('#node0', { scale:0 }, { scale:1.10, duration:0.45, ease:"back.out(1.7)" }, 0.30);
  tl.to('#node0', { scale:1, duration:0.15, ease:"power2.out" }, 0.75);
  tl.call(() => activate(0), null, 0.55);
  tl.to('#lab0', { opacity:1, duration:0.35, ease:"power2.out" }, 0.70);
  tl.fromTo('#pulse', { scale:0 }, { scale:1, duration:0.35, ease:"back.out(1.7)" }, 0.55);
  tl.to('.tpp-deco', { opacity:1, duration:0.6, ease:"power1.out", stagger:0.015 }, 0.7);

  // First station counter tick → 1
  tl.to(bigCounter, {
    v: 1, duration: 0.3, ease: "power2.out",
    onUpdate: () => { bignumVal.textContent = Math.round(bigCounter.v); }
  }, 0.6);

  gsap.set(pathFg, { attr: { 'stroke-dashoffset': 1 - NODE_T[0] } });

  // 8 stations = faster STEP to keep total reasonable (~9.5s)
  const STEP = 1.05;
  let cursor = 1.15;

  for (let i = 1; i < NODES.length; i++){
    const t = cursor;
    tl.to(track, { x: STATIONS[i].x, y: STATIONS[i].y, duration: 0.7, ease: "power2.inOut" }, t);
    tl.to(pathFg, { attr: { 'stroke-dashoffset': 1 - NODE_T[i] }, duration: 0.7, ease: "power2.inOut" }, t);
    tl.to({ t: NODE_T[i-1] }, {
      t: NODE_T[i], duration: 0.7, ease: "power2.inOut",
      onUpdate: function(){ pulseAt(this.targets()[0].t); }
    }, t);
    tl.fromTo('#node' + i, { scale:0 }, { scale:1.10, duration:0.40, ease:"back.out(1.7)" }, t + 0.35);
    tl.to('#node' + i, { scale:1, duration:0.15, ease:"power2.out" }, t + 0.75);
    tl.call(() => activate(i), null, t + 0.65);
    tl.to('#lab' + i, { opacity:1, duration:0.30, ease:"power2.out" }, t + 0.70);

    // Big counter ticks up (last station jumps to 30 to land the "+22" punchline)
    const target = (i === NODES.length - 1) ? 30 : (i + 1);
    tl.to(bigCounter, {
      v: target,
      duration: (i === NODES.length - 1) ? 0.55 : 0.25,
      ease: "power2.out",
      onUpdate: () => { bignumVal.textContent = Math.round(bigCounter.v); }
    }, t + 0.55);

    cursor = t + STEP;
  }

  // Outro: pulse on +22 node + bignum highlight
  const outroAt = cursor;
  tl.to('#pulse', { scale:1.4, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1 }, outroAt);
  tl.to('.tpp-node.active', { scale:1.04, duration:0.9, ease:"sine.inOut", yoyo:true, repeat:1 }, outroAt);
  tl.to('#bignumVal', { scale:1.08, duration:0.5, ease:"sine.inOut", yoyo:true, repeat:1, transformOrigin:"right center" }, outroAt);

  const DURATION = outroAt + 1.6;
  tl.to({}, { duration: 0.4 }, DURATION - 0.4);

  flowbizScene.init({
    id: "scene-09-pan",
    duration: DURATION,
    tail: 0.4,
    label: "Scene 09 · 30 zmiennych (pan) · " + DURATION.toFixed(1) + "s",
    timeline: tl
  });
</script>
</body>
</html>

<!doctype html>
<html lang="pl">
<head>
<meta charset="utf-8" />
<title>s4 · 100% DOSTĘPU DO KODU · 9:16</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:opsz,wght@9..40,400;9..40,600;9..40,700;9..40,800;9..40,900&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.5.0/dist/tabler-icons.min.css" />
<link rel="stylesheet" href="../../../../Animation flowbiz youtube/compositions/logos.css" />
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  *{ margin:0; padding:0; box-sizing:border-box }
  html,body{ width:1080px; height:1920px; overflow:hidden; background:#0A0A08 }
  .stage{
    position:relative; width:1080px; height:1920px; background:#0A0A08;
    font-family:"DM Sans",system-ui,sans-serif; color:#FAF8F0;
  }
  .grid{ position:absolute; inset:0 }
  .headline{
    position:absolute; left:0; right:0; top:170px; text-align:center;
    font-size:64px; font-weight:900; color:#F5A623; letter-spacing:-0.01em;
    opacity:0;
  }
  .headline small{
    display:block; margin-top:16px; font-size:24px; font-weight:600;
    letter-spacing:0.34em; color:#3A3630; text-transform:uppercase;
  }
  .panel{
    position:absolute; left:110px; width:860px; background:#0D0D0B;
    border:1.5px solid rgba(245,166,35,0.26); padding:30px 40px 34px;
    opacity:0; transform:scale(0.94);
  }
  .panel .cap{
    font-size:24px; font-weight:700; letter-spacing:0.2em;
    text-transform:uppercase; color:#5A5450; margin-bottom:22px;
    display:flex; align-items:center; gap:14px;
  }
  .panel .cap i.logo{ font-size:30px; font-style:normal }
  .om{ top:360px; border-color:#F5A623; box-shadow:0 0 52px rgba(245,166,35,0.14) }
  .om .row{
    display:flex; align-items:center; gap:16px; font-size:32px;
    font-weight:600; padding:10px 0;
  }
  .om .row i.ti{ font-size:30px; color:#F5A623; width:36px }
  .om .row em{ font-style:normal; color:#6BAA6B; font-weight:500;
    margin-left:auto; font-size:24px }
  .lc{ top:800px }
  .tiles{ display:flex; gap:18px; justify-content:center; margin:6px 0 26px }
  .tile{
    width:132px; height:130px; font-size:56px; background:#0A0A08;
    border:2px solid rgba(245,166,35,0.24); border-radius:18px;
    display:flex; align-items:center; justify-content:center;
  }
  .lockrow{
    display:flex; align-items:center; justify-content:center; gap:16px;
    font-size:34px; font-weight:800; color:#C0553A;
  }
  .lockrow i{ font-size:42px }
</style>
</head>
<body>
<div class="stage">
  <svg class="grid" viewBox="0 0 1080 1920" preserveAspectRatio="none" aria-hidden="true">
    <defs><pattern id="g100b" x="0" y="0" width="100" height="100" patternUnits="userSpaceOnUse">
      <path d="M100 0 L0 0 0 100" fill="none" stroke="rgba(245,166,35,0.045)" stroke-width="1"/>
    </pattern></defs>
    <rect width="1080" height="1920" fill="url(#g100b)"/>
  </svg>

  <div class="headline" id="hl">100% dostępu do kodu<small>NAJKRÓTSZA ODPOWIEDŹ</small></div>

  <div class="panel om" id="om">
    <div class="cap"><i class="logo logo-openmercato"></i>OPEN MERCATO</div>
    <div class="row r"><i class="ti ti-folder"></i>modules/<em>czytasz</em></div>
    <div class="row r"><i class="ti ti-folder"></i>core/<em>nadpisujesz</em></div>
    <div class="row r"><i class="ti ti-folder"></i>api/<em>rozbudowujesz</em></div>
  </div>

  <div class="panel lc" id="lc">
    <div class="cap">LOW-CODE / NO-CODE</div>
    <div class="tiles">
      <div class="tile"><i class="logo logo-make"></i></div>
      <div class="tile"><i class="logo logo-n8n"></i></div>
      <div class="tile"><i class="logo logo-zapier"></i></div>
      <div class="tile"><i class="logo logo-retool"></i></div>
    </div>
    <div class="lockrow" id="lock"><i class="ti ti-lock"></i>nie zajrzysz, jak to jest zrobione</div>
  </div>
</div>

<script>
  // t=0 to 17,09 s osi shorta.
  //  0.4 „masz 100% dostęp"            → nagłówek
  //  1.3                                → panel Open Mercato + wiersze repo
  //  3.9 „w low-code/no-code nie zajrzysz" → panel z kłódką
  const tl = gsap.timeline({ paused: true });
  tl.to("#hl", { opacity: 1, duration: 0.6, ease: "power2.out" }, 0.4)
    .to("#om", { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 1.3)
    .fromTo(".om .r", { opacity: 0, x: -26 },
            { opacity: 1, x: 0, duration: 0.4, stagger: 0.35, ease: "power2.out" }, 1.7)
    .to("#lc", { opacity: 1, scale: 1, duration: 0.55, ease: "power3.out" }, 3.9)
    .fromTo("#lock", { opacity: 0 }, { opacity: 1, duration: 0.45 }, 4.7)
    .to({}, { duration: 0.01 }, 7.5);
  window.__sceneTimeline = tl;
  window.__sceneDuration = 7.53;
</script>
</body>
</html>
